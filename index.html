,"下列何者可協助管理品質改善計畫之執行進度？ (A)關聯圖 (B)箭線圖 (C)KJ法(親和圖) (D)過程決策計畫圖。","B"],[848,"單元二：第三章 品質分析方法與應用","以下何種手法之功能類似流程圖用以應用於計畫流程中的各項管制工作？ (A)關聯圖 (B)箭線圖 (C)KJ法(親和圖) (D)過程決策計畫圖。","D"],[849,"單元二：第三章 品質分析方法與應用","在品質管理觀念中，以下何者為強調組織內全員參與改善專案品質，以達成顧客的最高滿意程度？ (A)QC， (B)QA， (C)TQC， (D)TQM。","D"],[850,"單元二：第三章 品質分析方法與應用","在全面品質管理(Total Quality Management，TQM)的循環過程Plan，Do，Check，Action(PDCA)中，QC七大手法比較偏向應用於哪一階段？ (A)Plan， (B)Do， (C)Check， (D)Action。","C"],[851,"單元二：第三章 品質分析方法與應用","以下何種手法之功能可確認每一對策效果，比較改善前、中、後品質特性水準的差異。？ (A)關聯圖， (B)箭線圖， (C)推移圖， (D)過程決策計畫圖。","C"],[852,"單元二：第三章 品質分析方法與應用","品質制度的演進過程為？ (A)品質檢驗→品質管制→品質查證→全面品管→全面品保， (B)品質檢驗→品質查證→品質管制→全面品管→全面品保， (C)品質管制→品質檢驗→品質查證→全面品管→全面品保， (D)品質檢驗→品質管制→品質查證→全面品保→全面品管。","A"],[853,"單元二：第三章 品質分析方法與應用","品質管理發展沿革順序何者有誤？ (A)統計品質管制→全面品質管制→零缺點 (B)全面品質管制→品質查證→全面品質管理 (C)統計流程管制→零缺點→品質查證 (D)作業流程改善→全面品質管制→全面品質管理。","B"],[854,"單元二：第三章 品質分析方法與應用","欲分析主要現象之原因，並擬定重點管理對象的首要QC手法為 (A)特性要因圖， (B)柏拉圖， (C)直方圖， (D)管制圖。","B"],[855,"單元二：第三章 品質分析方法與應用","將問題之結果與可能影響該特性之原因間的關係表示於一張圖形的手法為 (A)柏拉圖， (B)自主檢查表， (C)特性要因圖， (D)管制圖。","C"],[856,"單元二：第三章 品質分析方法與應用","擬定對策型之特性要因圖其魚頭方向？ (A)一律向右， (B)一律向左， (C)可任選， (D)視情況而定。","B"],[857,"單元二：第三章 品質分析方法與應用","將許多不相同之計量值分成不同範圍，以統計其分佈情形，並以平均值、標準差之方式，加以分析之QC手法為(A)柏拉圖 (B)層別法 (C)查核表 (D)直方圖。","D"],[858,"單元二：第三章 品質分析方法與應用","管制圖上若有多少點連續上升或下降，則表示有異常現象？ (A)4， (B)5， (C)6， (D)7。","D"],[859,"單元二：第三章 品質分析方法與應用","整體看起來很模糊的事物，透過哪一種手法分類後可以看得較清晰？ (A)直方圖， (B)層別法， (C)管制圖， (D)散佈圖。","B"],[860,"單元二：第三章 品質分析方法與應用","與歐美國家常用之影響圖(Influence diagram)特性十分雷同的是 (A)關聯圖 (B)親和圖 (C)系統圖 (D)箭線圖。","A"],[861,"單元二：第三章 品質分析方法與應用","把不同個人之意見、想法、經驗等文字資料收集起來，不經取捨與選擇地全部採用，再根據文字資料加以統合，此種新QC手法為 (A)關聯圖 (B)親和圖 (C)過程決定計劃圖 (D)系統圖。","B"],[862,"單元二：第三章 品質分析方法與應用","將達成目的所必須的手段或手法，展開成有系統之圖形，使問題全貌一覽無遺，並使問題的重點明確化，此種新QC手法為 (A)關聯圖 (B)親和圖 (C)過程決定計劃圖 (D)系統圖。","D"],[863,"單元二：第三章 品質分析方法與應用","主成分分析法及多變量分析乃是屬於新七大手法中的哪一種？ (A)矩陣圖 (B)箭線圖 (C)系統圖 (D)矩陣數據解析法。","D"],[864,"單元二：第三章 品質分析方法與應用","為防患未然，將各種可能的結果，隨著事態發展，同時預測與修正，並導入回饋的機制，此種新QC手法為 (A)矩陣圖 (B)箭線圖 (C)系統圖 (D)過程決定策畫圖。","D"],[865,"單元二：第三章 品質分析方法與應用","品質稽核所發現的缺失是屬於 (A)臨界問題 (B)潛在問題 (C)顯在問題 (D)危機問題。","C"],[866,"單元二：第三章 品質分析方法與應用","問題現狀值若用平均值代表時，數據間的變異應 (A)大， (B)小， (C)無關， (D)以上皆非。","B"],[867,"單元二：第三章 品質分析方法與應用","針對對策可能失敗的潛在問題要採取 (A)預防措施， (B)矯正措施， (C)管制措施， (D)應變措施。","A"],[868,"單元二：第三章 品質分析方法與應用","目標達成率高表示 (A)實績值不及目標值， (B)實績值等於目標值， (C)實績值優於目標值， (D)視情況而定。","C"],[869,"單元二：第三章 品質分析方法與應用","效果確認屬於管理循環中的 (A)執行， (B)檢討， (C)規劃， (D)處置。","B"],[870,"單元二：第三章 品質分析方法與應用","施工自主檢查(或抽查)時，以下何者為量化資料？ (A)長度， (B)線型， (C)材質， (D)人員資格。","A"],[871,"單元二：第三章 品質分析方法與應用","全面品質管理(TQM)體系不包含 (A)全員參與 (B)顧客導向 (C)檢(試)驗 (D)教育訓練。","C"],[872,"單元二：第三章 品質分析方法與應用","品管七大工具手法Q7內可以分析問題原因及擬定對策之手法為？ (A)柏拉圖， (B)特性要因圖， (C)管制圖， (D)散布圖。","B"],[873,"單元二：第三章 品質分析方法與應用","散布圖主要用於？ (A)設定主題 (B)發現原因 (C)擬定對策 (D)數據間的相關程度。","D"],[874,"單元二：第三章 品質分析方法與應用","查檢表統計完成後，運用何種Q7分析，以掌握關鍵的問題？ (A)柏拉圖 (B)特性要因圖 (C)管制圖 (D)直方圖。","A"],[875,"單元二：第三章 品質分析方法與應用","對於複雜、混亂的資料整理，何種N7手法為宜？ (A)關聯圖， (B)系統圖， (C)箭線圖， (D)PDPC。","A"],[876,"單元二：第三章 品質分析方法與應用","何種N7手法可以挖掘問題之原因？ (A)PDPC (B)矩陣圖 (C)矩陣數據解析法 (D)關聯圖。","D"],[877,"單元二：第三章 品質分析方法與應用","混凝土蜂窩面積大，其中『面積』是？ (A)檢查項目 (B)品質特性 (C)趨勢 (D)瑕疵單位。","B"],[878,"單元二：第三章 品質分析方法與應用","混凝土蜂窩面積大，其中『混凝土蜂窩』是？ (A)檢查項目， (B)品質特性， (C)趨勢， (D)異常現象。","D"],[879,"單元二：第三章 品質分析方法與應用","混凝土蜂窩面積大，其中『大』是？ (A)檢查項目 (B)品質特性 (C)趨勢 (D)異常現象。","C"],[880,"單元二：第三章 品質分析方法與應用","品質問題分析與解決(品管圈或團結圈)內七大步驟須設定『達成期限』為？ (A)選定品管主題 (B)擬定改善計畫 (C)實施解決問題之對策 (D)訂定品質改善目標。","D"],[881,"單元二：第三章 品質分析方法與應用","使用何種N7手法來評估問題被解決的優先順序？ (A)PDPC， (B)矩陣圖， (C)矩陣數據解析法， (D)關聯圖。","B"],[882,"單元二：第三章 品質分析方法與應用","品質問題分析與解決(品管圈或團結圈)內擬定改善計畫通常使用？ (A)PDPC， (B)矩陣圖， (C)管制圖， (D)甘特圖。","D"],[883,"單元二：第三章 品質分析方法與應用","目前品質的觀念已發展至品質是 (A)製造出來的 (B)設計出來的 (C)管理出來的 (D)習慣出來的。","D"],[884,"單元二：第三章 品質分析方法與應用","用來分析主要現象的原因，並擬定重點管理對象的QC手法為 (A)特性要因圖 (B)柏拉圖 (C)直方圖 (D)管制圖。","B"],[885,"單元二：第三章 品質分析方法與應用","將許多不相同的計量值分成不同範圍，統計其分佈情況，並採用平均值、標準差加以分析的QC手法為 (A)柏拉圖 (B)層別法 (C)查核表 (D)直方圖。","D"],[886,"單元二：第三章 品質分析方法與應用","關於散佈圖下列何者有誤？ (A)可用來探討兩變量間的相關性 (B)為求掌握相關全貌，繪製時不可使用層別法 (C)需先收集成對數據 (D)成對數據若有相關，其相關性不一定全是線性相關。","B"],[887,"單元二：第三章 品質分析方法與應用","為了收集數據，以利於登記整理與分析，而預先設計好檢驗的項目與相關資料，此QC手法為 (A)柏拉圖 (B)層別法 (C)查檢表 (D)直方圖。","C"],[888,"單元二：第三章 品質分析方法與應用","整體看起來很模糊的事務，透過哪一種手法分類後即可看的較清晰？ (A)直方圖 (B)層別法 (C)管制圖 (D)散佈圖。","B"],[889,"單元二：第三章 品質分析方法與應用","將原因及結果、目的與手法等糾纏在一起的現象，以各個要因的因果分析、以便有系統化的連結成圖的新QC手法為 (A)關聯圖 (B)親和圖 (C)系統圖 (D)箭線圖。","A"],[890,"單元二：第三章 品質分析方法與應用","新QC手法中，常用於營建工程管制作業的前後順序者為 (A)矩陣圖 (B)箭線圖 (C)系統圖 (D)過程決策計畫圖。","B"],[891,"單元二：第三章 品質分析方法與應用","與歐美國家常用的影響圖(Influence diagram)特性十分雷同的是 (A)關聯圖 (B)親和圖 (C)系統圖 (D)箭線圖。","A"],[892,"單元二：第三章 品質分析方法與應用","從問題現象中找出成對要素，採用行列配置，在其交叉點上表示各要素的關聯性，此新QC手法為 (A)散佈圖 (B)層別法 (C)矩陣圖 (D)管制圖。","C"],[893,"單元二：第三章 品質分析方法與應用","如果對問題的定義認識不夠明確，則可使用 (A)查檢表 (B)柏拉圖 (C)親和圖 (D)箭線圖來釐清。","C"],[894,"單元二：第三章 品質分析方法與應用","將達到目的所必須的手段或手法，展開成有系統之圖形，使問題全貌了覽無遺，此新QC手法為 (A)關聯圖 (B)親和圖 (C)過程決定計畫圖 (D)系統圖。","D"],[895,"單元二：第三章 品質分析方法與應用","目標訂定若以年為單位，則目標維持期間應該 (A)少於一年 (B)半年 (C)超過一年 (D)以上均可。","C"],[896,"單元二：第三章 品質分析方法與應用","改善後的效果是否能維持首靠 (A)品質稽核 (B)嚴格監督 (C)標準化 (D)以上皆非。","C"],[897,"單元二：第三章 品質分析方法與應用","量化資料是以數值(數據)呈現之資料，下列何者是量化資料？ (A)施工查核缺失項目 (B)工程性質 (C)材料類別 (D)壓實度。","D"],[898,"單元二：第三章 品質分析方法與應用","質化資料又稱為類別資料，下列何者是質化資料？ (A)施工查核缺失項目 (B)瀝青溫度 (C)水灰比 (D)壓實度。","A"],[899,"單元二：第三章 品質分析方法與應用","品管七大工具手法Q7中有 (A)關聯圖 (B)系統圖 (C)柏拉圖 (D)矩陣圖。","C"],[900,"單元二：第三章 品質分析方法與應用","品管新七大工具手法N7中有 (A)特性要因圖 (B)箭線圖 (C)管制圖 (D)散佈圖。","B"],[901,"單元二：第三章 品質分析方法與應用","被稱為80-20法則，可運用在工作現場改善作業，針對關鍵原因尋求解決對策，大幅改善品質缺失的QC手法為 (A)關聯圖 (B)親和圖 (C)柏拉圖 (D)箭線圖。","C"],[902,"單元二：第三章 品質分析方法與應用","特性要因圖中在背骨上下兩側記入大骨之大要因，大要因4M+E分類法中不包括 (A)人員 (B)量測 (C)機具 (D)環境。","B"],[903,"單元二：第三章 品質分析方法與應用","將混凝土抗壓強度試驗結果分組，計算各組發生次數，再將各組次數畫成柱狀圖，根據圖形觀察試驗數據的平均值(集中趨勢)與分佈(離散趨勢)範圍之QC手法是 (A)關聯圖 (B)親和圖 (C)柏拉圖 (D)直方圖。","D"],[904,"單元二：第三章 品質分析方法與應用","藉由抽取樣本進行統計運算求得算術平均值(Mean)及全距(Range)，進而試算出中心線(CL)所在位置，分別加減3個標準差而成為管制上界限(UCL)及下界限(LCL)的QC手法為 (A)管制圖 (B)特性要因圖 (C)箭線圖 (D)散佈圖。","A"],[905,"單元二：第三章 品質分析方法與應用","運用關聯圖分析時，將原因以短句方式寫在一張卡片上。原因型的詞句結構，原則上是名詞加上(A)名詞 (B)形容詞 (C)動詞 (D)副詞。","B"],[906,"單元二：第三章 品質分析方法與應用","利用樹木分枝圖形，由左至右，從樹幹、大枝、中枝、小枝，乃至於細枝，有層次的展開，進而尋求達到某種目的或目標最適當的手段或策略的QC手法為 (A)系統圖 (B)關聯圖 (C)柏拉圖 (D)矩陣圖。","A"],[907,"單元二：第三章 品質分析方法與應用","像權責矩陣這種將因素群按照二元配置或多元配置，以因素之交點來表示因素間關聯程度的QC手法為 (A)關聯圖 (B)系統圖 (C)柏拉圖 (D)矩陣圖。","D"],[908,"單元二：第三章 品質分析方法與應用","箭線圖工作天數計算不包括計算 (A)最早起始點ES (B)最晚起始點LS (C)樂觀起始時間OS (D)全部寬裕時間總浮時TF。","C"],[909,"單元二：第三章 品質分析方法與應用","由於某種規格限制會造成直方圖呈 (A)鋸齒型 (B)偏態或絕壁型 (C)離島型 (D)常態型。","B"],[910,"單元二：第三章 品質分析方法與應用","兩個不同群體混合會造成直方圖呈 (A)鋸齒型 (B)離島型 (C)常態型 (D)雙峰型。","D"],[911,"單元二：第三章 品質分析方法與應用","原因追求型之特性要因圖其魚頭方向 (A)向右 (B)向左 (C)可任選 (D)視情況而定。","A"],[912,"單元二：第三章 品質分析方法與應用","散佈圖中，各散佈點呈現球形分佈時，表示兩變數間呈 (A)正相關 (B)負相關 (C)強正相關 (D)不相關。","D"],[913,"單元二：第三章 品質分析方法與應用","管制圖通常採取平均值加減幾個標準差作為管制界限？ (A)1 (B)2 (C)3 (D)4。","C"],[914,"單元二：第三章 品質分析方法與應用","下列何者非腦力激盪的基本原則？ (A)自由聯想 (B)禁止批評 (C)相互啟發 (D)輪流發言。","D"],[915,"單元二：第三章 品質分析方法與應用","傳統的品管七大工具手法(簡稱Q7)，不包括下列何者？ (A)柏拉圖 (B)特性要因圖 (C)直方圖 (D)關聯圖。","D"],[916,"單元二：第三章 品質分析方法與應用","傳統的品管七大工具手法(簡稱Q7)中，何者必須配合其他手法一起運用？ (A)層別法， (B)散佈圖， (C)查核表， (D)特性要因圖。","A"],[917,"單元二：第三章 品質分析方法與應用","柏拉圖分析的標準結構，在座標軸的橫軸為何？ (A)品質特性， (B)累計百分比， (C)分析項目， (D)以上皆非。","C"],[918,"單元二：第三章 品質分析方法與應用","利用樹木分枝圖形，由左至右，從樹幹、大枝、中枝、小枝，乃至於細枝，有層次的展開，此圖形稱之為？ (A)散佈圖， (B)關聯圖， (C)系統圖， (D)石川圖。","C"],[919,"單元二：第三章 品質分析方法與應用","過程決策計畫圖與下列何者近似？ (A)標準作業程序， (B)箭線圖， (C)KJ圖， (D)以上皆非。","A"],[920,"單元二：第三章 品質分析方法與應用","一般公認為道德倫理之基本要求與最低標準 (A)法律 (B)規範 (C)一般倫理 (D)專業倫理。","A"],[921,"單元二：第三章 品質分析方法與應用","柏拉圖分析用的圖形是由何人發展出來 (A)義大利柏拉圖， (B)美國裘蘭， (C)日本石川馨， (D)日本川喜田二郎。","B"],[922,"單元二：第三章 品質分析方法與應用","後列何者不屬於4M (A)機具(Machine)， (B)材料(Material)， (C)方法(Method)， (D)儀器(Measurement)。","D"],[923,"單元二：第三章 品質分析方法與應用","散佈圖可用於探討何種關係 (A)要因與結果之間， (B)結果與結果之間， (C)要因與其他要因之間， (D)以上均是。","D"],[924,"單元二：第三章 品質分析方法與應用","散佈圖之X坐標值增加時，Y坐標值隨之遞減，亦即兩種品質特性反向變化，稱為 (A)正相關 (B)負相關 (C)無相關 (D)以上均非。","B"],[925,"單元二：第三章 品質分析方法與應用","分析「結果-原因」或「目的-手段」時，挖掘原因間或手段間有糾纏不清、錯綜複雜的關係時，要使用 (A)系統圖， (B)關聯圖， (C)矩陣圖， (D)箭線圖。","B"],[926,"單元二：第三章 品質分析方法與應用","從主題中找出相對應的因素群，把這些因素群按照二元配置或多元配置，以因素之交點來表示因素間關聯程度的圖形，指的是 (A)系統圖 (B)PDPC圖 (C)箭線圖 (D)矩陣圖。","D"],[927,"單元二：第三章 品質分析方法與應用","矩陣圖的T型矩陣，屬於 (A)二元矩陣， (B)三元矩陣， (C)四元矩陣， (D)五元矩陣。","B"],[928,"單元二：第三章 品質分析方法與應用","將矩陣圖之要素間的相關性進行定量化，經由解析計算來分析其關係變化情形，進一步了解問題與原因或者手段與對策間之相互關係強度。指的是下列何者？ (A)矩陣圖 (B)PDPC圖 (C)箭線圖 (D)矩陣數據解析法。","D"],[929,"單元二：第三章 品質分析方法與應用","針對關鍵作業項目的實施計畫，預測該項目可能發生的結果，並對不期望的結果採取必要的因應措施，以導向期望的狀態。此種分析方法是 (A)系統圖 (B)PDPC圖 (C)箭線圖 (D)矩陣數據解析法。","B"],[930,"單元二：第三章 品質分析方法與應用","施工查驗時，發現工程品質不符合要求，屬於 (A)臨界問題 (B)潛在問題 (C)顯在問題 (D)以上均是。","C"],[931,"單元二：第三章 品質分析方法與應用","施工發生重大缺失，已造成停工或危害人員安全與健康等事實者，屬於何者問題？ (A)臨界問題 (B)潛在問題 (C)顯在問題 (D)危機問題。","D"],[932,"單元二：第三章 品質分析方法與應用","要消除品質問題發生的實際原因時，須採取 (A)預防措施， (B)管制措施， (C)矯正措施， (D)應變措施。","C"],[933,"單元二：第三章 品質分析方法與應用","對品質問題實施數據蒐集時，須使用 (A)柏拉圖 (B)推移圖 (C)查檢表 (D)管制圖。","C"],[934,"單元二：第三章 品質分析方法與應用","改善對策納入作業標準後，改善效果卻無法維持，要先檢討 (A)作業標準的內容， (B)作業標準的執行過程， (C)作業標準的訓練， (D)以上均非。","B"],[935,"單元二：第三章 品質分析方法與應用","目標達成率低於1表示 (A)實績值優於目標值， (B)實績值等於目標值， (C)實績值未達目標值， (D)以上均非。","C"],[936,"單元二：第三章 品質分析方法與應用","實施改善對策後，發現改善效果未達預期時，應先檢討 (A)現狀分析層面， (B)對策擬定層面， (C)要因分析層面， (D)對策執行層面。","D"],[937,"單元二：第四章 工程進料檢驗與管制","營建工程因使用之目的不同，粗略的分法有建築工程與土木工程兩大類。進料時的管理方法略為不同。以下何項敘述錯誤？ (A)供應工程系統功能運轉的設施，常稱為器材設備類 (B)土木材料大都以原材或一次加工料為主，建築材料以一次或二次加工之半成品或成品 (C)設備大都由工廠以工業生產組裝方式之成品、組件 (D)以上三項敘述皆是錯誤。","D"],[938,"單元二：第四章 工程進料檢驗與管制","為利業主、監造者、廠商、供應商權責之釐清，以下何項敘述正確？ (A)營造過程中，自規劃設計、發包施工至材料採購各階段，均須建立公平合理的契約與規範性文件 (B)【技術規格】係為規範性文件中規定產品、過程或服務所需符合之技術要求文件 (C)【作業規範】係對於設備結構或產品之設計製造、安裝、維護或使用，建議實際作法或程序之文件 (D)以上項目敘述皆正確。","D"],[939,"單元二：第四章 工程進料檢驗與管制","各項活動為使其在一定程序與範圍下循序獲致秩序的最佳程度所建立之文件稱為標準，由國家級公認之單位核准者稱為下列何者？ (A)國家標準 (B)公司標準 (C)國際標準 (D)歐盟標準。","A"],[940,"單元二：第四章 工程進料檢驗與管制","工程施工材料品質的管控是品質管理的主要項目，材料進料檢驗是一般公認工程品質管理上的關鍵點，我國之國家標準稱為中華民國國家標準，係由下列那一單位訂頒？ (A)經濟部標準檢驗局 (B)財政部標準檢驗局 (C)交通部路政及道安司 (D)經濟部產業技術司。","A"],[941,"單元二：第四章 工程進料檢驗與管制","規定產品，過程或服務所需符合之技術要求文件稱為何？ (A)技術規格 (B)作業規範 (C)契約 (D)補充說明。","A"],[942,"單元二：第四章 工程進料檢驗與管制","對於設備結構或產品之設計製造、安裝、維護或使用，建議實際做法或程序之文件稱為下列何者？ (A)技術規格 (B)作業規範 (C)契約 (D)補充說明。","B"],[943,"單元二：第四章 工程進料檢驗與管制","主要構材在一般狀況正常使用情形下可使用之年限，何者是最重要的因素之一： (A)效用性能 (B)物理性能 (C)耐久性能 (D)化學性能。","C"],[944,"單元二：第四章 工程進料檢驗與管制","為利業主、監造者、承攬廠商、供應商權責之釐清，營造過程中，自規劃設計、發包施工至材料採購各階段，均須建立公平合理的契約與何項文件？ (A)作業性文件 (B)說明性文件 (C)規範性文件 (D)標準性文件。","C"],[945,"單元二：第四章 工程進料檢驗與管制","中華民國國家標準，英文縮寫簡稱為 (A)ASTM (B)JIS (C)DIN (D)CNS 。","D"],[946,"單元二：第四章 工程進料檢驗與管制","工程生命週期包含下列哪些階段 (A)規劃設計 (B)發包施工 (C)維護使用 (D)以上皆是。","D"],[947,"單元二：第四章 工程進料檢驗與管制","為因應國際化，各項標準化活動均儘量配合國際標準(如ISO)，在ISO有關品質系統，列在何系列標準中？ (A)8000 (B)9000 (C)14000 (D)17025。","B"],[948,"單元二：第四章 工程進料檢驗與管制","品質是一項可以藉由量化的技術來管理，因此近年來在品質管理上已可應用何種技術與理念？ (A)測試技術與理念 (B)統計學的技術與理念 (C)操作技術與理念 (D)以上皆非。","B"],[949,"單元二：第四章 工程進料檢驗與管制","圖說與規範規定之內容絕大部分皆取用於具有公信力之標準，我們所熟悉之國際性標準ISO、IEC，各主要經濟國之國家標準ANSI、BS、CNS、DIN、JIS，國際性學(協)會與團體之規格ACI、UL、ASTM等均屬之，以此標準做為設計、採購、製造、施工、檢驗之依據，其中以下何項之標準及其檢驗項目應優先重視？ (A)成本支出 (B)施工設備 (C)景觀美學 (D)公共安全。","D"],[950,"單元二：第四章 工程進料檢驗與管制","下列何者為美國的國家標準？ (A)CNS (B)JIS (C)ASTM (D)ANSI。","D"],[951,"單元二：第四章 工程進料檢驗與管制","ASTM屬於下列何種標準？ (A)團體學(協)會標準 (B)國家標準 (C)區域標準 (D)國際標準。","A"],[952,"單元二：第四章 工程進料檢驗與管制","依據財政部頒定之房屋建築類固定資產耐用年數表，細目中供公共場所用之鋼筋(骨)混凝土建造、預鑄混凝土建造，規定耐用年數為 (A)50 (B)35 (C)25 (D)20年。","A"],[953,"單元二：第四章 工程進料檢驗與管制","供應商為確保產品能滿足客戶規範規定，產品交貨時所提供之品質驗證紀錄，通常稱之為何？ (A)品質證明書、出廠報告 (B)產品目錄 (C)ISO文件 (D)以上皆是。","A"],[954,"單元二：第四章 工程進料檢驗與管制","供應商為確保其產品能滿足客戶需求與市場規範之規定，除於生產過程中，應遵守其內部各項管制規定外，產品交貨時，亦應提供滿足採購契約及規範規定之品質驗證紀錄，通常稱之為品質證明書、出廠報告等。以鋼筋為例：供應商於交貨時，應按何項規範之規定，提供足夠的檢驗數據，作為品質憑證？ (A)CNS 479 (B)CNS 560 (C)ASTM (D)JIS。","B"],[955,"單元二：第四章 工程進料檢驗與管制","我國工程上普遍的定義，就是符合CNS的各項物理、化學、外觀等規格的產品，我們引用後稱其為「材料規範」，而那些測定物理、化學、外觀等規格的方法，我們稱為？ (A)作業規範 (B)契約規範 (C)施工規範 (D)測試規範。","D"],[956,"單元二：第四章 工程進料檢驗與管制","須對其所供應的材料品質負責者為 (A)供應商 (B)業主 (C)承攬廠商 (D)監造單位。","A"],[957,"單元二：第四章 工程進料檢驗與管制","對工程的業主而言，材料品質的責任應由下列何者擔負，並透過採購程序移轉給供應商？ (A)供應商 (B)監造單位 (C)承攬廠商 (D)材料試驗單位。","C"],[958,"單元二：第四章 工程進料檢驗與管制","承攬廠商於材料進場時所作的檢驗或測試工作，其目的旨在確認供應商是否維持何種承諾？ (A)達到業主額外品質要求 (B)維持訂約時之承諾(材料設備採購契約規定) (C)執行國家標準 (D)降低工程成本。","B"],[959,"單元二：第四章 工程進料檢驗與管制","廠商在材料品質管理的立場為何？ (A)建立生管計畫 (B)訂立品質規定 (C)確認材料符合契約規定 (D)做好原件生產品管。","C"],[960,"單元二：第四章 工程進料檢驗與管制","承攬廠商並非產品直接生產者，因此其品管標的並非產品本身，而其品質查證的信心，應建構在何者的品管能力與實際作為上？ (A)設計單位 (B)供應商 (C)監造單位 (D)業主。","B"],[961,"單元二：第四章 工程進料檢驗與管制","在當前工程品質管理環境裡，承攬廠商一直忽略了在材料設備的 (A)設計上 (B)產製上 (C)施作上 (D)運用上，也正在扮演「甲方」的角色，是供應商的甲方。","B"],[962,"單元二：第四章 工程進料檢驗與管制","「監造計畫」，其內容應涵蓋：審查「承攬廠商」所提送執行品管作業之成果，監督「承攬廠商」實際作業狀況與獨立之「抽樣驗證」，「抽樣驗證的目的」是增加對「承攬廠商品管作業」成效的信心，以確認承攬廠商品管功能是否適切與充分發揮為目的，所以當缺失出現時，監造單位不應僅對該批材料作處置，更需作下列何項處理程序，品管手續才完整？ (A)應對「監造單位」的品質計畫作通盤檢討 (B)應對「承攬廠商」的品質計畫與抽驗數量、頻率等作通盤檢討 (C)應對「供應商」的品質計畫與抽驗數量、頻率等作通盤檢討 (D)以上三項敘述皆正確。","B"],[963,"單元二：第四章 工程進料檢驗與管制","監造單位代表業主監造，對材料設備管理之作為，下列何者正確？ (A)擬定生管計畫 (B)擬定品管計畫 (C)查核監工日誌 (D)審查廠商之品管計畫與抽驗進場材料。","D"],[964,"單元二：第四章 工程進料檢驗與管制","對承攬廠商而言，因工程環境或地域因素，必須面對良莠不齊的供應商，承攬廠商除應選擇最符其整體利益的供應商外，亦應按供應商的品質管控能力，建立獨立的 (A)施工計畫 (B)設計計畫 (C)品質計畫 (D)監造計畫。","C"],[965,"單元二：第四章 工程進料檢驗與管制","在當前工程組織中，監造單位可分為 (A)業主自辦 (B)業主委辦 (C)業主交辦 (D)業主自辦與委辦。","D"],[966,"單元二：第四章 工程進料檢驗與管制","下列何單位的功能是監督承攬廠商品質管理作為，並藉抽驗材料品質與審查相關作業文件紀錄，確認承攬廠商所制訂之品質計畫已落實施行及確實有效，而非單純的確認材料設備品質或規格？ (A)設計單位 (B)施工單位 (C)上級單位 (D)監造單位。","D"],[967,"單元二：第四章 工程進料檢驗與管制","監造單位的品質查證信心必須建築在何者有效的品管功能上？ (A)承攬廠商 (B)設計單位 (C)材料供應商 (D)材料製造商。","A"],[968,"單元二：第四章 工程進料檢驗與管制","公有建築物工程中必須勘驗部分，依《建築法》規定，應由承造人會同何者按時申報後,方得繼續施工？ (A)業主(工程主辦機關) (B)監造人 (C)供應商 (D)主管建築機關。","B"],[969,"單元二：第四章 工程進料檢驗與管制","依據建築法第56條第1項規定，公有建築物工程中必須勘驗部分，應由直轄市、縣(市)主管建築機關於核定建築計畫時，指定由何者會同監造人按時申報後，方得繼續施工？ (A)承造人 (B)業主 (C)供應商 (D)設計人。","A"],[970,"單元二：第四章 工程進料檢驗與管制","依據建築法及建築師法規定，監造人應查核建築材料的規格及品質，並填報何種文件？ (A)公共工程監造報表 (B)建築工程必須勘驗部分申報表 (C)材料/設備品質抽驗紀錄表 (D)公共工程施工日誌。","B"],[971,"單元二：第四章 工程進料檢驗與管制","在建築工程必須勘驗部分申報表(B14-2)中，關於鋼筋的法定品質文件，除了「強度試驗報告書」和「出廠證明書」外，還必須查核何種證明書？ (A)氯離子檢測報告書 (B)圓柱試體壓驗報告書 (C)無輻射鋼筋證明書 (D)工廠登記證明書。","C"],[972,"單元二：第四章 工程進料檢驗與管制","在建築工程必須勘驗部分申報表(B14-2)中，關於混凝土的法定品質文件，下列何者非必須查核項目？ (A)氯離子檢測報告書 (B)強度試驗報告書 (C)建築物結構用混凝土細粒料中電弧爐煉鋼爐碴(石)檢測報告書 (D)水泥的正常稠度試驗報告書。","D"],[973,"單元二：第四章 工程進料檢驗與管制","「監造單位」的品管作業應依監造計畫施行，由於其係「業主代表」的身分，契約規定為其應嚴守的標準，其所執行之各項作業，以下何項正確？ (A)應詳細記載於監造報告，如：監造報表或材料設備品質抽驗紀錄表，如有執行抽查測試等工作，亦應將結果或試驗報告判讀並建檔 (B)應詳細記載於監造報告，如：公共工程監造報表或材料設備品質抽驗紀錄表，如有執行抽查測試等工作，不需建檔 (C)監造單位，不需執行抽查測試等工作 (D)以上三項敘述皆錯誤。","A"],[974,"單元二：第四章 工程進料檢驗與管制","監造單位的品管作業應依監造計畫施行，由於其係業主代表的身分，契約規定為其應嚴守的標準，其所執行之各項作業，應詳細記載於 (A)施工報告 (B)會議報告 (C)監工報告 (D)監造報告。","D"],[975,"單元二：第四章 工程進料檢驗與管制","｢承攬廠商｣的｢品質文件｣是以下何項目？ (A)出廠報告、產品品質檢驗報告等 (B)試驗報告、施工日誌 (C)監造報表材料設備品質抽驗紀錄表 (D)以上皆是。","B"],[976,"單元二：第四章 工程進料檢驗與管制","依據材料設備品質管理系統權責分工表，承攬廠商應在品質規格上確立何者規格？ (A)工廠規格 (B)訂貨規格 (C)契約規格 (D)市場規格。","B"],[977,"單元二：第四章 工程進料檢驗與管制","在材料設備品質管理系統權責分工表中，監造單位的「品管標的」為何？ (A)產品品質 (B)供應商品管能力 (C)承攬廠商品管能力 (D)監造者品保能力。","C"],[978,"單元二：第四章 工程進料檢驗與管制","在材料設備品質管理系統權責分工表中，承攬廠商的品管標的為何？ (A)產品品質 (B)供應商品管能力 (C)廠商品管能力 (D)監造者品管能力。","B"],[979,"單元二：第四章 工程進料檢驗與管制","在材料設備品質管理系統權責分工表中，業主的品管標的為何？ (A)產品品質 (B)供應商品管能力 (C)廠商品管能力 (D)監造者品管能力。","D"],[980,"單元二：第四章 工程進料檢驗與管制","依據材料設備品質管理系統權責分工表，供應商執行之品管標的為： (A)產品品質 (B)供應商品管能力 (C)承攬廠商品管能力 (D)以上皆非。","A"],[981,"單元二：第四章 工程進料檢驗與管制","在材料設備品質管理系統權責分工表(表2.1)中，監造單位的「管理制度文件名稱」為何？(A)產品開發、生管計畫 (B)品質計畫 (C)管理計畫 (D)監造計畫。","D"],[982,"單元二：第四章 工程進料檢驗與管制","在工程品質【主辦機關(或專案管理廠商)】監督管理作業常見缺失案例，以下何者敘述正確？ (A)工程契約內未編列【廠商材料設備】之檢驗費用 (B)工程契約內未編列【系統功能運轉】測試費用 (C)未編列監造單位【材料設備】之抽驗費用 (D)以上三項目敘述皆正確。","D"],[983,"單元二：第四章 工程進料檢驗與管制","供應商在產品稽核之稽查內容為下列何者？ (A)確認專案契約符合整體品質策略 (B)確認監造制度符合品質策略 (C)確認生管措施能確保產品規格或功能符合規劃目的 (D)確認各項品管制度之迫切與有效。","C"],[984,"單元二：第四章 工程進料檢驗與管制","監造單位在內部品質稽核上應對下列何者項目稽核？ (A)產品稽核 (B)品管制度稽核 (C)監造制度稽核 (D)施工現場稽核。","C"],[985,"單元二：第四章 工程進料檢驗與管制","依據材料設備品質稽核功能顯示，供應商之稽核為： (A)產品稽核、生管(品保、開發)制度稽核 (B)品質制度稽核 (C)監造制度稽核 (D)管理制度稽核。","A"],[986,"單元二：第四章 工程進料檢驗與管制","依據材料設備品質稽核功能顯示，承攬廠商之稽核為： (A)產品稽核、生管(品保、開發)制度稽核 (B)品質制度稽核 (C)監造制度稽核 (D)管理制度稽核。","B"],[987,"單元二：第四章 工程進料檢驗與管制","依據材料設備品質稽核功能顯示，業主之稽核為： (A)產品稽核、生管(品保、開發)制度稽核 (B)品質制度稽核 (C)監造制度稽核 (D)管理制度稽核。","D"],[988,"單元二：第四章 工程進料檢驗與管制","工程契約內未編列廠商材料設備之檢驗或系統功能運轉測試費用是誰的缺失： (A)主辦機關 (B)監造單位 (C)承攬廠商 (D)主管機關。","A"],[989,"單元二：第四章 工程進料檢驗與管制","以下何項為主辦機關(或專案管理廠商)監督管理作業缺失？ (A)品管費用或品管人員訂有專職及人數等規定者，以人月量化編列 (B)工程契約內未明定監造廠商提報監造計畫與應含內容 (C)工程契約已編列廠商材料設備之檢驗或系統功能運轉測試費用 (D)落實品質督導及查驗紀錄。","B"],[990,"單元二：第四章 工程進料檢驗與管制","下列何者不屬於「監造單位監督管理作業品管缺失案例」中關於監造計畫內容的缺失？ (A)未訂定各材料/設備施工之品質管理標準 (B)未訂定各材料/設備施工之檢驗停留點 (C)施工日誌未落實記載 (D)未訂定品質稽核範圍或頻率。","C"],[991,"單元二：第四章 工程進料檢驗與管制","以下何項為「監造單位」監督管理作業之品管缺失案例？(A)工程標的含運轉類機電設備者，未依單機設備、系統運轉、整體功能試運轉等分別訂定抽驗程序及標準 (B)未實際監督機電設備測試及試運轉 (C)監造單位及其所派駐現場人員未審查廠商「施工計畫、品質計畫、預定進度、施工圖、器材樣品及其他送審案件」或無審查重要分包廠商及設備製造商資格 (D)以上三項敘述皆正確。","D"],[992,"單元二：第四章 工程進料檢驗與管制","未訂定各材料/設備施工之品質管理標準及檢驗停留點是誰的缺失： (A)主辦機關 (B)監造單位 (C)承攬廠商 (D)主管機關。","B"],[993,"單元二：第四章 工程進料檢驗與管制","以下何項為監造單位監督管理作業品管缺失？ (A)依契約規定期限提送監造計畫 (B)已訂定各材料/設備施工之檢驗停留點，且符合需求 (C)監造單位及其所派駐現場人員未落實執行監造計畫 (D)依契約規定填報監造報表，且落實記載。","C"],[994,"單元二：第四章 工程進料檢驗與管制","下列何者在品管制度中，非屬監造單位的缺失？ (A)無品質計畫及施工計畫審查認可紀錄 (B)未於約定檢驗項目會同廠商取樣送驗 (C)未訂定各分項工程施工要領 (D)未監督機電設備測試及試運轉。","C"],[995,"單元二：第四章 工程進料檢驗與管制","以下敘述何者為「承攬廠商」監督管理作業品管缺失？ (A)承攬廠商未提送施工計畫，或施工計畫內容未符合需求，或未落實執行 (B)未訂定品管組織架構內各人員之職掌(專任工程人員及品管人員之職掌) (C)未訂定各分項工程施工要領及品質管理標準 (D)以上皆是。","D"],[996,"單元二：第四章 工程進料檢驗與管制","監造單位對於材料設備之抽樣是基於 (A)工程管理 (B)契約監督 (C)採購管制 (D)出廠驗證。","B"],[997,"單元二：第四章 工程進料檢驗與管制","供應商對於生產過程的材料設備檢驗是基於 (A)工程管理 (B)契約監督 (C)採購管制 (D)出廠驗證。","D"],[998,"單元二：第四章 工程進料檢驗與管制","採購產品品質之驗證，業主、監造單位、承攬廠商與供應商都應對材料品質實施抽驗，承攬廠商執行之目的為： (A)工程管理 (B)契約監督 (C)採購管制 (D)出廠驗證。","C"],[999,"單元二：第四章 工程進料檢驗與管制","以材料品質為例，業主、監造單位、承攬廠商與供應商都應對材料品質實施抽驗，這在管理目的上，各不相同，以下何者”執行者”與”管理目的”對應正確？ (A)業主-工程管理 (B)監造單位-採購管理 (C)承攬廠商-出廠驗證 (D)供應商-契約監督。","A"],[1000,"單元二：第四章 工程進料檢驗與管制","依據採購產品品質之驗證說明，執行者與目的，下列何者正確 (A)承攬廠商-工程管理 (B)承攬廠商-契約監督 (C)承攬廠商-採購管制 (D)承攬廠商-出廠驗證。","C"],[1001,"單元二：第四章 工程進料檢驗與管制","業主、監造單位、承攬廠商與供應商均應實施材料品質抽驗，其中承攬廠商抽驗之目的在於 (A)工程管理 (B)契約監督 (C)採購管制 (D)出廠驗證。","C"],[1002,"單元二：第四章 工程進料檢驗與管制","承攬廠商為確認供應商的材料設備品質，不宜採下列何方式進行？ (A)要求隨貨提送檢測數據 (B)逐批抽樣作允收檢測 (C)要求實施品保制度 (D)由供應商自訂其品保責任。","D"],[1003,"單元二：第四章 工程進料檢驗與管制","以下敘述何者為混凝土施工作業之品質常見缺失？ (A)混凝土澆置、搗實不合規範，有冷縫、蜂窩或孔洞產生 (B)混凝土施工縫及伸縮縫(含填縫材料施作)留設不當或施作不當 (C)混凝土養護不合規範，塑性收縮造成裂縫 (D)以上皆是。","D"],[1004,"單元二：第四章 工程進料檢驗與管制","承攬廠商對業主供應品的品質責任是 (A)保管與維護 (B)品質驗證 (C)採購成本 (D)產品製程管制。","A"],[1005,"單元二：第四章 工程進料檢驗與管制","以下何項為鋼筋施工採購管制作業之品質常見缺失？ (A)主筋或箍筋未綁紮固定確實或箍(繫)筋、彎鉤綁紮不合規範要求 (B)開口或角隅增設補強筋符合規範要求 (C)樑柱接頭錨定彎曲位置超過柱中心線 (D)大小樑交接處，小樑主筋錨定之彎曲位置深入大樑15公分以上。","A"],[1006,"單元二：第四章 工程進料檢驗與管制","以下敘述何者為鋼構施工採購管制作業之品質常見缺失？ (A)抽查合格之螺栓孔邊緣仍無勻整、有破裂及凹凸之鋸齒形痕跡或孔徑、孔邊距、間距及數量不符規定 (B)構件銲接前之組合位置或銲接方式不符規定 (C)銲材保管方式不當，施工前未確實乾燥，銲接時被銲接面有鬆屑、碴銹、油脂等物，或銲縫兩側規定寬度範圍內防銹底漆無刮除 (D)以上皆是。","D"],[1007,"單元二：第四章 工程進料檢驗與管制","以下何項不是模板施工採購管制作業之品質常見缺失？ (A)模板緊密、不漏漿，固定間距之隔件設置良好 (B)模板使用過度，品質不良破損、翹曲，或模板規格不符契約要求 (C)模板組立歪斜 (D)模板內殘留雜物(如木屑、瓶罐)未清理，或未設清潔孔。","A"],[1008,"單元二：第四章 工程進料檢驗與管制","以下何項為鋼構施工採購管制作業之品質常見缺失？ (A)鋼構廠內:鋼板於進料後依契約規定預塗底漆 (B)鋼構工地現場組裝:構件銲接前之組合位置或銲接方式不符規定 (C)鋼構工地現場組裝:抽查合格之銲道無缺陷 (D)鋼構工地現場組裝:構件安裝架設完成後予以補塗裝。","B"],[1009,"單元二：第四章 工程進料檢驗與管制","道路、水利及護坡工程施工採購管制作業在品質常見缺失為下列何者？ (A)隧道支撐工施工不合規範，隧道混凝土襯面施工不合規範，未實施機電設備測試及試運轉，未落實國土保安，復育措施 (B)蛇籠護坡卵石粒徑過大、或未填滿、或蛇籠堆置方式不合規範、或卵石堆砌不合規範，或噴凝土厚度不均勻 (C)地錨位置間距太大、或地錨施加預力不足、或過高 (D)以上皆是。","D"],[1010,"單元二：第四章 工程進料檢驗與管制","以下何項為道路、水利及護坡工程採購管制作業在品質常見缺失？ (A)蛇籠護坡卵石粒徑過大，或未填滿 (B)噴凝土厚度均勻 (C)混凝土管或箱涵接頭已確實封固不漏水 (D)機電設備接地符合規範。","A"],[1011,"單元二：第四章 工程進料檢驗與管制","設備品質管制的三個重點階段，除了工廠生產之單機測試與整體運轉外，還包括哪一階段？ (A)進料檢驗 (B)施工配合 (C)拆除重做 (D)系統設備完成時功能測試。","D"],[1012,"單元二：第四章 工程進料檢驗與管制","下列何者非屬承攬廠商在材料設備品管過程，於契約訂立到材料送審階段，應執行工作重點？ (A)清楚核對契約圖說規範品質要求 (B)尋覓合格供應商 (C)不合格品之處理程序與方式 (D)成立品管相關組織及作業。","C"],[1013,"單元二：第四章 工程進料檢驗與管制","設備加工組合層次較多時，其品質管制(檢驗)重點應偏在 (A)工廠生產到單位測試與設備完成時運轉、系統功能測試兩階段 (B)進場尺寸檢查 (C)施工時 (D)完工運轉時。","A"],[1014,"單元二：第四章 工程進料檢驗與管制","材料設備品質管制在契約訂立到材料送審階段，承攬廠商應 (A)配合業主檢驗 (B)清楚核對契約內圖說、規範之品質要求 (C)建立製程品管資料 (D)進行抽驗。","B"],[1015,"單元二：第四章 工程進料檢驗與管制","材料設備品質管制在契約訂立到材料送審階段，業主應 (A)審核供應商資格 (B)建立相關品質證明文件 (C)檢核材料設備規範 (D)進行抽驗。","C"],[1016,"單元二：第四章 工程進料檢驗與管制","材料設備送審核定階段，供應商需 (A)文件型錄備妥送審 (B)安排生產計畫 (C)檢核採購契約規定與產品是否符合 (D)提出抽檢計畫。","C"],[1017,"單元二：第四章 工程進料檢驗與管制","材料設備送審核定階段，承攬廠商需(A)提出抽檢計畫(B)將供應商提送之材料、設備文件、型錄備妥送業主審查核定(C)提出品質計畫(D)詳訂特別要求。","B"],[1018,"單元二：第四章 工程進料檢驗與管制","材料設備在製造到進料階段主要是在供應商處進行，進料開始則為承攬廠商之作業，因此業主與承攬廠商在品質管制之時點著重在工程進料時之何者項目？ (A)檢驗 (B)數量 (C)成本 (D)運送。","A"],[1019,"單元二：第四章 工程進料檢驗與管制","相較於材料，設備之加工層次較多、較高，且往往需要試車運轉，故其品質管制重點下列何者為非？ (A)進料檢驗 (B)工廠生產之單元測試 (C)系統設備完成時之功能測試 (D)整體運轉。","A"],[1020,"單元二：第四章 工程進料檢驗與管制","在材料設備生產至進料階段，承攬廠商的主要作業是？ (A)辦理驗廠及廠驗 (B)執行材料/設備進料檢驗 (C)確認材料設備是否需依契約規定試車、運轉操作 (D)製作檢驗停留點報表。","B"],[1021,"單元二：第四章 工程進料檢驗與管制","依據鋼筋的檢驗項目，在｢進場檢驗階段｣中，下列何者屬於｢抽驗｣項目？ (A)會磅(重量、交貨單)(B)目視、外觀品質檢查(C)無輻射證明(D)單位質量。","D"],[1022,"單元二：第四章 工程進料檢驗與管制","依據材料設備送審管制，移動式抽水機在資料送審時，不需提送下列哪一項文件？(A)抽水機性能曲線，包含總揚程對出水量的曲線(B)抽水機組構造圖及各部材質說明(C)抽水機組的價格(D)抽水機、柴油引擎、拖車等相互接合圖。","C"],[1023,"單元二：第四章 工程進料檢驗與管制","針對鍍鋅鋼筋等特殊材料或設備，廠商在資料送審前應告知供應商須附的特殊資料，下列何者非必須？ (A)鍍鋅量之含量測試標準 (B)鋼筋母材的氯離子檢測報告 (C)不破壞鍍鋅層之鋼筋加工法 (D)裁切面及加工組立破壞時之補救方法。","B"],[1024,"單元二：第四章 工程進料檢驗與管制","國外供應商所提供產品在廠驗階段，監造單位可採下列何方式辦理？ (A)授權承攬廠商派員進行查證 (B)產品運抵國內後委託試驗單位代檢 (C)委請駐外單位代驗 (D)國外供應商產品無需廠驗。","B"],[1025,"單元二：第四章 工程進料檢驗與管制","無法廠驗國外廠商設備時，不可採取的方式為 (A)授權第三者 (B)進口後委託試驗 (C)借用合格之場所試驗 (D)裝機後再試。","D"],[1026,"單元二：第四章 工程進料檢驗與管制","國外供應商在查證驗廠、廠驗階段，業主及承攬廠商一般均難以配合，可以採用的方式不包含以下何項？ (A)授權第三者(Thirdparty)派員至供應商處進行詳細之查證 (B)運抵國內後委託試驗單位做成品或組件之代檢 (C)借用合格之場所試驗 (D)借用其他廠商查驗結果。","D"],[1027,"單元二：第四章 工程進料檢驗與管制","國外供應商在查證驗廠階段，若委由具國際公信力之公司進行三級檢驗，其中「A級」檢驗方式的審慎程度為何？ (A)最審慎，涵蓋材料試驗分析、工廠組合與試驗、最後檢驗、包裝及完全合格證書等所有相關查證工作 (B)核對工廠在製造過程中所做試驗之紀錄、完整之檢驗與試驗(最終)、核對包裝 (C)僅核對工廠試驗紀錄、包裝前之檢驗、包裝、合格公證書 (D)授權本國駐外單位進行簽認。","A"],[1028,"單元二：第四章 工程進料檢驗與管制","國外供應商查證驗廠，若採「B級」檢驗方式，其主要查核內容不包含下列何者？ (A)核對工廠在製造過程中所做試驗之紀錄 (B)從材料試驗分析、品質製造技術等所有相關查證工作 (C)完整之檢驗與試驗(最終) (D)核對包裝(裝箱)、合格公證書。","B"],[1029,"單元二：第四章 工程進料檢驗與管制","依據材料設備送審管制，在國外供應商的查證驗廠階段，若採「C級」檢驗方式，其主要查核內容不包含下列何者？ (A)完整之檢驗與試驗 (B)核對工廠試驗紀錄 (C)核對包裝 (D)合格公證書。","A"],[1030,"單元二：第四章 工程進料檢驗與管制","國外進口之材料設備在「進場檢驗階段」應附之資料中，下列何者是必備項目？ (A)工廠生產之單機測試報告 (B)國外供應商的驗廠查證紀錄 (C)設備安裝人員的資格證明 (D)海關進口證明文件。","D"],[1031,"單元二：第四章 工程進料檢驗與管制","在材料設備送審核定應注意事項中，關於「整體美學之考量」，下列敘述何者正確？ (A)不銹鋼表面應考量配合構造物採用亮面或霧面 (B)磁磚釉面應一律採用還原釉以提高耐久性 (C)色調應盡量採用對比色以突顯構造物 (D)僅適用於建築工程，土木工程無需考慮。","A"],[1032,"單元二：第四章 工程進料檢驗與管制","材料設備送審時有關顏色選擇時宜送： (A)色彩樣本 (B)施工規範 (C)國家標準 (D)管理標準。","A"],[1033,"單元二：第四章 工程進料檢驗與管制","依據材料設備送審管制，進口產品之進場檢驗階段應附資料中，下列何者不屬於必備項目？ (A)原廠出廠證明及測試文件 (B)業主管理計畫 (C)海關進口證明文件 (D)各項測試紀錄。","B"],[1034,"單元二：第四章 工程進料檢驗與管制","材料設備之送審核定應注意事項，下列何者正確？ (A)整體美學之考量 (B)整體功能之配合 (C)價格與品質評價 (D)以上皆是。","D"],[1035,"單元二：第四章 工程進料檢驗與管制","依據「公共工程施工品質管理作業要點」，材料檢驗或抽驗報告上應印有依標準法授權之實驗室認證機構的認可標誌，該標誌名稱為？ (A)TAF (B)CNS (C)ASTM (D)ISO。","A"],[1036,"單元二：第四章 工程進料檢驗與管制","依據公共工程施工品質管理作業要點第12點規定，鋼筋、混凝土、瀝青混凝土及其他適當檢驗或抽驗項目，應由符合何項國家標準規定之實驗室辦理，並出具檢驗或抽驗報告？ (A)CNS 15030 (B)CNS 17025 (C)CNS 14774 (D)CNS 15980。","B"],[1037,"單元二：第四章 工程進料檢驗與管制","依據「公共工程施工品質管理作業要點」，出具檢驗或抽驗報告的實驗室，其報告應印有依標準法授權之實驗室認證機構的認可標誌，該認證機構名稱是？ (A)財團法人全國認證基金會(TAF) (B)經濟部標準檢驗局(CNS) (C)內政部國土管理署 (D)行政院公共工程委員會。","A"],[1038,"單元二：第四章 工程進料檢驗與管制","關於合格材料設備的倉儲(堆置)管理，下列何種材料屬於「具性能退化性材料」？ (A)砂、石、石材 (B)炸葯、雷管、油漆溶劑 (C)水泥、塑膠材料、油漆 (D)鋼筋、鋼骨。","C"],[1039,"單元二：第四章 工程進料檢驗與管制","在施工完成階段才發現有檢驗不合格之材料設備，可視實際狀況採下列何種方式處理？ (A)補強 (B)拆除重做 (C)減價收受 (D)以上皆可。","D"],[1040,"單元二：第四章 工程進料檢驗與管制","檢驗不合格之材料設備應依工程契約相關規定處理，下列何項目敘述正確？ (A)進料檢驗階段：(1)再試：第一次試驗不合格時，有些規範允許再一次抽驗，若再不合格則確認為不合格。如CNS 560之規定：鋼筋單支取樣之質量檢驗不合之規定時，可再重取二支試樣重驗。(2)退料、拒收：如預拌混凝土加水拌和後超過規範時間 (B)施工配合階段：如場鑄基樁品質偏低，採補樁加強 (C)施工完成階段：(1)補強(2)拆除重做(3)減價收受 (D)以上三項敘述皆正確。","D"],[1041,"單元二：第四章 工程進料檢驗與管制","鋼筋第一次檢驗不合格時，依CNS 560之規定可： (A)退貨 (B)可加倍取樣再送試一次 (C)補料 (D)扣款。","B"],[1042,"單元二：第四章 工程進料檢驗與管制","施工完成後發現結構安全有疑慮者，應採取下列何者措施為宜？ (A)減價驗收 (B)換料 (C)補強或拆除重作 (D)改變用途。","C"],[1043,"單元二：第四章 工程進料檢驗與管制","關於合格材料設備的倉儲(堆置)管理，下列何種材料屬於「具危險性材料」？ (A)水泥、塑膠材料 (B)砂、石、石材 (C)炸葯、雷管、油漆溶劑 (D)鋼筋、鋼骨。","C"],[1044,"單元二：第四章 工程進料檢驗與管制","檢驗不合格材料設備的處理方式中，場鑄基樁品質偏低可依設計者指示辦理「補強」，這是屬於哪一階段的處理方式？ (A)進料檢驗階段 (B)施工完成階段 (C)資料送審階段 (D)施工配合階段。","D"],[1045,"單元二：第四章 工程進料檢驗與管制","在材料設備進料檢驗階段，發現有檢驗不合格之材料設備，不應採下列何方式處理？ (A)再試 (B)退料 (C)拒收 (D)減價收受。","D"],[1046,"單元二：第四章 工程進料檢驗與管制","材料設備在採購管制作業常見缺失案例，以下何項目敘述最適宜？ (A)電氣、弱電、號誌施工，管路保護層不足，管路、電線施工中未防護，放樣不實，或埋設式線槽埋設深度不足，或電導線管、電纜架、導線槽安裝不合規範 (B)電氣、弱電、號誌施工，管路通過建築物之伸縮縫或分隔處，未使用金屬防水軟管連接 (C)電氣、弱電、號誌施工，發電機未依規定固定，或未依規定設置避震裝置 (D)以上皆是。","D"],[1047,"單元二：第四章 工程進料檢驗與管制","施工完成因實際需要先開放使用，在驗收時如發現不合格，但不影響安全及使用功能，又無法改善時，可採 (A)減價收受 (B)換料 (C)全部退料 (D)拆除重作。","A"],[1048,"單元二：第四章 工程進料檢驗與管制","下列何者為實驗室認證的國際標準？ (A)ISO 9001 (B)ISO 14001 (C)ISO 19011 (D)ISO/IEC 17025。","D"],[1049,"單元二：第四章 工程進料檢驗與管制","我國推行實驗室認證的國家標準CNS 17025係依據下列哪一份國際標準進行編撰 (A)ISO 9001 (B)ISO 14001 (C)IS) 19011 (D)ISO/IEC 17025。","D"],[1050,"單元二：第四章 工程進料檢驗與管制","下列何者屬於CNS 17025之一般要求事項？ (A)公正性 (B)文件管制 (C)紀錄管制 (D)內部稽核。","A"],[1051,"單元二：第四章 工程進料檢驗與管制","根據CNS 17025的「公正性」要求，實驗室應持續鑑別對其公正性的風險。此等風險應包括來自下列何者？ (A)實驗室的市場佔有率 (B)實驗室活動、實驗室的關係、或其人員的關係 (C)供應商的生產成本 (D)顧客的投訴歷史。","B"],[1052,"單元二：第四章 工程進料檢驗與管制","下列何者並非CNS 17025規定之資源要求事項？ (A)人員 (B)設施與環境條件 (C)設備 (D)資金。","D"],[1053,"單元二：第四章 工程進料檢驗與管制","依據CNS 17025對「人員」的要求，對實驗室活動有影響的所有人員，無論內部或外部人員，皆應具備哪些特性？ (A)具備碩士以上學歷且經驗豐富 (B)行事公正，具備適任性且依照實驗室管理系統進行工作 (C)僅需具備公正性，技術能力非必要 (D)僅需為內部人員。","B"],[1054,"單元二：第四章 工程進料檢驗與管制","根據CNS 17025的「設施與環境條件」要求，當環境條件對結果之效力有影響時，實驗室應採取何種措施？ (A)立即停止試驗 (B)應監督、管制及記錄環境條件 (C)僅需口頭通知顧客 (D)重新校正所有設備。","B"],[1055,"單元二：第四章 工程進料檢驗與管制","實驗室應確保技術紀錄的修改，能回溯至前一版本或原始觀測，且應保存哪些紀錄？ (A)更改的日期、更改內容的標示及負責更改的人員 (B)僅保存原始觀測數據 (C)僅保存最終報告的副本 (D)僅保存主管的批准文件。","A"],[1056,"單元二：第四章 工程進料檢驗與管制","實驗室為監督測試或校正結果的效力，應透過與其他實驗室的結果比對來監督其表現。此項監督作業應包括下列何者？ (A)參加專業能力測試 (B)參加專業能力測試以外的實驗室間比對 (C)A或B其一或兩者 (D)僅需內部比對。","C"],[1057,"單元二：第四章 工程進料檢驗與管制","根據CNS 17025對「抱怨」的處理過程，傳達給抱怨者的處理結果應由下列何種人員作成、或審查與同意？ (A)實驗室管理階層 (B)未涉及實驗室原問題活動的人員 (C)負責該項活動的人員 (D)顧客指定的律師。","B"],[1058,"單元二：第四章 工程進料檢驗與管制","下列何者並非CNS 17025規定之管理系統要求事項？ (A)文件管制 (B)紀錄管制 (C)公正性 (D)管理階層審查。","C"],[1059,"單元二：第四章 工程進料檢驗與管制","當品質系統或技術作業，被認定不符規定時，應實施下列措施，從調查現況開始並分析問題之根本原因？ (A)預防措施 (B)內稽措施 (C)外稽措施 (D)矯正措施。","D"],[1060,"單元二：第四章 工程進料檢驗與管制","下列敘述，何者不正確？ (A)TAF認證是授予生產廠商 (B)TAF認證是授予測試或校正實驗室 (C)並非取得單一項試驗認證之實驗室對其他材料設備皆可適用 (D)TAF是指財團法人全國認證基金會。","A"],[1061,"單元二：第四章 工程進料檢驗與管制","目前全國認證基金會(TAF)建立的實驗室認證領域不含下列何者？ (A)校正 (B)醫學 (C)土木 (D)檢驗機構。","D"],[1062,"單元二：第四章 工程進料檢驗與管制","TAF之認證係： (A)授予生產廠商 (B)授予實驗室所申請已驗證合格之試驗項目 (C)授予實驗室所申請之全部試驗項目 (D)以上皆可。","B"],[1063,"單元二：第四章 工程進料檢驗與管制","財團法人全國認證基金會(TAF)成立於何時？ (A)2000年 (B)2010年 (C)2003年 (D)1999年。","C"],[1064,"單元二：第四章 工程進料檢驗與管制","下列何者屬於TAF建立的四大認證領域？ (A)校正領域 (B)醫學領域 (C)土木領域 (D)以上皆是。","D"],[1065,"單元二：第四章 工程進料檢驗與管制","下列何者為推行國際實驗室認證相互承認的組織？ (A)TAF (B)CNLA (C)ILAC (D)ISO。","C"],[1066,"單元二：第四章 工程進料檢驗與管制","標準之要義：所謂「規範性文件」包括那些項目？ (A)技術規格：產品(規格、性能)、生產過程、服務水準等所需符合之技術要求 (B)作業規範：建議產品生產過程服務等之作法 (C)法令規章：相關之法律(含條例等)、行政命令、規則 (D)以上皆是。","D"],[1067,"單元二：第四章 工程進料檢驗與管制","下列何者不屬於國際性學(協)會與團體之標準？(A)ACI(B)ASTM(C)CNS(D)UL。","C"],[1068,"單元二：第四章 工程進料檢驗與管制","在標準層級中，可直接在法律或規章中引用而具強制性的是？ (A)技術法規 (B)國家標準 (C)協會標準 (D)企業標準。","A"],[1069,"單元二：第四章 工程進料檢驗與管制","ACI屬於下列何種標準？ (A)團體學(協)會標準 (B)國家標準 (C)區域標準 (D)國際標準。","A"],[1070,"單元二：第四章 工程進料檢驗與管制","在標準層級中，由一個國家內主要的標準化機構所核准，在該國境內公佈並可重複使用者，稱為？ (A)國際標準 (B)國家標準 (C)協會標準 (D)企業標準。","B"],[1071,"單元二：第四章 工程進料檢驗與管制","國家標準(CNS)的使用，屬 (A)強制性 (B)自願性 (C)部分強制性，部分自願性 (D)法令引用也不具 為6.2％，設計含油量為6.0％，規格上限為6.4％，最可能反映了哪種品質狀況？ (A)平均值偏移 (B)全距過大 (C)狀況良好 (D)隨機變異。","A"],[1158,"單元二：第四章 工程進料檢驗與管制","品質管制之方法中，一般而言，工程單位是以何者為主： (A)統計品管 (B)文件品管 (C)檢(抽)驗管制 (D)自主檢查。","C"],[1159,"單元二：第四章 工程進料檢驗與管制","管制圖若發現變異太大且常超出管制線時應 (A)進行預防 (B)設法調整 (C)修訂管制標準或規範值 (D)進行矯正措施或嚴格品管。","D"],[1160,"單元二：第四章 工程進料檢驗與管制","試驗數據顯示皆落在上下管制區間內，但已有五個試驗數據連續向一管制線偏移且將接近臨界點，則應； (A)進行矯正及嚴格控管 (B)進行預防 (C)採取應變措施 (D)以上皆可。","B"],[1161,"單元二：第四章 工程進料檢驗與管制","下列何者屬於「材料設備管制應有的認知」？ (A)品質文件應只在工程結束後才進行彙整。 (B)材料或設備的品質管制應與施工同步。 (C)實驗室只需符合國家標準要求即可。 (D)業主應直接涉入工作執行的層面。","B"],[1162,"單元二：第四章 工程進料檢驗與管制","工程進料檢驗與管制課題，下列何者是最重要之階段？ (A)供應商生產產品前之產品開發與生管計劃及製程品管 (B)材料進場之抽檢驗 (C)施工中材料之隨機取樣檢試驗 (D)施工完工之額外取樣檢試驗(如混凝土鑽心試驗)。","A"],[1163,"單元二：第四章 工程進料檢驗與管制","當設備器材相當繁雜時，承攬廠商應依契約規範彙編成何種文件提送，以利送審管制？ (A)採購契約擬訂表 (B)供應商資格審核表 (C)檢驗與試驗計畫書 (D)材料/設備送審管制總表。","D"],[1164,"單元二：第四章 工程進料檢驗與管制","下列何者在材料/設備送審管制總表內，非屬必記載項目？ (A)價格 (B)型錄 (C)是否取樣試驗 (D)是否驗廠。","A"],[1165,"單元二：第四章 工程進料檢驗與管制","下列何者在材料設備檢(試)驗管制總表，非屬必記載項目？ (A)抽樣日期及數量 (B)試驗及會同人員 (C)規定抽樣頻率 (D)檢試驗費用。","D"],[1166,"單元二：第五章 施工管制與檢驗","將CSD圖彙整納入建築/結構圖中，並提供各分標廠商製作施工大樣圖(施工製造圖)，此結構機電整合界面圖又稱？ (A)BIM (B)CIP (C)SEM (D)以上皆非。","C"],[1167,"單元二：第五章 施工管制與檢驗","管線佈置優先順序，以設備功能為第一考量係屬下列何者整合過程？ (A)CIP (B)SEM (C)CSD (D)以上皆非。","C"],[1168,"單元二：第五章 施工管制與檢驗","圖說製作以建築圖為背景，以CAD套繪空調、給排水系統、消防系統等設計資料，並以顏色設層(Layer)編排完整而成，稱之為何？ (A)CSD圖 (B)SEM圖 (C)管線圖 (D)工作圖。","A"],[1169,"單元二：第五章 施工管制與檢驗","在整合CSD圖過程中，必須考慮各系統之優先順序，管線佈置之順序，應以何者為第一優先考量？ (A)空調風管 (B)匯流排槽 (C)重力排水之污排水管 (D)電纜架。","C"],[1170,"單元二：第五章 施工管制與檢驗","在整合CSD圖過程中，必須考慮各系統之優先順序，機電系統方面，應以何者為第一優先考量？ (A)通訊系統 (B)供電系統 (C)燈光系統 (D)號誌系統。","B"],[1171,"單元二：第五章 施工管制與檢驗","下列何種圖說，主要目的是提供土建廠商於施工過程中將機電系統廠商所需預埋套管、預留開口及設備混凝土基座等，套合成圖？ (A)CSD圖 (B)SEM圖 (C)施工大樣圖 (D)工作圖。","B"],[1172,"單元二：第五章 施工管制與檢驗","結構、機電界面整合圖(SEM)主要目的是： (A)將工程中，所有機電設備部分，包括水電、空調、消防、舞台燈光音響等各主要設備位置與管理路徑作協調配置 (B)以建築圖為背景，以CAD套繪空調、排煙、動力、自動控制、電氣、給排水系統、衛生排水、消防系統、電梯等設計資料 (C)提供土建廠商於施工過程中將機電系統廠商所需預埋套管、預留開口及設備混凝土基座等，套合成圖 (D)以上皆是。","C"],[1173,"單元二：第五章 施工管制與檢驗","管線佈置之權重，以功能為第一考量、管徑大小為第二考量，因此，權重依序為： (A)匯流排槽、電纜架、重力排水之污排水管、空調風管…等 (B)重力排水之污排水管、空調風管、匯流排槽、電纜架…等 (C)空調風管、匯流排槽、電纜架、重力排水之污排水管…等 (D)以上皆可。","B"],[1174,"單元二：第五章 施工管制與檢驗","何種圖樣係為工程計畫中，土建工程為配合機電系統安裝，並於結構安全考量下，彙整納入建築/結構圖中，並提供各分標廠商製作施工大樣圖？ (A)建築整合界面圖(B)結構整合界面圖(C)結構、機電整合界面圖(D)機電整合界面圖。","C"],[1175,"單元二：第五章 施工管制與檢驗","在整合CSD｢機電整合界面圖｣過程中，必須考慮各系統之優先順序，管線佈置之順序，以何者為第一考量？ (A)施工 (B)管徑厚薄 (C)管徑大小 (D)功能。","D"],[1176,"單元二：第五章 施工管制與檢驗","下列何者非SEM(Structural, Electricaland Mechanical)「結構、機電整合界面圖」，提供土建廠商於施工過程中將機電系統廠商所需？ (A)顏色設層 (B)預埋套管 (C)預留開口 (D)設備混凝土基座。","A"],[1177,"單元二：第五章 施工管制與檢驗","對於施工界面整合，SEM的S與E，概略的說各分別代表？ (A)結構、機電 (B)建築、水電 (C)高程、材質 (D)時間、空間。","A"],[1178,"單元二：第五章 施工管制與檢驗","在施工界面整合過程，SEM圖製作流程的首要步驟是？ (A)協調水、電、環控設施，調整路徑高程 (B)確定CSD圖各系統間衝突點已經初步排除 (C)以建築圖為背景，套繪空調、排煙、電氣、衛生排水、消防系統、電梯等 (D)製作圖面，計算數量。","B"],[1179,"單元二：第五章 施工管制與檢驗","機電整合界面圖-CSD與結構機電整合界面圖-SEM之關係？ (A)無關係 (B)先後順序關係 (C)併行關係 (D)以上皆非。","B"],[1180,"單元二：第五章 施工管制與檢驗","下列哪一項為工程計畫中，土建工程為配合機電系統安裝，並於結構安全考量下，綜整各關聯廠商所提之意見需求，將其所需之開口、基座、套管、預埋件及管道間等，彙整納入建築/結構圖中，並提供各分標廠商製作施工大樣圖？ (A)CIP (B)SEM (C)CSD (D)CAD。","B"],[1181,"單元二：第五章 施工管制與檢驗","檢討留設於結構體中之管件大小及高程係屬下列何者整合過程？ (A)CIP (B)CSD (C)SEM (D)以上皆非。","C"],[1182,"單元二：第五章 施工管制與檢驗","在結構、機電界面整合圖樣(SEM)作業流程中，若發現有機電設備或管線與建築結構相碰撞衝突時，其解決之措施係 (A)協調修改建築設計圖 (B)協調結構設計修改結構圖 (C)協調水電、機電設施調整路徑高程 (D)請主辦機關辦理變更設計。","C"],[1183,"單元二：第五章 施工管制與檢驗","SEM圖製作流程包含 (A)確定CSD圖各系統間衝突點已經初步排除 (B)依CSD圖套繪於建築/結構圖中確認留設位置 (C)依預留管件之功能需求，檢討留設於結構體中之管件大小及高程 (D)以上皆是。","D"],[1184,"單元二：第五章 施工管制與檢驗","現場發生界面問題，藉由施工界面協調會將界面衝突予以排除，稱為下列何者？ (A)BIM (B)CSD (C)SEM (D)CIP。","D"],[1185,"單元二：第五章 施工管制與檢驗","施工時依CSD圖及SEM圖所檢討出之相關圖面施工仍有衝突時，可藉由何種機制協調解決， (A)施工界面協調會 (B)施工進度會議 (C)品管會議 (D)變更會議。","A"],[1186,"單元二：第五章 施工管制與檢驗","電梯之昇降道、電梯坑、建築主體結構之界面應於何時整合？ (A)開工前 (B)結構體施工前 (C)電梯安裝前 (D)分項計畫撰寫前。","B"],[1187,"單元二：第五章 施工管制與檢驗","廚房牆面需開窗且須設置洗滌龍頭，窗台台度高度應予？ (A)維持原設計 (B)酌予降低 (C)酌予提高 (D)以上皆非。","C"],[1188,"單元二：第五章 施工管制與檢驗","施工界面整合程序，電梯之昇降道以及電梯坑與建築主體結構之界面，宜於何階段加以檢討？ (A)需求編列前 (B)結構體施工前 (C)裝修工程施工前 (D)電梯運載前。","B"],[1189,"單元二：第五章 施工管制與檢驗","電梯工程與結構圖界面檢討程序中，應繪製何種比例尺之剖面及平面套合圖 (A)五分之一 (B)十分之一 (C)二十分之一 (D)五十分之一。","C"],[1190,"單元二：第五章 施工管制與檢驗","電梯工程與結構圖界面檢討程序中，應繪製何種比例尺之鋼筋加工圖，檢討現場可施工性？ (A)五分之一 (B)十分之一 (C)二十分之一 (D)五十分之一。","D"],[1191,"單元二：第五章 施工管制與檢驗","施工界面整合，管道間檢討程序，應繪製何種比例尺之管道間以安排管道位置 (A)五分之一 (B)十分之一 (C)二十分之一 (D)五十分之一。","C"],[1192,"單元二：第五章 施工管制與檢驗","施工廠商在訂定各分項品質計畫時，建議承商應召集相關人員參加品質說明會，以了解主辦機關、監造單位之品質水準及作業程序與工程施工管理細節等要領，主要召集之對象有？ (A)協力商 (B)供應商 (C)領班 (D)以上皆是。","D"],[1193,"單元二：第五章 施工管制與檢驗","下列何者不屬於施工階段之品質管理措施？(A)環保與安全衛生計畫 (B)自主檢查表 (C)設備功能測試運轉與檢測程序與標準 (D)建立並執行工程界面管理。","A"],[1194,"單元二：第五章 施工管制與檢驗","依據公共工程施工品質管理作業要點之規定，查核金額以上工程，品質計畫內容不包括下列何者？ (A)建立管理權責及分工 (B)訂定自主檢查表 (C)矯正與預防措施 (D)外部品質稽核。","D"],[1195,"單元二：第五章 施工管制與檢驗","在分項施工計畫書中不包括下列何者？ (A)人員組織 (B)經費需求 (C)分項預定進度 (D)施工圖說。","B"],[1196,"單元二：第五章 施工管制與檢驗","公告金額以上之公共工程，監造單位須先建立下列何項，作為監造工作之準則？ (A)設計圖說 (B)施工規範 (C)品質計畫 (D)監造計畫。","D"],[1197,"單元二：第五章 施工管制與檢驗","施工廠商建立施工計畫及品質計畫係依據下列何者？ (A)契約圖說 (B)相關法規 (C)監造計畫 (D)以上皆是。","D"],[1198,"單元二：第五章 施工管制與檢驗","查核金額以上工程，施工廠商所提計畫書包括建立管理權責及分工、不合格品管制等章節，係列於下列何項計畫？ (A)整體施工計畫 (B)分項施工計畫 (C)分項品質計畫 (D)整體品質計畫。","D"],[1199,"單元二：第五章 施工管制與檢驗","依據公共工程施工品質管理作業要點規定，多少金額以上之公共工程，監造單位須先建立監造計畫？ (A)150萬 (B)5千萬 (C)預算金額 (D)設計金額。","A"],[1200,"單元二：第五章 施工管制與檢驗","依規定多少金額以上之公共工程，監造單位須先建立監造計畫，以作為監造工作之準則 (A)小額採購 (B)公告金額採購 (C)查核金額採購 (D)巨額採購。","B"],[1201,"單元二：第五章 施工管制與檢驗","依據施工品質管理作業要點之規定，分項工程因性質差異甚大須另成立分項品質計畫其內容至少須包括項目，何項為非？ (A)施工要領 (B)矯正與預防措施 (C)材料及施工檢驗程序 (D)自主檢查表。","B"],[1202,"單元二：第五章 施工管制與檢驗","依據施工品質管理作業要點，訂定各分項品質計畫時，建議承商應先招集相關 (A)協力商 (B)供應商 (C)業主 (D)領班等研討計畫作業內容，上述何項為非。","C"],[1203,"單元二：第五章 施工管制與檢驗","整體施工計畫書為廠商履行契約要求，依契約相關規定所撰寫之專案工程書圖；範圍為？ (A)包括工程開工至完工一切作業 (B)只針對各分項施工計畫書所擬定的作業 (C)只針對分項施工計畫書擬定的基本規畫作業 (D)包括工程投標至完工一切作業。","A"],[1204,"單元二：第五章 施工管制與檢驗","當代科技昌明，廠商撰寫施工計畫等相關文件，得採過去類似標案之送審文件電子檔案為底稿以爭時效，但應考量事項下列何者為正確？ (A)須以另存pdf檔為之 (B)僅就個案工程名稱、送審日期等形式上修改即可 (C)須就此個案不同需求與限制條件全盤考量完整修正 (D)付費委託外部人員書面修正即可。","C"],[1205,"單元二：第五章 施工管制與檢驗","機關辦理新臺幣150萬元以上工程，應於相關採購案之招標文件內編列品管費用應依？ (A)工程規模及性質 (B)營造業法 (C)標準法 (D)職業安全衛生法。","A"],[1206,"單元二：第五章 施工管制與檢驗","查核金額以上工程，施工廠商所提計畫書中包括假設工程計畫，緊急應變防災計畫等章節，係列於下列何者？ (A)整體品質計畫 (B)分項品質計畫 (C)分項施工計畫 (D)整體施工計畫。","D"],[1207,"單元二：第五章 施工管制與檢驗","有機電設備工程，應於下列何種計畫增加設備功能試運轉與檢測程序標準之章節？ (A)整體工程計畫 (B)分項工程計畫 (C)整體品質計畫及分項品質計畫 (D)以上皆非。","D"],[1208,"單元二：第五章 施工管制與檢驗","下列何項計畫書應在開工前送審完成？ (A)分項施工計畫書 (B)分項品管計畫書 (C)整體施工計畫 (D)以上皆是。","C"],[1209,"單元二：第五章 施工管制與檢驗","下列何者不屬分項施工計畫書內容章節？ (A)分項預定進度 (B)分項勞安衛生環境措施 (C)分項品質計畫 (D)驗收移交管理計畫。","D"],[1210,"單元二：第五章 施工管制與檢驗","下列何者不屬分項品質計畫書內容章節？ (A)施工要領 (B)施工品質管理標準 (C)自主檢查表 (D)內部品質稽核及建立品質紀錄管理系統。","D"],[1211,"單元二：第五章 施工管制與檢驗","下列何者為廠商履行契約要求，依契約相關規定所撰寫之專案工程書圖；包括工程開工至完工一切作業之依據？ (A)品質計畫書 (B)整體施工計畫書 (C)契約書及契約圖 (D)施工技術規範。","B"],[1212,"單元二：第五章 施工管制與檢驗","廠商為履行契約要求，依契約相關規定所撰寫之專案工程書圖，包括工程開工至完工一切作業之依據，稱為： (A)整體施工計畫書 (B)整體品質計畫書 (C)分項品質計畫書 (D)分項施工計畫書。","A"],[1213,"單元二：第五章 施工管制與檢驗","依施工計畫書與品質計畫之關係，何項為廠商履行契約要求，並依契約相關規定所撰寫之專案工程書圖；其中包括工程開工至完工一切作業之依據等 (A)分項品質計畫 (B)開工報備 (C)與業主之協調 (D)整體施工計畫書。","D"],[1214,"單元二：第五章 施工管制與檢驗","下列何者不是將施工計畫書分為整體施工計畫書及重要分項施工計畫書的理由？ (A)工程規模較大且複雜 (B)工程師人力不足以撰寫施工計畫 (C)工期較長時 (D)施工計畫書之擬訂及送審將無法全部及時於開工前完成。","B"],[1215,"單元二：第五章 施工管制與檢驗","各分項工程計畫書雖然需提送審查方准進料、施工，惟在施工前契約工法是否安全仍係重要課題，請問依營造業法之規定，是應由誰執行檢討的角色 (A)專任工程人員 (B)工地主任 (C)營造負責人 (D)原設計單位。","A"],[1216,"單元二：第五章 施工管制與檢驗","承包商提出各項施工計畫書審查後，一經函覆需依審查意見表再提送審查時，其修改時限之規定為何？ (A)只要不影嚮工程進度，隨時均可再提送審查 (B)以契約書內容之品質作業規定之時限內提出 (C)依函覆修正計畫書之公文所載時間為限 (D)沒有規定修正之時效規定。","B"],[1217,"單元二：第五章 施工管制與檢驗","工程採購預算金額8百90萬元，廠商應提報品質計畫內容，下列何者為非？ (A)管理權責及分工 (B)材料及施工檢驗程序 (C)自主檢查表 (D)施工品質管理標準。","D"],[1218,"單元二：第五章 施工管制與檢驗","預算金額3,500萬元既設AC路面刨鋪及標線劃設工程，廠商應提報品質計畫內容，下列敘述何者為非？ (A)管理權責及分工 (B)設備功能運轉檢測程序及標準 (C)自主檢查表 (D)施工品質管理標準。","B"],[1219,"單元二：第五章 施工管制與檢驗","各分項施工時須再行詳細之檢討尤其契約工法是否安全，施工廠商之專任工程人員須依何法案先行檢討？ (A)政府採購法 (B)營造業法 (C)職業安全衛生法 (D)保險法。","B"],[1220,"單元二：第五章 施工管制與檢驗","整體施工計畫書之最佳研訂時間？ (A)公告後領標前 (B)領標後投標前 (C)決標後開工前 (D)訂約後開工前。","C"],[1221,"單元二：第五章 施工管制與檢驗","當工程規模較大且複雜、工期較長時，施工計畫書之擬訂及送審，宜將： (A)施工計畫書分為整體施工計畫書及重要分項施工計畫書，依時程建立並送核 (B)整體施工計畫書及重要分項施工計畫書依時程合併送核 (C)整體施工計畫書及整體品質計畫書合併送核 (D)以上皆可。","A"],[1222,"單元二：第五章 施工管制與檢驗","廠商提送分項施工計畫時，應將分項品質計畫及分項進度表併同檢討提送(機電工程尚需增列設備功能運轉測試程序及標準)，下列哪一項不是分項品質計畫內容？ (A)品質管理標準表 (B)施工抽查紀錄表 (C)施工要領 (D)材料及施工檢驗程序。","B"],[1223,"單元二：第五章 施工管制與檢驗","當工程規模較大且複雜、工期較長時，施工計畫書之擬訂及送審，將無法全部及時於開工前完成，因此將施工計畫書分為整體施工計畫書及重要之 (A)分項施工計畫書 (B)分項品質計畫 (C)分項施工進度表 (D)分項施工查驗表。","A"],[1224,"單元二：第五章 施工管制與檢驗","下列何項不是分項品質計畫應有之項目？ (A)施工要領 (B)不合格品之管制 (C)品質管理標準 (D)自主檢查表。","B"],[1225,"單元二：第五章 施工管制與檢驗","為確保工程能如期順利完成，於決標後，廠商製作施工計畫書及品質計畫書後，應即？ (A)分發給工班存查 (B)在規定期限內函知機關、設計單位與監造 (C)在規定期限內須提送審查核可 (D)分發給內稽單位存查。","C"],[1226,"單元二：第五章 施工管制與檢驗","「分項施工計畫書預定送審進度表」應依據何者提出較適宜？ (A)整體施工預定進度表各分項工程預定施工日期 (B)施工計畫書審查作業程序 (C)各機關之公務作業程序流程 (D)工程主辦機關抽查、督導或查驗之日期。","A"],[1227,"單元二：第五章 施工管制與檢驗","品質規定中，工程決標後除了訂約完成並提出計畫書解除列管後方得正式開工，主要認定可開工的關鍵時機取決於 (A)訂約完成手續後，隨時可開工 (B)分項施工計畫書提出後即可工 (C)整體施工計畫書提出後，方可開工 (D)整體施工計畫書和整體品質計畫書提出後，方可開工。","C"],[1228,"單元二：第五章 施工管制與檢驗","開工後須立即施工之分項施工計畫何時送審？ (A)開工後 (B)整體施工計畫核定後 (C)納入整體施工計畫一併送審 (D)以上皆非。","C"],[1229,"單元二：第五章 施工管制與檢驗","分項施工計畫書送審時機為何？ (A)整體施工計畫審查期間 (B)整體施工計畫廠商修正期間 (C)依監造計畫或經核定之分項送審時間 (D)與整體施工計畫同步。","C"],[1230,"單元二：第五章 施工管制與檢驗","下列敘述何者為非 (A)整體施工計畫書為廠商履行契約要求，依契約相關規定所撰寫之專案工程書圖 (B)整體施工計畫書因建築、土木、水利、環境等工程特性不同，可依其特性增減相關內容要項 (C)整體品質計畫為利整體施工品質之管理而建立 (D)分項施工計畫書與分項品質計畫，須單獨撰寫不可合併成一本。","D"],[1231,"單元二：第五章 施工管制與檢驗","下列敘述何者為非？ (A)整體施工計畫書之最佳研訂時間，為決標後至工程開工前提送核可 (B)結構工程相關之分項施工計畫書，應於開工前送審完成 (C)泥作、門窗及裝修工程之分項施工計畫，應於結構體完成後施工前送審完成 (D)景觀工程之分項施工計畫，應於施工前提送審核。","C"],[1232,"單元二：第五章 施工管制與檢驗","施工計畫書與品質計畫在管制作業常見缺失案例包含： (A)工程主辦機關或專案管理廠商在契約內未編列品管費用 (B)工程主辦機關於契約內明定監造廠商提報監造計畫應包含內容 (C)工程主辦機關之抽查、督導或查驗之缺失追蹤改善紀錄確實且完整 (D)監造單位依契約規定期限提送監造計畫。","A"],[1233,"單元二：第五章 施工管制與檢驗","大地結構相關工程分項施工計畫書，應於下列何項階段送審完成？ (A)結構體完成 (B)地下結構體完成 (C)開工前 (D)以上皆非。","C"],[1234,"單元二：第五章 施工管制與檢驗","有關磁磚、花崗石和鋁窗、惟幕牆等分項施工計畫書，應於下列何項階段送審完成？ (A)開工前 (B)結構體完成前 (C)地下結構體完成前 (D)以上皆非。","C"],[1235,"單元二：第五章 施工管制與檢驗","依政府採購法之精神，工程決標則機關與廠商之契約關係即確立，故整體施工計畫書之最佳研訂及提送時間， (A)招標後至開標前 (B)開標後至決標前 (C)決標後至工程開工前 (D)開工後至完工前。","C"],[1236,"單元二：第五章 施工管制與檢驗","品管人員資格、人數及更換規定，應納入招標文件之預算金額門檻？ (A)150萬元 (B)5,000萬元 (C)2億元 (D)以上皆非。","D"],[1237,"單元二：第五章 施工管制與檢驗","每一工程標案品管人員至少1人之預算金額門檻為多少錢？ (A)150萬元 (B)3億元 (C)2億元 (D)2,000萬元以上。","D"],[1238,"單元二：第五章 施工管制與檢驗","品管人員得同時擔任其他法規允許之職務，但不得跨越其他標案，且契約施工期間應在工地執行職務，其工程預算金額門檻？ (A)150萬元 (B)5,000萬元 (C)2億元 (D)以上皆非。","D"],[1239,"單元二：第五章 施工管制與檢驗","公有建築工程採購，土建部分1億2,000萬元，水電部分2,300萬元，採分開招標辦理，依照公共工程施工品質管理作業要點規定，試問此公有建築工地廠商品管人員至少？ (A)1人 (B)2人 (C)3人 (D)4人。","B"],[1240,"單元二：第五章 施工管制與檢驗","各分項施工時，其契約工法是否安全，依營造業法之規定須由施工廠商之下列何者先行檢討？ (A)工地負責人 (B)專任工程人員(C)職業安全衛生人員 (D)品管人員。","B"],[1241,"單元二：第五章 施工管制與檢驗","行政院公共工程委員會函，於新建工程招標文件及契約書內應載明： (A)應定期召開施工講習會或檢討會 (B)於工地現場陳列使用材料樣品及安裝工法展示 (C)設置有關混凝土澆置作業程序等之看板 (D)以上皆是。","D"],[1242,"單元二：第五章 施工管制與檢驗","下列何者為工程主辦機關在管制作業上常見缺失？ (A)未編列監造單位材料設備之抽驗費用 (B)對於監造計畫無核定紀錄，或未確實審查 (C)未將核定之委辦監造單位受訓合格之現場人員或廠商品管人員，填報於工程會資訊網路系統備查 (D)以上皆是。","D"],[1243,"單元二：第五章 施工管制與檢驗","工程契約內未依「公共工程施工品質管理作業要點」規定，明定廠商提報品質計畫與應含之內容，或二千萬元以上工程，未規定品管人員資格、人數及更換規定，是屬於誰的責任缺失？ (A)承包商 (B)監造單位 (C)工程主辦機關 (D)視情況而定。","C"],[1244,"單元二：第五章 施工管制與檢驗","下列何者為監造單位在管制作業上常見缺失？ (A)未依契約規定期限提送監造計畫 (B)未訂定對廠商品質計畫之審查時限 (C)現場人員未依契約規定落實填報監造報表 (D)以上皆是。","D"],[1245,"單元二：第五章 施工管制與檢驗","未訂定各材料/設備及施工之品質管理標準及材料/設備及施工之檢驗停留點，屬於誰的責任缺失？ (A)承包商 (B)監造單位 (C)工程主辦機關 (D)視情況而定。","B"],[1246,"單元二：第五章 施工管制與檢驗","未依契約規定期限提送施工計畫及品質計畫，是屬於誰的責任缺失： (A)承包商 (B)監造單位 (C)工程主辦機關 (D)視情況而定。","A"],[1247,"單元二：第五章 施工管制與檢驗","下列何者為承攬廠商在管制作業上常見缺失？ (A)未依契約規定期限提送品質計畫 (B)未訂定各材料/設備及施工之檢驗時機 (C)施工日誌未落實執行，或記載不完整 (D)以上皆是。","D"],[1248,"單元二：第五章 施工管制與檢驗","工程材料試驗報告之結果出爐，主要認定是否合格與否，在於下列何者？ (A)試驗所在地符合TAF試驗室 (B)試驗之數據符合契約或法規之規定 (C)試驗報告上需有判讀簽章 (D)以上皆是。","D"],[1249,"單元二：第五章 施工管制與檢驗","在執行施工檢驗作業時，監造單位在RC結構建築中進行檢驗停留點查驗的部份，指的是 (A)牆柱和樑版封模、灌漿前 (B)牆、柱封模前 (C)樑、版灌漿前 (D)監造單位自認為有必要時。","A"],[1250,"單元二：第五章 施工管制與檢驗","公有建築工程採購，土建部分10億2,000萬元，水電部分2億3,000萬元，採分開招標辦理，依照公共工程施工品質管理作業要點規定，試問監造單位應置受訓合格之現場人員至少？ (A)1人 (B)2人 (C)3人 (D)4人。","D"],[1251,"單元二：第五章 施工管制與檢驗","下列敘述何者為非？ (A)設計圖為設計單位為表達設計理念之，而將其作為招標文件並訂為工程契約時即稱建築執照圖 (B)施工大樣圖為廠商依據設計圖之規定，配合現場實際狀況及其他配合條件所繪製之圖樣 (C)工作圖為廠商分項工程施工時，對臨時性工程施工順序、機具材料搬運、放置場所之說明所須使用之圖樣 (D)CSD圖為設計階段界面整合重要措施，係作為SEM圖之製作依據，並作為日後施工階段各分標廠商繪製施工圖之依據。","A"],[1252,"單元二：第五章 施工管制與檢驗","對於施工界面整合，CSD是指？ (A)廠商依據設計圖之規定，配合現場實際狀況及其他配合條件所繪製之圖樣 (B)將建築平面圖、結構圖以及電梯剖面圖進行套繪 (C)將工程中的水電、空調、消防、舞台燈光音響等各主要設備位置與管理路徑作協調配置 (D)對設計圖、契約圖、建築執照圖詳細研讀並清圖。","C"],[1253,"單元二：第五章 施工管制與檢驗","工作圖應適用於？ (A)同一廠商承攬之所有標案 (B)委託同一監造單位之工程標案 (C)同一機關招標之標案 (D)單一標案因地制宜。","D"],[1254,"單元二：第五章 施工管制與檢驗","下列何者不屬於工程界面管理所採用之措施？ (A)CSD(Combined 施工管制與檢驗","整合CSD過程中，發現污排水、與自來水管線衝突，應採合整合之管線排序？ (A)1污排水2自來水 (B)1自來水2污排水 (C)無所謂 (D)以上皆非。","A"],[1272,"單元二：第五章 施工管制與檢驗","下列敘述何者為是？ (A)整合CSD過程中，以管徑大小為第一考量、功能為第二考量 (B)CSD圖主要目的是提供土建廠商於施工過程中將機電系統廠商所需預埋套管、預留開口及設備混凝土基座等，套合成圖 (C)CSD繪圖過程中，機電系統方面，則以弱電系統為第一優先考量 (D)施工時除了依CSD及SEM所檢討出之相關圖面施工外，工地仍有許多界面點需檢討，可藉由施工界面協調會將現場發生之界面問題加以檢討。","D"],[1273,"單元二：第五章 施工管制與檢驗","下列何者不是CSD圖製作之主要操作步驟？ (A)以建築圖為背景，以CAD套繪機電、給排水等設計資料，並以顏色設層(Layer)編排完整 (B)依功能檢視設計資料，將各層相互重疊部分逐一檢討，並將產生界面問題部分提出協調，並排除所有衝突點 (C)依預留管件之功能需求，檢討留設於結構體中之管件大小及高程 (D)當CSD完成調整與整合，無衝突疑慮，依CSD內所有系統管線、設備需求，開始製作SEM圖。","C"],[1274,"單元二：第五章 施工管制與檢驗","將所有機電設備各主要設備位置及管理路徑間作協調配置，此項圖面整合工作稱為何？ (A)BIM (B)SEM (C)CIP (D)CSD。","D"],[1275,"單元二：第五章 施工管制與檢驗","施工界面整合，管道間檢討程序，應繪製何種比例尺之管道間詳圖，確認管路安裝可施工性 (A)五分之一 (B)十分之一 (C)二十分之一 (D)五十分之一。","A"],[1276,"單元二：第五章 施工管制與檢驗","施工界面整合，廚房給水管路與開窗界面檢討項，一般建築工程窗台台度約高幾公分？ (A)60 (B)75 (C)90 (D)110。","C"],[1277,"單元二：第五章 施工管制與檢驗","施工界面整合，廚房給水管路與開窗界面檢討項，廚房流理台之水龍頭高度約幾公分？ (A)60 (B)75 (C)90 (D)110。","D"],[1278,"單元二：第五章 施工管制與檢驗","下列何者非屬施工檢驗之程序？ (A)施工前說明會 (B)廠商完成自主檢查後，提出自主檢查成果及進行下一階段施工作業 (C)監造單位進行品質查證作業 (D)施工缺失之處理。","A"],[1279,"單元二：第五章 施工管制與檢驗","在執行施工檢驗作業時，下列敘述何者為對？ (A)廠商進行檢驗停留點與隨機抽查驗 (B)監造單位不須徹底實行全面自主檢查 (C)廠商必須徹底實行全面自主檢查 (D)以上皆非。","C"],[1280,"單元二：第五章 施工管制與檢驗","根據施工經驗，廠商審慎檢討建築、水電等相關設計圖並未繪製圖樣而導致無法補救之缺失 (A)基地圖 (B)施工製造圖 (C)設備圖 (D)剖面圖。","B"],[1281,"單元二：第五章 施工管制與檢驗","在執行施工檢驗作業時，何單位應進行檢驗停留點與隨機抽查驗 (A)設計單位 (B)施工單位 (C)監造單位 (D)上級單位。","C"],[1282,"單元二：第五章 施工管制與檢驗","執行施工檢驗，應先完成品質管理標準及何項審定作業 (A)材料管製表 (B)自主檢查表 (C)不合格品管製表 (D)計價表。","B"],[1283,"單元二：第五章 施工管制與檢驗","為確保施工檢驗有效執行，廠商應於檢驗工作開始前，依據各項工作之特性、步驟、規定、規範等擬具哪種文件送監造單位審核？ (A)自主檢查計畫 (B)監造計畫書 (C)施工檢驗計畫 (D)檢驗資料造冊。","C"],[1284,"單元二：第五章 施工管制與檢驗","辦理施工檢驗程序，監造單位進行品質查證作業之前，廠商應先完成何種作業？ (A)進行施工檢驗與估驗計價 (B)請監造單位視情況進行品質查證作業 (C)進行檢驗停留點與不定期抽查驗 (D)完成自主檢查後，提出自主檢查成果。","D"],[1285,"單元二：第五章 施工管制與檢驗","承包商在完成自主檢查並紀錄於檢查表中後，何時要提出工程檢驗申請單交監造單位進行品質查證作業 (A)自檢表有確實填實並簽名即可 (B)若有缺失應進行改善，並將改善之前、中、後照片備查後 (C)工程檢驗申請單簽名蓋章即可交監造單位查證 (D)有缺失無需改善，俟監造單位查證後，再一併改善即可。","B"],[1286,"單元二：第五章 施工管制與檢驗","屬檢驗停留點之項目，工地負責人書面認可之後須經何作業程序才可進行次項工作？ (A)廠商負責人指示 (B)品管人員內部稽核 (C)向監造單位申請檢驗合格後 (D)機關備查。","C"],[1287,"單元二：第五章 施工管制與檢驗","施工成果缺失係指？ (A)符合設計圖說 (B)符合規範 (C)違背契約約定 (D)未依公司負責人指示。","C"],[1288,"單元二：第五章 施工管制與檢驗","下列哪一製程或施工成果不視為品質缺失項目？ (A)不符合設計圖說 (B)不符合規範 (C)不符合契約規定 (D)不符合時宜。","D"],[1289,"單元二：第五章 施工管制與檢驗","廠商進行自主檢查過程中，屬檢驗停留點之項目，應向哪個單位申請檢驗合格後才可進行次項工作？ (A)監造單位 (B)品管單位 (C)施工單位 (D)主辦機關。","A"],[1290,"單元二：第五章 施工管制與檢驗","施工檢驗程序，廠商自主檢查表，應由何人檢查簽名並經工地負責人書面認可 (A)業主 (B)現場工程師 (C)材料商 (D)監造單位派駐人員。","B"],[1291,"單元二：第五章 施工管制與檢驗","施工檢驗程序，對不符合設計圖說、規範或契約規定之製程或施工成果均視為缺失，如該項缺失經改善須進一步證實者，得由何人申請複驗？ (A)業主 (B)廠商 (C)材料商 (D)監造單位派駐人員。","B"],[1292,"單元二：第五章 施工管制與檢驗","在材料或設備經監造或機關核定後進入工地時，依品管規定在何時，承商即可辦理估驗付款？ (A)主要進場經盤點廠牌、材質和數量，拍照存證即可 (B)先經承商自主檢查合格並檢具檢查或成果資料時 (C)需經監造單位配合查證作業符合規範或審查要求合格後 (D)契約主文有明定可先請領部份款，因此尚不需經查驗即可，以符契約規定。","C"],[1293,"單元二：第五章 施工管制與檢驗","下列何者不屬於施工品質管理標準所涵蓋的項目？ (A)監造單位權責劃分 (B)工作流程之檢查項目 (C)工作流程之檢查標準 (D)不合標準之處置。","A"],[1294,"單元二：第五章 施工管制與檢驗","下列何者不屬於施工品質管理標準之標準值設定應依據的文件？ (A)契約圖 (B)機關首長開工典禮致詞 (C)建築技術規則 (D)甲乙雙方協定數據。","B"],[1295,"單元二：第五章 施工管制與檢驗","為避免造成無謂之困擾，施工品質管理標準應？ (A)事先徵詢施工作業領班的同意 (B)每一項必須指定可量測的精密工具 (C)可以量化者應盡量量化，無法量化者亦應達可檢核之功效 (D)每一項必須事先製作視覺模型或樣品。","C"],[1296,"單元二：第五章 施工管制與檢驗","在施工執行檢驗過程或工程竣工驗收時，遇有對品質標準在契約，法令和施工規範中均查無標準值或規定時，應如何執行檢核功效？(A)由承商自提標準 (B) 由監造單位自行決定 (C)無相關規定以甲乙雙方協定數據為之 (D)以上皆是。","C"],[1297,"單元二：第五章 施工管制與檢驗","品質管理之標準值之設定，若無相關規定，可採何方式解決？ (A)調解 (B)仲裁 (C)訴訟 (D)契約雙方協定數據為之。","D"],[1298,"單元二：第五章 施工管制與檢驗","一般品質管理標準值之設定，下列敘述何者為非 (A)依契約條款 (B)依各縣市營建相關自治法規 (C)依土木水利學會制定之混凝土工程施工規範 (D)若無相關規定亦不得以甲乙雙方協定數據為之。","D"],[1299,"單元二：第五章 施工管制與檢驗","下列對監造單位之敘述何者為非？ (A)除針對檢驗停留點檢查外，亦須不定期抽查驗 (B)監造計畫書內之檢驗停留點位置，應標示明確，抽查驗細項應條列 (C)抽查驗品質管理標準應與承商一致 (D)抽查驗標準值應量化不得定性化。","D"],[1300,"單元二：第五章 施工管制與檢驗","施工品質管理標準之主要依據不包含下列哪一項： (A)契約規定 (B)法令規定 (C)監造要求 (D)施工規範規定。","C"],[1301,"單元二：第五章 施工管制與檢驗","訂定施工品質管理標準之依據為何？ (A)契約相關規定 (B)法令規定 (C)施工規範 (D)以上皆是。","D"],[1302,"單元二：第五章 施工管制與檢驗","施工品質管理標準之依據： (A)契約相關規定 (B)法令規定 (C)具公信力之團體制定之規範，如土木水利學會制定之混凝土工程施工規範等 (D)以上皆是。","D"],[1303,"單元二：第五章 施工管制與檢驗","品質管理標準表內可不包含下列何項 (A)管理標準 (B)檢查頻率 (C)管理紀錄 (D)品質金額。","D"],[1304,"單元二：第五章 施工管制與檢驗","下列何項不是施工品質管理標準之依據 (A)現場施工人員說法 (B)法令規定 (C)施工規範 (D)契約相關規定。","A"],[1305,"單元二：第五章 施工管制與檢驗","工程決標後，得標之施工廠商為解除施工管制，應建立各項施工計畫和品質計畫供審查，其製作計畫資料之內容主要是依據下列何者？ (A)契約 (B)監造計畫 (C)相關法規 (D)以上皆是。","D"],[1306,"單元二：第五章 施工管制與檢驗","下列敘述何者為是？ (A)砌紅磚之開口上方處僅能放置楣梁不得以平拱或尖拱(弧拱)方式施工 (B)管理標準可以量化者應盡量量化，無法量化者亦應定性化 (C)屋頂泛水與女兒牆混凝土可以施工縫方式分次澆築 (D)屋頂防水泛水立面與屋頂版交接處只需以直角方式處理。","B"],[1307,"單元二：第五章 施工管制與檢驗","以砌紅磚工程檢驗為例，每天砌築高度以多少公尺為度、每皮交丁？ (A)1.0m (B)1.2m (C)1.5m (D)2.0m。","C"],[1308,"單元二：第五章 施工管制與檢驗","下列何者非屬鋁門窗工程之檢驗項目 (A)風壓等級 (B)破壞模數 (C)皮膜厚度 (D)塞水路之填縫劑。","B"],[1309,"單元二：第五章 施工管制與檢驗","下列何者非屬石材之檢驗項目？ (A)密度 (B)吸水率 (C)翹曲率 (D)抗壓強度。","C"],[1310,"單元二：第五章 施工管制與檢驗","工程現場人員為確保品質落實至實際現場，應根據何者訂定施工自主檢查表？ (A)每次檢查區位之估驗範圍 (B)實際檢查結果紀錄 (C)監造及承商於現場實施抽查驗結論 (D)施工品質管理標準表。","D"],[1311,"單元二：第五章 施工管制與檢驗","施工過程中品質是否有缺失，必須由檢查並與管理標準值對照是否合格才算數，因此自主檢查的存在至屬重要，請問紀錄該表中之檢查值是由何人執行紀錄 (A)現場工程師 (B)工地主任 (C)品管工程師 (D)以上皆是。","A"],[1312,"單元二：第五章 施工管制與檢驗","廠商自主檢查表之檢查標準及檢查結果欄位應填列？(A)設計圖圖號 (B)契約條款條號 (C)設計標準與檢查結果之量化數據 (D)定性化文字例如符合、OK等。","C"],[1313,"單元二：第五章 施工管制與檢驗","工程現場人員為確保品質，落實至實際現場之最主要表單為何？ (A)施工自主檢查表 (B)局部工程暫時移交供後續施工移交單 (C)分項施工計畫書預定送審進度表 (D)設計界面一覽表。","A"],[1314,"單元二：第五章 施工管制與檢驗","下列對自主檢查表之敘述何者為非？ (A)標明工程作業過程的重點及最可能產生問題的地方 (B)檢查標準明確易懂，判別容易，表格化、紀錄容易 (C)僅能由監工人員按表逐項進行檢查，施工作業領班不能執行檢查工作 (D)標準值依據契約規範國家標準或公認之規範行規數據。","C"],[1315,"單元二：第五章 施工管制與檢驗","按三級品管制度，廠商執行施工檢驗作業全面自主檢查，屬下列何者？ (A)三級品管 (B)二級品管 (C)一級品管 (D)以上皆非。","C"],[1316,"單元二：第五章 施工管制與檢驗","施工期間，監造單位進行檢驗停留點與隨機抽查驗，屬下列何者？ (A)一級品管 (B)二級品管 (C)三級品管 (D)以上皆非。","B"],[1317,"單元二：第五章 施工管制與檢驗","監造單位除隨機抽查驗或針對檢驗停留點檢查，其抽查驗品質管理標準應與承商自主檢查 (A)一致 (B)不同 (C)稍有差異無妨 (D)以上皆可。","A"],[1318,"單元二：第五章 施工管制與檢驗","監造單位除隨機抽查驗或針對檢驗停留點檢查，其抽查驗品質管理標準應與下列何者一致？ (A)設計單位 (B)施工承商 (C)上級機關 (D)督導單位。","B"],[1319,"單元二：第五章 施工管制與檢驗","施工自主檢查表使用方法，檢查後必須 (A)由檢查人員簽字 (B)由檢查人員蓋章 (C)由施工作業領班簽名 (D)由監造工程師蓋章。","A"],[1320,"單元二：第五章 施工管制與檢驗","施工缺失改善就三級品管機制相對比較而言，最具時間成本效益者，應為下列何者？ (A)自主檢查 (B)監造抽查驗 (C)機關督導 (D)施工查核。","A"],[1321,"單元二：第五章 施工管制與檢驗","當原訂之管理標準經監造及承商於現場實施抽查驗與自主檢查後，經統計分析或品質稽核發現無法達成預期成果時，下列何者不是正確的做法？ (A)現場進行缺失改善 (B)執行矯正預防 (C)直接修訂原訂之計畫或標準，以符合工程實需 (D)修訂後之標準於實施前，應對相關員工做教育訓練。","C"],[1322,"單元二：第五章 施工管制與檢驗","自主檢查表應具備的條件包含： (A)檢查標準明確易懂，判別容易； (B)檢查之順序步驟依序編排； (C)合乎工地實用，表格化、紀錄容易； (D)以上皆是。","D"],[1323,"單元二：第五章 施工管制與檢驗","當原訂管理標準於現場實施抽查驗與自主檢查後，經統計分析或品質稽核發現無法達成預期成果時： (A)須由現場進行缺失改善 (B)須由現場進行矯正預防 (C)須將方法、經驗知識化，回饋給公司、監造、設計單位 (D)以上皆是。","D"],[1324,"單元二：第五章 施工管制與檢驗","品管制度品質循環(PDCA)包括下列何項？ (A)缺失改善矯正預防 (B)管理稽核統計分析 (C)經驗傳承業界分享 (D)以上皆是。","D"],[1325,"單元二：第五章 施工管制與檢驗","施工自主檢查表至少必須具備何種條件？ (A)檢查標準明確易懂，判別容易 (B)合乎工地實用，表格化、紀錄容易 (C)儲存檢查紀錄，容易查證 (D)以上皆是。","D"],[1326,"單元二：第五章 施工管制與檢驗","自主檢查表應具備條件為： (A)檢查標準明確易懂，判別容易 (B)檢查項目依步驟之順序序編排 (C)合乎工地實用，表格化、紀錄容易 (D)以上皆是。","D"],[1327,"單元二：第五章 施工管制與檢驗","當原訂之管理標準經監造及承商於現場實施抽查驗與自主檢查後，經統計分析或品質稽核發現無法達成預期成果時，則應： (A)由現場進行缺失改善或矯正預防 (B)檢討是否調整、修定原訂之計畫或標準，以符合工程實需 (C)修訂後之標準於實施前，應對相關員工做教育訓練 (D)以上皆是。","D"],[1328,"單元二：第五章 施工管制與檢驗","廠商施工自主檢查表之檢查項目與檢查標準應依照何者訂定？ (A)施工品質管理標準表 (B)監造單位之施工抽查紀錄表 (C)設計圖說與規範內容 (D)以上皆可。","A"],[1329,"單元二：第五章 施工管制與檢驗","自主檢查表的使用方法，下列那一項是錯誤的？ (A)逐項檢查並紀錄 (B)品管人員簽字，並註明檢查日期代表區位 (C)編排分類號碼、次數、頁數等 (D)應註明該次檢查區位或範圍，作為估驗依據。","B"],[1330,"單元二：第五章 施工管制與檢驗","廠商自主檢查表(WIS)應由誰簽名認可？ (A)專任工程人員 (B)品管人員 (C)廠商負責人 (D)工地主任(工地負責人)。","D"],[1331,"單元二：第五章 施工管制與檢驗","下列何者不是自主檢查表正確之使用方法？ (A)表所列項目，逐項檢查並紀錄，如使無須該項目，直接劃掉無須註明 (B)編排分類號碼、次數、頁數 (C)應註明該次檢查區位或範圍，作為估驗依據 (D)檢查人員簽字，並註明檢查日期、代表區位。","A"],[1332,"單元二：第五章 施工管制與檢驗","自主檢查之執行，下列何者為對？ (A)監造單位應當場簽章 (B)檢查者因趕時間得於事後補蓋章 (C)應記錄實際檢查情形：將檢查結果詳實紀錄，再將檢查結果以”○”或”X”等方式填記，以便追蹤管理 (D)以上皆是。","C"],[1333,"單元二：第五章 施工管制與檢驗","施工品質缺失處理作業程序裡，自主檢查過程所發現何種缺失才需由檢查人員在自主檢查表予以紀錄存檔？ (A)重大品質缺失 (B)任何品質缺失 (C)無法立即改善的缺失 (D)已被監造工程師發現之缺失。","B"],[1334,"單元二：第五章 施工管制與檢驗","施工品質缺失處理作業程序裡，對於無法立即改善或重大缺失，檢查人員應將缺失及改善情形登錄於何處？ (A)不合格報告及改善通知單 (B)矯正措施報告表 (C)不合格品管制總表 (D)自主檢查表複查欄。","C"],[1335,"單元二：第五章 施工管制與檢驗","對於品質缺失之矯正行動，何種情形才可簽註結案？ (A)經統計分析或品質稽核發現紀錄完整並存檔時 (B)將方法、經驗知識化，回饋給公司、監造、設計單位 (C)對相關員工做教育訓練完成 (D)經品管人員確認成效，證實執行完成後。","D"],[1336,"單元二：第五章 施工管制與檢驗","在公共工程施工品質管理作業要點中，明示執行內部品質稽核工作的人員是何者？ (A)監造單位 (B)工地主任 (C)主辦機關 (D)品管人員。","D"],[1337,"單元二：第五章 施工管制與檢驗","施工過程中不管機關、監造單位或承商之任何品質管理之活動，均有可能發現工程實質或文件紀錄之缺失，各單位之改善、預防等做法是 (A)書面通知 (B)開會討論 (C)快速反應告之，以收時效 (D)拍照，錄影存證。","A"],[1338,"單元二：第五章 施工管制與檢驗","品管人員工作重點，下列敘述何者為非？ (A)訂定品質計畫 (B)品管統計分析 (C)自主檢查 (D)品質文件、紀錄之管理。","C"],[1339,"單元二：第五章 施工管制與檢驗","自主檢查過程所發現之任何品質缺失，無法立即改善或重大缺失，應做何處置？ (A)簽發不合格報告及改善通知單 (B)申請查驗 (C)申請估驗 (D)向廠商負責人請示。","A"],[1340,"單元二：第五章 施工管制與檢驗","下列施工品質缺失之處理作業程序何者為非？ (A)自主檢查過程所發現之任何品質缺失，均應由檢查人員在自主檢查表予以紀錄存檔 (B)無法立即改善或重大缺失，應簽發不合格報告及改善通知單，通知改善人員辦理改善及通知品管人員辦理矯正措施 (C)執行矯正行動過程檢查人員應觀察評估矯正措施執行成效 (D)執行矯正單位須將結案之資料建檔保存。","C"],[1341,"單元二：第五章 施工管制與檢驗","當遇到無法立即改善的缺失時，檢查人員應負責追蹤改善情形，當中追蹤管制之期限為： (A)直至合格為止； (B)再次改善後； (C)整體施工計畫完成後； (D)分項施工計畫完成後。","A"],[1342,"單元二：第五章 施工管制與檢驗","自主檢查過程發現之任何品質缺失，均應由下列何種人員在自主檢查表內紀錄存檔： (A)工地主任 (B)檢查人員 (C)品管人員 (D)以上皆是。","B"],[1343,"單元二：第五章 施工管制與檢驗","施工過程中，均有可能發現實質或文件紀錄之缺失，下列何者應建立書面之通知？ (A)主辦機關 (B)監造單位 (C)施工廠商 (D)以上皆是。","D"],[1344,"單元二：第五章 施工管制與檢驗","自主檢查過程所發現之任何品質缺失，其處理作業為： (A)均應由檢查人員在自主檢查表予以紀錄存檔 (B)可立即改善之缺失，應於自主檢查表複查欄位，紀錄複驗合格時間 (C)無法立即改善或重大缺失，應簽發不合格報告及改善通知單通知改善人員辦理改善 (D)以上皆是。","D"],[1345,"單元二：第五章 施工管制與檢驗","自主檢查過程所發現之任何品質缺失，均應由檢查人員在自主檢查表予以紀錄存檔，可立即改善之缺失，應於自主檢查表複查欄位，紀錄複驗 (A)所需次數 (B)所需時間 (C)檢查時間 (D)合格時間。","D"],[1346,"單元二：第五章 施工管制與檢驗","在工程品質缺失處理流程中，對於重大缺失由監造單位填具「品質矯正通知」交承商調查改善，並要求將矯正行動簽註在「答覆」欄內；惟監造單位對「答覆」不同意時，得在「評估」欄簽註不能接受之理由，惟若雙方仍有歧見時，該由誰做核定 (A)工地主任 (B)監造主任 (C)主辦機關 (D)品管人員。","B"],[1347,"單元二：第五章 施工管制與檢驗","執行矯正單位之結案資料： (A)須函送甲方主管 (B)須函送乙方主管 (C)建檔保存 (D)以上皆是。","C"],[1348,"單元二：第五章 施工管制與檢驗","下列敘述何者為非？ (A)計畫之目的就是將契約規範及相關規定依要領之｢想｣、｢寫｣成品質管理標準及作業程序、隨以抽查驗及自主檢查之｢作｣為落實 (B)依據公共工程施工品質管理作業要點規定，公告金額以上之公共工程，施工單位須先建立施工及品質計畫，監造單位依施工單位之施工及品質計畫建立監造計畫 (C)承商可以相關之工作說明或檢討會議，明確傳達品質政策、目標與確實執行各分項之計畫 (D)對於新工法、新材料、新技術或其他重要工項，必要時以工法說明或試作方式，使管理標準趨於一致性。","B"],[1349,"單元二：第五章 施工管制與檢驗","下列哪些因素是增加營建工程缺失及失敗成本的原因： (A)營造環境條件差； (B)營造期程長； (C)營造介面多元且複雜； (D)以上皆是。","D"],[1350,"單元二：第五章 施工管制與檢驗","傳統的品管七大工具手法(簡稱Q7)中，何者必須配合其他手法一起運用？ (A)層別法 (B)散佈圖 (C)查核表 (D)特性要因圖。","A"],[1351,"單元二：第五章 施工管制與檢驗","一個問題的特性(現象)，肯定是受到一些要因(主要因素)之影響，經過耙梳歸納這些要因，整理成具有層次且相互關聯的圖形稱為？ (A)層次圖， (B)關聯圖， (C)歸納圖， (D)特性要因圖。","D"],[1352,"單元二：第五章 施工管制與檢驗","將一組工程現場查驗所蒐集的數據、特性值或結果值加以整理，用一定的範圍在橫坐標軸上區分為幾個相等的區間，再將查驗數值出現於各區間內的次數於縱坐標軸上累積起來的面積，以柱狀表現的圖形稱為？ (A)折線圖 (B)雷達圖 (C)直方圖 (D)柏拉圖。","C"],[1353,"單元二：第五章 施工管制與檢驗","將可能互有關聯的兩組對應數據，以縱橫坐標位置呈現出來，橫坐標軸表示要因，縱坐標軸為結果，這些數據所呈現的點布狀態，依據分布的型態，可判讀對應數據間的相關程度，此圖形稱之為？ (A)對數圖， (B)關聯圖， (C)散佈圖， (D)特性要因圖。","C"],[1354,"單元二：第五章 施工管制與檢驗","將群體資料分層，依某種特徵或規則劃分為不同的層，將品質特性均一的資料放在一起成為一層，使層內的差異小，而各層間的差異大，以便進行分析者稱之為？ (A)層別法 (B)關聯圖 (C)散佈圖 (D)特性要因圖。","A"],[1355,"單元二：第五章 施工管制與檢驗","QC與NC七大手法分別著重在何種數據資料的應用？ (A)QC定量、NC定量 (B)QC定性、NC定量 (C)QC定性、NC定性 (D)QC定量、NC定性。","D"],[1356,"單元二：第五章 施工管制與檢驗","關聯圖工具手法是在管理循環的哪個階段？ (A)Action (B)Plan (C)Check (D)Do。","B"],[1357,"單元二：第五章 施工管制與檢驗","利用樹木分枝圖形，由左至右，從樹幹、大枝、中枝、小枝，乃至於細枝，有層次的展開，此圖形稱之為？ (A)散佈圖 (B)關聯圖 (C)系統圖 (D)石川圖。","C"],[1358,"單元二：第五章 施工管制與檢驗","將工作計畫之各作業項目及其時程，根據各項作業間從屬先後或同步併行關係，以節點表示作業項目，結點間再以箭線串連所繪出之網狀圖稱之為？ (A)箭線圖 (B)關聯圖 (C)系統圖 (D)節點圖。","A"],[1359,"單元二：第五章 施工管制與檢驗","箭線圖法可找出要徑，進行進度管控，請問要徑浮時為？ (A)3~5天 (B)2~3週 (C)時程無餘裕 (D)1~2月。","C"],[1360,"單元二：第五章 施工管制與檢驗","過程決策計畫圖與下列何者近似？ (A)標準作業程序 (B)箭線圖 (C)KJ圖 (D)以上皆非。","A"],[1361,"單元二：第五章 施工管制與檢驗","廣義的工程品質問題包含下列何者？ (A)成本 (B)工期 (C)安全 (D)以上皆是。","D"],[1362,"單元二：第五章 施工管制與檢驗","訂定品質改善目標可參考下列何者項目？ (A)必要性 (B)可行性 (C)挑戰性 (D)以上皆是。","D"],[1363,"單元二：第五章 施工管制與檢驗","傳統的七大手法比較偏向於何種階段？ (A)Action (B)Plan (C)Check (D)Do。","C"],[1364,"單元二：第五章 施工管制與檢驗","新QC七大手法為充實何種階段的重要工具？ (A)Action (B)Plan (C)Check (D)Do。","B"],[1365,"單元二：第五章 施工管制與檢驗","現代的品管作業基本觀念已進入 (A)全面品質管制 (B)統計流程管制 (C)品質查證 (D)全面品質管理的時代。","D"],[1366,"單元二：第五章 施工管制與檢驗","監造單位應於何時r將現場人員之登錄表，報經機關核定後，由機關填報於工程會資訊網路備查？ (A)工程決標後 (B)工程訂約後 (C)開工前 (D)開工後。","C"],[1367,"單元二：第五章 施工管制與檢驗","監造單位現場人員應專職，不得跨越其他標案，且監造服務期間應在工地執行職務之預算金額門檻？ (A)150萬元 (B)5,000萬元 (C)2億元 (D)以上皆非。","B"],[1368,"單元二：第五章 施工管制與檢驗","污水下水道推進工程採購預算金額1億6,000萬元，應編列品管費用，下列何者為非？ (A)以招標文件內品管人員設置規定為依據 (B)訂有專職及人數等規定者，以人月量化編列為原則 (C)未訂有專職及人數等規定者，以百分比法編列為原則， (D)含材料設備抽(檢)驗費用。","D"],[1369,"單元二：第五章 施工管制與檢驗","各項施工計畫和品質計畫規定應由承包商按進度階性提出，免影嚮進料時間和施工進度，其審查最終核定權係 (A)承包商按時程提出送審即可 (B)監造單位審查核准即可 (C)主辦機關核備即可 (D)沒硬性規定。","C"],[1370,"單元二：第五章 施工管制與檢驗","當工程規模與複雜程度越大時，下列哪一項目越顯得重要？ (A)有效的工作分配措施 (B)有效的人事管理措施 (C)有效的界面管理措施 (D)有效的經費管理措施。","C"],[1371,"單元二：第五章 施工管制與檢驗","按圖施工之原意包含 (A)檢討建築平面圖、立面圖、剖面圖、結構圖、給排水圖、電力圖、弱電圖及空調圖等設計圖面 W (C)SC (D)SM。","D"],[1390,"單元二：第六章 基礎與開挖","依建築工地區域土壤經試驗判定為GM，於地下開挖至9公尺時，發現擋土壁有裂縫，請問下列敘述何者為是？ (A)會發生管湧 (B)會開挖面隆起 (C)不會有漏水現象 (D)以上皆不會發生。","A"],[1391,"單元二：第六章 基礎與開挖","依據統一土壤分類法判斷，擋土壁不需擔心發生漏水者？ (A)SP (B)SW (C)SC (D)SM。","C"],[1392,"單元二：第六章 基礎與開挖","依建築工地區域土壤經試驗判定為SC，於地下開挖至10公尺時，發現擋土壁有裂縫，請問下列敘述何者為是？ (A)會發生管湧 (B)會開挖面隆起 (C)會有漏水現象 (D)開挖區不會有管湧或漏水。","D"],[1393,"單元二：第六章 基礎與開挖","林口紅土卵礫石層分類之結果為〝GC〞，試問剪力強度由誰主控？ (A)礫石 (B)黏土 (C)砂土 (D)沉泥。","B"],[1394,"單元二：第六章 基礎與開挖","5層樓透天住宅建築基礎開挖地下一層地下室，基地地質調查顯示為GC，地下水位於開挖深度下5公尺，兼顧安全與成本之擋土壁工法為何？ (A)地下連續壁工法 (B)鋼板樁及H型鋼支撐法 (C)鋼軌樁加襯木板工法 (D)反循環基樁工法。","C"],[1395,"單元二：第六章 基礎與開挖","若要開挖5公尺深基礎，需於紅土卵礫石層中構築擋土壁，請問採用下列何種擋土工法最為合適？ (A)鋼軌板條工法 (B)鋼鈑樁工法 (C)預壘樁工法 (D)連續壁工法。","A"],[1396,"單元二：第六章 基礎與開挖","地下室土方開挖過程，連續壁發生管湧的大量漏水事故，導致開挖區外地下水夾帶粉土或細砂，經由漏水處之孔隙湧入基地內，進而掏空基地外土層，造成連續壁外側大區域之地層下陷。如果第一時間在連續壁外側緊急灌漿阻塞漏水，最好不要採用下列何種緊急的搶救方式？ (A)在連續壁外側緊急灌注漿液，需採用速凝的漿液 (B)開挖區緊急注水平衡連續壁內外側水壓 (C)在開挖區內進行連續壁止漏緊急灌漿 (D)在連續壁外側採用緊急高壓噴射灌漿，阻塞漏水。","D"],[1397,"單元二：第六章 基礎與開挖","開挖面下為透水性良好之砂質土層，當進行基礎開挖，基地內外兩側水位差甚大時，會使地下水由擋土壁底端上湧至開挖面並夾雜砂土冒出開挖面，進而導致開挖面之破壞，此種破壞模式係為？ (A)管湧 (B)砂湧 (C)隆起 (D)上浮。","B"],[1398,"單元二：第六章 基礎與開挖","地下連續壁若因施工不慎而產生孔洞，在孔洞處形成透水路徑，當水力坡降大到足以破壞土壤顆粒間的黏結力及摩擦力後，地下水將土壤帶出，同時持續往上游面延伸掏空，形成滲流管道，此現象稱為？ (A)管湧 (B)砂湧 (C)基礎上浮 (D)隆起。","A"],[1399,"單元二：第六章 基礎與開挖","開挖面砂湧之災害主要發生於？ (A)不當之開挖或超挖導致架構不穩定的土層 (B)開挖面下為透水性良好之砂質土層 (C)吸水過多造成體積膨脹的黏性土壤 (D)採用鋼板樁的地下室開挖。","B"],[1400,"單元二：第六章 基礎與開挖","開挖面下的砂湧主要發生於？ (A)透水性良好之砂質土層 (B)滲透性係數極小的乾砂 (C)地下水位很高的黏性土壤 (D)吸水性高的黏性土壤。","A"],[1401,"單元二：第六章 基礎與開挖","地盤為非凝聚性土壤，擋土壁體貫入地盤深度不足，將導致產生何種災害？ (A)砂湧 (B)管湧 (C)隆起 (D)滑動。","A"],[1402,"單元二：第六章 基礎與開挖","基礎施工不慎亦常導致砂湧的產生，下列情事敘述何者有可能發生？ (A)地下結構完成拔除中間樁時 (B)基礎開挖區異常快速抽水時 (C)在砂礫質土壤中進行全套管樁鑽掘時 (D)以上皆是。","D"],[1403,"單元二：第六章 基礎與開挖","基礎開挖施作地下室結構體完成後，由於抽拔中間柱時將形成孔洞，地下水容易因為摩擦阻抗減小的關係，挾帶土砂往上滲流。在有可能產生此種砂湧災害的工址，一般是建議採用何種方法處理中間柱，以避免砂湧發生？ (A)不斷的打擊中間柱，以貫穿黏土層 (B)截斷中間柱的方式處理 (C)拔除中間柱的方式處理 (D)增長中間柱長度的方式處理。","B"],[1404,"單元二：第六章 基礎與開挖","在砂土層之深開挖過程中，當鋼板樁植入開挖面之深度為D，開挖時，基礎開挖區藉由抽水降低地下水面至開挖面以下1m深處，則緊鄰鋼板樁開挖面可能出現砂湧的範圍為： (A)D (B)2D/3 (C)D/2 (D)D/4。","C"],[1405,"單元二：第六章 基礎與開挖","D為版樁貫入透水層之深度，施工中若不管制而任意降水，將使水頭差H變大，水力坡降i同時變大，安全係數FS變小，根據Terzaghi在進行模型試驗後，開挖面距離版樁多少距離最易發生砂湧？ (A)D/4 (B)D/3 (C)D/2 (D)1D。","C"],[1406,"單元二：第六章 基礎與開挖","在有可能產生此種砂湧災害的工址，下列敘述何者有誤？ (A)中間柱打設時，若貫穿黏土層，進入壓力水層時 (B)在砂礫質土壤中進行全套管樁鑽掘時，如果不額外補水回套管內時 (C)施作地下室結構體完成後，於抽拔中間柱時 (D)以上皆非。","D"],[1407,"單元二：第六章 基礎與開挖","地盤為凝聚性土壤，擋土壁體貫入地盤深度不足，將導致產生何種災害？ (A)砂湧 (B)管湧 (C)隆起 (D)上浮。","C"],[1408,"單元二：第六章 基礎與開挖","造成擋土支撐系統破壞的因素為何？ (A)使用材料的勁度過高 (B)支撐間隔過大 (C)支撐架設時機太早 (D)支撐負荷之載重太輕。","B"],[1409,"單元二：第六章 基礎與開挖","擋土支撐系統破壞之因素： (A)支撐鬆動 (B)擋土壁變形 (C)支撐架構挫屈 (D)以上皆是。","D"],[1410,"單元二：第六章 基礎與開挖","擋土支撐系統的破壞有多種因素，下列何者為非？ (A)使用材料不當，勁度不足 (B)支撐架設時機不當，或支撐系統架設太慢 (C)重型機械等地表上方載重過大 (D)支撐安裝按圖施作。","D"],[1411,"單元二：第六章 基礎與開挖","擋土壁破壞之災害，可能原因何者為是？ (A)擋土壁的沈陷量過小 (B)擋土壁基底承載力太高 (C)擋土壁底面滑動 (D)擋土壁有足夠牆身強度。","C"],[1412,"單元二：第六章 基礎與開挖","下列何者不是擋土壁破壞失敗的可能因素？ (A)採用筏式基礎 (B)底面滑動 (C)傾覆 (D)基底承載力不足。","A"],[1413,"單元二：第六章 基礎與開挖","環山道路之上邊坡擋土牆，自牆頂向道路側傾倒移動之破壞模式，謂之？ (A)主動破壞 (B)被動破壞 (C)自動破壞 (D)移動破壞。","A"],[1414,"單元二：第六章 基礎與開挖","擋土壁貫入深度不足之破壞機制有？ (A)地盤為黏性土壤，開挖底部發生砂湧現象 (B)擋土牆外側承受主動土壓力小於內側承受被動土壓力，因而導致擋土壁向內擠進 (C)地盤為砂性土壤，開挖底部發生隆起現象 (D)擋土壁體貫入地盤深度不足而造成壁體的破壞。","D"],[1415,"單元二：第六章 基礎與開挖","擋土壁常見之破壞機制，下列何者為非？ (A)開挖底面下方土層中，如具不透水層，而且在此不透水層下方有壓力水層時，上舉壓力大時，可能會造成大底上浮，使擋土壁失去地盤的支持而造成破壞 (B)開挖底面下方於擋土壁體貫入深度範圍內，如係透水性佳之砂質土壤，因透水性良好不會有砂湧發生 (C)擋土壁體施工不良 (D)擋土壁體貫入地盤深度不足而造成壁體的破壞。","B"],[1416,"單元二：第六章 基礎與開挖","連續壁施工壁體包泥位置，恰位於地下水位範圍內，且地質資料顯示其塑性指數(PI)極低，則開挖時可能遭遇狀態？ (A)沉泥隨地下水湧出 (B)安全無虞 (C)適當抽水即安全無虞 (D)無關。","A"],[1417,"單元二：第六章 基礎與開挖","結構體施工階段，為何會發生基礎上浮現象？ (A)結構體重量及地下室側壁與土壤間之摩擦力不足以抑制水的浮力 (B)擋土壁的深度不足，使地下水湧入 (C)擋土壁的剛性不足，無法抵擋地下水的側向水壓 (D)基地太過於空曠，沒有鄰近建築物共同抵抗水浮力。","A"],[1418,"單元二：第六章 基礎與開挖","結構體施工階段，何種原因會造成基礎上浮？ (A)結構體重量大於地下水作用於基礎底版之浮力 (B)地下室側壁與土壤間之摩擦力大於水的浮力 (C)結構體陡然承受一個外力大於水的浮力 (D)水浮力大於結構體之重量。","D"],[1419,"單元二：第六章 基礎與開挖","有關造成基礎上浮的條件，下列何者為非？ (A)地下室結構體已完成 (B)開挖擋土用之鋼軌樁或鋼版樁拔除後，立即以水泥砂漿背填 (C)因暴雨影響造成基礎底版面下水浮力劇增 (D)工地已停止抽水或地下水位突然上升。","B"],[1420,"單元二：第六章 基礎與開挖","下列何者不是基礎開挖的工法？ (A)逆打工法 (B)島式工法 (C)明挖工法 (D)壓實工法。","D"],[1421,"單元二：第六章 基礎與開挖","下列何者不屬於明挖工法？ (A)無擋土明挖 (B)擋土壁自承工法 (C)斜坡明挖工法 (D)以上皆非。","D"],[1422,"單元二：第六章 基礎與開挖","有關順打工法開挖工法，下列敘述何者不正確？ (A)順打工法為目前最常見的開挖工法 (B)受基地或地盤等條件影響較小，即不管基地地質為何，皆可使用 (C)每階段超挖深度應在該支撐下150cm左右，以利施工 (D)電焊或開挖施工作業受天氣的影響。","C"],[1423,"單元二：第六章 基礎與開挖","雙順打工法係為何種目的而採用？ (A)縮短工期 (B)降低成本 (C)基地寬廣且不須深開挖 (D)避免支撐長度超過造成接頭鬆弛、材料收縮。","A"],[1424,"單元二：第六章 基礎與開挖","基地首先施作擋土壁，隨即開挖第一階土方，接著架設一層臨時性的水平支撐，並施做臨時施工構台，如此由上往下反覆開挖土方與架設支撐至大底設計深度，當開挖完成後，於底面打設PC鋪面，然後施作地樑與基礎水箱，並設立永久性支撐鋼柱到地面，隨即施做一樓樓版結構，即為轉換層，作為施工構台與材料堆置場所。此後以兩個工作面同時施工，此施築方式稱為 (A)逆打工法 (B)雙順打工法 (C)明挖工法 (D)順打工法。","B"],[1425,"單元二：第六章 基礎與開挖","有關第二類施作扶壁之雙順打工法，下列何者錯誤？ (A)須另外架設施工構台作為材料堆置場或施工作業場使用 (B)地面層RC樓版搭配連續壁與T型單元扶壁，勁度增高，可有效抵擋側向土水壓力，其擋土的安全性相對較高，適用於側向土壓力大的軟弱地盤 (C)因地下室開挖、鋼筋綁紮或澆置混凝土等，皆在地面層樓版下進行，所以施工不受天候的影響 (D)由於地上、地下結構物同時施工，且無須花費時間架設或拆除臨時擋土支撐，因此可節省工期。","A"],[1426,"單元二：第六章 基礎與開挖","有關第二類施作扶壁之雙順打開挖工法，下列敘述何者錯誤？ (A)較順打工法工期縮短 (B)地面層RC樓版搭配連續壁與T型單元扶壁，可有效抵擋側向土水壓力 (C)若採用內支撐工法，不會因開挖過深而支撐架設減緩 (D)適用於因開挖基地地形有高低差，內支撐系統因沒有支撐反力而無法施做時。","C"],[1427,"單元二：第六章 基礎與開挖","有關第二類施作扶壁之雙順打工法，下列敘述何者不正確？ (A)地下結構的施工皆在地面層樓版下進行，所以施工作業性不良，並且容易發生通風不良及照明不夠等問題 (B)基樁因需支撐建物重量，所以施做及吊放地下鋼柱時，柱位與垂直精度必須相當準確 (C)不適用於基地有高低差或側壓不平衡之工地 (D)適用於基地開挖平面形狀不規則之工地。","C"],[1428,"單元二：第六章 基礎與開挖","有關邊區逆打工法，下列敘述何者正確？ (A)連續壁搭配扶壁與肋版，擋土壁勁度很高 (B)可利用本體鋼骨柱支撐 (C)不須型鋼內支撐 (D)以上皆非。","B"],[1429,"單元二：第六章 基礎與開挖","基地以一樓樓版為起始層，分為向上與向下兩個工作面同時施做，地下室開挖以連續壁配合已完成的樓版，來抵擋地盤側向土水壓力，此施築方式稱為 (A)逆打工法 (B)順打工法 (C)明挖工法 (D)雙順打工法。","A"],[1430,"單元二：第六章 基礎與開挖","逆打工法的最大優點下列何者為是？ (A)縮短工期 (B)地下室開挖深度深小於15m (C)施工作業性良好 (D)節省經費。","A"],[1431,"單元二：第六章 基礎與開挖","有關逆打工法，下列敘述何者正確？ (A)地下結構的施工皆在地面層樓版下進行，所以施工作業性不良，並且容易發生通風不良及照明不夠等問題 (B)因為由地面層往下施工，所以柱與牆壁會產生二次接縫，需採用無收縮混凝土填補，使得處理上較為複雜 (C)樓版需預留開口，作為開挖土方輸出或材料進入之用 (D)以上皆是。","D"],[1432,"單元二：第六章 基礎與開挖","下列何者不是採用逆打工法的適用情況？ (A)地下室開挖深度深小於10m時 (B)軟弱土層承載力不足需要施做基樁時 (C)縮短工期 (D)地下室開挖空間形狀特殊。","A"],[1433,"單元二：第六章 基礎與開挖","逆打工法的施工係以何種措施來抵擋地盤側向土水壓力？ (A)利用擋土壁配合內支撐或外支撐系統 (B)以連續壁配合已完成的樓版 (C)以擋土壁配合邊坡 (D)利用逆打鋼支柱。","B"],[1434,"單元二：第六章 基礎與開挖","在地盤進行開挖，對於所發生之災害，下列敘述何者正確？ (A)破壞模式屬個案條件，很難借鏡施工災害工地去擬定施工計畫 (B)災害發生無法事先掌握以便事先採取緊急應變措施，應見機行事減輕災害受損之程度 (C)邀請學者專家成立審查小組進行施工計畫的審查與災害無關，施工廠商應以自己決定為主 (D)其破壞模式均有跡可尋，若在工程設計階段即考慮此破壞模式，則可防範於未然。 g (C)82.5g (D)90g。","C"],[1542,"單元二：第六章 基礎與開挖","水對於土壤之影響，下列敘述何者正確？ (A)對於砂質土壤的基礎開挖區後續施工會有所影響 (B)地表逕流對於砂質土壤的邊坡不會有所影響 (C)對於黏質土壤的基礎開挖區後續施工會有所影響 (D)地表逕流對於黏質土壤的邊坡不會有所影響。","C"],[1543,"單元二：第六章 基礎與開挖","某基地位於含細粉料之級配優良卵礫石層，營造廠採用斜坡明挖工法施作基礎開挖，於地下室施作期間，開挖邊坡必須長時間閒置，現有地工格網和帆布兩種材料，試問該選用何種材料覆蓋坡面？ (A)地工格網 (B)帆布 (C)不必覆蓋 (D)以上皆非。","B"],[1544,"單元二：第六章 基礎與開挖","常見之基礎施工災害主要類型中，下列敘述何者有誤？ (A)在透水性良好之砂質地盤，有可能發生擋土壁管湧災害 (B)在軟弱黏土層中，有可能發生開挖面砂湧之災害 (C)在軟弱黏土層中，有可能發生開挖面隆起之災害 (D)無論於何土層中都有可能發生擋土壁支撐系統敗壞。","B"],[1545,"單元二：第六章 基礎與開挖","基礎施工災害，管湧(piping)常發生於？ (A)黏性土壤地層中 (B)不具地下水的砂性土層 (C)具透水性之地層中，地下水位高時 (D)開挖深度大的黏性土層。","C"],[1546,"單元二：第六章 基礎與開挖","市區42層商業大樓建築基礎開挖地下8層地下室，基地地質調查顯示為SM，地下水位於地面下2.5公尺，基礎開挖至地下15公尺位置，因連續壁壁體包泥產生災害，導致大範圍鄰房透天住宅側傾，此種災害謂之？ (A)隆起 (B)管湧 (C)砂湧 (D)以上皆非。","B"],[1547,"單元二：第六章 基礎與開挖","常見的基礎施工災害中，不包含下列何者？ (A)擋土壁管湧之災害 (B)開挖面砂湧之災害 (C)開挖面隆起之災害 (D)基礎沉陷。","D"],[1548,"單元二：第六章 基礎與開挖","擋土壁產生管湧之災害，關鍵的因素為何？ (A)在黏土層中，地下水位高時，擋土結構物因施工不慎而產生裂縫時 (B)在具透水性之地層中，地下水位高時，擋土結構物因施工不慎而產生裂縫時 (C)鋼版樁全部拔除或部分拔除後施工用水或雨水沿拔樁後形成之孔隙滲流進入底版下方 (D)地下室開挖完成後，水平支撐拆除過快。","B"],[1549,"單元二：第六章 基礎與開挖","地下擋土壁若因施工不慎而產生裂縫，尤其在具透水性之地層中，地下水位高時，在土體內產生滲流，而於裂縫處，將會產生何種破壞？ (A)管湧 (B)砂湧 (C)隆起 (D)上浮。","A"],[1550,"單元二：第六章 基礎與開挖","發生隆起破壞的機制可分為四大類，下列何者為非？ (A)擠壓隆起 (B)彈性回脹隆起 (C)砂湧隆起 (D)塑性流隆起。","C"],[1551,"單元二：第六章 基礎與開挖","易發生於軟弱粘土地盤之開挖工程，開挖作業進行至某種深度後，開挖背面之土壤重量超過支持該土重之下部黏土抵抗力，開挖底部失去平衡，因而沿著滑動面產生塑性流動，背面土壤向開挖底面內側迂迴流動，於開挖底面造成鼓起現象，此種現象稱為 (A)管湧 (B)砂湧 (C)隆起 (D)上浮。","C"],[1552,"單元二：第六章 基礎與開挖","軟弱粘土地盤基礎開挖，背面土壤向開挖底面內側迂迴流動，導致開挖面隆起謂之？ (A)擠壓隆起 (B)上浮隆起 (C)塑性流隆起 (D)彈性回脹隆起。","C"],[1553,"單元二：第六章 基礎與開挖","黏土的含水量ω大於液性限度LL，基礎開挖面底部流動造成隆起謂之？ (A)彈性回脹隆起 (B)塑性流隆起 (C)上浮隆起 (D)擠壓隆起。","B"],[1554,"單元二：第六章 基礎與開挖","開挖面塑性流隆起之災害，下列預防措施何者不正確？ (A)改良開挖底面下之軟弱地盤，增加地盤之剪力強度，減少地盤的可流動性 (B)開挖區域面積很大時，可實施分區開挖，一方面減少流動驅動力，一方面減少擋土壁背面地盤的沉陷量與面積 (C)擋土壁外側為空地時，可鏟除部分周圍地盤，以減輕擋土壁背面上土壤之荷重，減少作用在滑動面之破壞力矩 (D)在黏土層內採用深井抽水方式，降低黏土層的水壓力。","D"],[1555,"單元二：第六章 基礎與開挖","針對開挖面產生上浮隆起的原因，下列敘述何者為非？ (A)開挖面粘土層自重不足，而無法抵抗受壓水層向上之浮力 (B)開挖面底部若為一層較薄之粘土層 (C)粘土層，且其下為受壓水層 (D)以上皆非。","D"],[1556,"單元二：第六章 基礎與開挖","若事前研判結果，推測可能會產生隆起現象，應採取下列何種措施？ (A)開挖區域面積很大時，不得實施分區開挖 (B)擋土壁外側為空地時，不可鏟除亦不可擾動部分周圍地盤 (C)改良開挖底面下之軟弱地盤，以增加地盤之抗剪強度 (D)採用剛性低之擋土壁，並使其設置深度盡量不觸及良質地盤。","C"],[1557,"單元二：第六章 基礎與開挖","若事前研判結果，推測可能會產生隆起現象，應採取的措施下列何者不適當？ (A)擋土壁外側的房屋，可鏟除部分，以減少荷重 (B)採用剛性高之擋土壁，其設置深度須達良質地盤 (C)改良開挖底面下之軟弱地盤，以增加地盤之抗剪強度 (D)鄰接構造物，可實施托換基礎。","A"],[1558,"單元二：第六章 基礎與開挖","市區42層商業大樓建築基礎開挖地下8層地下室，基地地質調查顯示，地下水位於地面下2.5公尺，開挖面底部為一層較薄之粘土層，且其下為受壓水層，推測可能會產生隆起現象，應採取何種工法克服？ (A)點井工法 (B)止水灌漿工法 (C)壓重工法 (D)剛性深礎工法。","D"],[1559,"單元二：第六章 基礎與開挖","開挖面隆起之災害，下列描述何者不正確？ (A)彈性回脹隆起為一般的地下室開挖常會使土壤解壓之情形 (B)擠壓隆起為靠近開挖面處，由於擋土壁向開挖面變形，連帶地把土壤推擠向上所致 (C)黏土的含水量ω大於液性限度LL，此時，土壤處於液態狀況會沿著滑動面產生塑性流動 (D)以上皆非。","D"],[1560,"單元二：第六章 基礎與開挖","下列何者不是擋土支撐系統的破壞因素？ (A)支撐安裝精度不良，而產生鬆動 (B)材料勁度不足，而發生彎曲變形 (C)支撐間隔過大，導致壁體變形 (D)以上皆非。","D"],[1561,"單元二：第六章 基礎與開挖","擋土斜坡明挖適用的情況為何？ (A)在鬆軟的地質條件，地下室開挖面積狹小，地下室開挖深度淺 (B)在自然邊坡穩定的地質條件，地下室開挖面積寬闊，地下室開挖深度淺 (C)在堅硬的地質條件，地下室開挖鄰房緊臨，地下室開挖深度淺 (D)在自然邊坡穩定的地質條件，地下室開挖面積寬闊，地下室開挖深度很大。","B"],[1562,"單元二：第六章 基礎與開挖","開挖區內無設置支撐系統，而是利用開挖區四周邊坡，來消除側向土水壓力，並利用土壤的自立性，達到開挖壁面穩定的一種基礎開挖工法稱為 (A)逆打工法 (B)順打工法 (C)明挖工法 (D)雙順打工法。","C"],[1563,"單元二：第六章 基礎與開挖","地下室施工採用斜坡明挖，應注意？ (A)利用自然的邊坡穩定開挖，並同時使用內支撐系統，以增加安全 (B)坡頂及坡趾不可設置排水設施，以便地表逕流順利流下 (C)施工時，必須確保邊坡之穩定性，並防止地下水位過高 (D)坡面必須維持自然不可進行任意保護措施。","C"],[1564,"單元二：第六章 基礎與開挖","利用開挖區四周邊坡，來消除側向土水壓力，並利用土壤的自立性，達到開挖壁面穩定的一種基礎開挖工法，為下列何者？ (A)斜坡明挖工法 (B)島式工法 (C)壕溝式工法 (D)逆打工法。","A"],[1565,"單元二：第六章 基礎與開挖","有關斜坡明挖工法應注意要點的下列何者正確？ (A)必須確保邊坡之穩定性，並防止地下水位過高，造成開挖底部發生砂湧災害 (B)坡頂及坡趾需設置排水設施，以免地表逕流之侵蝕及沖刷 (C)坡頂及坡趾需設置排水設施，可避免積水造成基礎上浮 (D)以上皆是。","D"],[1566,"單元二：第六章 基礎與開挖","適合採用斜坡明挖工法的情況，下列敘述何者錯誤？ (A)適用於軟弱地盤 (B)地下室開挖深度淺 (C)地下室開挖面積寬闊 (D)施工成本比其他開挖工法低。","A"],[1567,"單元二：第六章 基礎與開挖","明挖作業時，為了使開挖面或斜坡保持穩定狀態，以及工作面保持乾燥便於施工作業，一般會將地下水位降至開挖面以下多少？ (A)0m (B)1~2m (C)4~5m (D)9~10m。","B"],[1568,"單元二：第六章 基礎與開挖","基地首先施作擋土壁，隨即開挖第一階土方，接著架設一層臨時性的水平支撐，並施做臨時施工構台，如此由上往下反覆開挖土方與架設支撐至大底設計深度，此施築方式稱為 (A)逆打工法 (B)順打工法 (C)明挖工法 (D)雙順打工法。","B"],[1569,"單元二：第六章 基礎與開挖","有關順打開挖工法，下列敘述何者正確？ (A)開挖面積廣闊，長度超過約100m時，易造成支撐接頭鬆弛、材料收縮、施加預力損失等現象，而導致支撐作業困難 (B)施工作業產生的噪音較大 (C)地下室開挖暴露的時間較長，易產生損壞鄰房事件 (D)以上皆是。","D"],[1570,"單元二：第六章 基礎與開挖","基礎工程施工時，目前最常見的開挖工法為下列何者？ (A)順打工法 (B)高地下水位工法 (C)點井 (D)連續壁。","A"],[1571,"單元二：第六章 基礎與開挖","開挖區內以交錯之內支撐系統抵擋側向土水壓力，易妨礙開挖機械作業、支撐系統的架設及地下室建物的施工，是何種開挖工法的主要缺點？ (A)擋土明挖工法 (B)島區工法 (C)邊區逆打工法 (D)順打工法。","D"],[1572,"單元二：第六章 基礎與開挖","有關逆打工法，下列敘述何者不正確？ (A)地下室基礎與地面樓層同時施工，可以縮短工期 (B)適用於基地開挖平面形狀不規則之工地 (C)不適用於基地有高低差或側壓不平衡之工地 (D)因地下室開挖、鋼筋綁紮或澆置混凝土等，皆在地面層樓版下進行，所以施工不受天候的影響。","C"],[1573,"單元二：第六章 基礎與開挖","有關逆打工法施工過程應注意要點，下列敘述何者不正確？ (A)地面一樓樓板毋需預留開口，可以減少後續二次施工 (B)地下室施工作業，需有良好的通風及照明設施 (C)二次施工接縫，需採用無收縮水泥妥善的處理 (D)施做基樁及吊放鋼柱時，位置與垂直精度必須相當準確。","A"],[1574,"單元二：第六章 基礎與開挖","當地下室開挖面積寬闊且地下室開挖深度淺時，比較適用的工法為： (A)明挖工法 (B)島式工法 (C)逆打工法 (D)順打工法。","D"],[1575,"單元二：第六章 基礎與開挖","對於島式工法的施工，下列敘述何者正確？ (A)最適用於地下室開挖面積狹窄 (B)地下室構造分成島區及周圍兩次施工，因此兩者連接處需另行處理，易造成結構體上的弱面 (C)地下室工程分成島區及周圍邊坡兩次進行，因此工期較短 (D)支撐材料使用量較全面開挖使用之支撐材料多。","D"],[1576,"單元二：第六章 基礎與開挖","地下室分為中央島區與邊區兩個部分施做，島區開挖時保留擋土壁內側的土壤坡面，消除側向土水壓力，邊區開挖時，採用已完成之島區建物作為支撐反力，以支撐系統抵擋側向土水壓力，此施築方式稱為 (A)島區式工法 (B)順打工法 (C)壕溝式工法 (D)逆打工法。","A"],[1577,"單元二：第六章 基礎與開挖","有關針對島區式基礎開挖工法適用情況，下列敘述何者錯誤？ (A)地下室開挖面積寬闊 (B)工期較逆打工法為短 (C)地下室開挖深度淺時 (D)地下結構體工作縫的施工應特別注意。","B"],[1578,"單元二：第六章 基礎與開挖","有關採島區式開挖工法，下列敘述何者正確？ (A)地下室工程分成島區及周圍邊坡兩次進行，因此工期較長且複雜 (B)地下室構造分成島區及周圍兩次施工，因此兩者連接處需另行處理，易造成結構體上的漏水弱面 (C)開挖深度越深，因所抵擋側向土水壓力提高，造成周圍所需邊坡寬度增加，則中央島區部分範圍越小 (D)以上皆是。","D"],[1579,"單元二：第六章 基礎與開挖","有關基礎開挖採島區式工法，下列敘述何者正確？ (A)坡頂需設置排水設施，坡面應做保護，以免表面水之侵蝕及沖刷 (B)施工時，必須確保邊坡之穩定性，並防止地下水位過高，造成開挖底部發生砂湧災害 (C)島區周圍邊坡部分開挖，因為作業空間小且含有臨時支撐，所以施工作業性不良 (D)以上皆是。","D"],[1580,"單元二：第六章 基礎與開挖","採島式工法施工過程必須注意下列何者？ (A)地下結構施工皆在地面層樓版下進行，容易發生通風不良及照明不夠等需妥善處理 (B)一樓樓版需預留開口作為開挖土方輸出或材料進入之用 (C)地下結構體的工作縫對於止水、結構整體安全性與結構的差異沉陷等需妥善處理 (D)鋼柱接頭的鋼筋續接與柱、壁的二次接縫需採用無收縮水泥妥善處理。","C"],[1581,"單元二：第六章 基礎與開挖","施工災害發生的類別及原理，下列敘述何者為非？ (A)在軟弱黏土地盤進行地下室開挖階段，常常發生的破壞模式即為「隆起」破壞 (B)在鬆散砂土地盤進行地下室開挖階段，常常發生擋土壁漏水的管湧破壞 (C)在含有沉泥之砂土層，可能發生隆起施工災害 (D)在鬆散砂土地盤進行地下室開挖階段，常常發生開挖面砂湧的破壞模式。","C"],[1582,"單元二：第七章 鋼筋、模板、混凝土施工","RC結構中，為提升RC結構耐震韌性，應採用何種設計原則？ (A)強柱弱梁 (B)強梁弱柱 (C)強剪弱彎 (D)弱剪強彎。","A"],[1583,"單元二：第七章 鋼筋、模板、混凝土施工","鋼筋施工中，若發現鋼筋彎折角度有設計疑義，應採取何種處理方式？ (A)直接澆置混凝土 (B)以火烤方式修正 (C)通知監造單位處理 (D)自行切除重做。","C"],[1584,"單元二：第七章 鋼筋、模板、混凝土施工","RC結構 澆置計畫的目的 (C)學理時間僅作參考，混凝土運用緩凝劑等特殊材料，讓澆置循環輕鬆進行不受干擾 (D)盡量切割澆置規劃區域，多設置施工縫就沒有冷縫困擾。","B"],[1739,"單元二：第七章 鋼筋、模板、混凝土施工","冷縫發生之原因，乃因混凝土澆置停頓時間超過一定時間後，新的混凝土與先前澆置已初凝之混凝土組織無法合成一體，兩者之間產生一不連續介面所致。其將造成兩個主要缺點，一是會漏水，另一是則是 (A)發生白華 (B)結構安全不佳， (C)鋼筋外露， (D)混凝土中性化。","B"],[1740,"單元二：第七章 鋼筋、模板、混凝土施工","台灣氣溫經常都在30℃以上，工地要澆置混凝土，為了避免混凝土澆置產生冷縫，在澆置規畫上，新舊介面混凝土澆置停頓時間越短越好，儘量不要停頓靠近到學理規範時間為？ (A)120分鐘 (B)110分鐘 (C)100分鐘 (D)無規定。","C"],[1741,"單元二：第七章 鋼筋、模板、混凝土施工","冷縫發生原因，乃因混凝土澆置停頓時間太久，新的混凝土與先前澆置已初凝之混凝土組織無法合成一體，兩者之間產生一不連續介面所致。以下何者非冷縫易造成的缺點？ (A)漏水 (B)結構剪應力傳遞不良 (C)鋼筋腐蝕 (D)保護層不足。","D"],[1742,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土冷縫的主要缺點為何？ (A)漏水、混凝土剪應力傳遞不良 (B)美觀不良、混凝土抗壓強度折減 (C)配管不便、容易產生白華 (D)澆置不易、建築物價值降低。","A"],[1743,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土澆置計劃之主要考慮為避免澆置過程中不要產生 (A)伸縮縫 (B)收縮縫 (C)冷縫 (D)施工縫。","C"],[1744,"單元二：第七章 鋼筋、模板、混凝土施工","柱、牆等結構體之施工縫，為防止混凝土蜂窩發生，在澆灌混凝土前，可 (A)澆水泥漿 (B)鋪墊同水灰比水泥砂漿3-5公分厚 (C)鋪墊一般水泥砂漿3-5公分 (D)澆水潤濕。","B"],[1745,"單元二：第七章 鋼筋、模板、混凝土施工","施工縫除工程圖說之規定設置外，若因施工需要而設置時，應設在對結構強度影響較小之處，下列敘述何者不正確 (A)施工縫宜與主鋼筋垂直 (B)梁之施工縫應設置於其跨度中央三分之一範圍內， (C)柱之施工縫應設於梁之底面， (D)樓梯之施工縫應設置於樓層高二分之一處。","D"],[1746,"單元二：第七章 鋼筋、模板、混凝土施工","穿過施工縫之鋼筋須連續。若需要於牆與牆、牆與版或基腳間設置施工縫時，可設置縱向榫。榫高應至少 (A)3 (B)4 (C)5 (D)10㎝。","B"],[1747,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土澆置時，其混凝土從拌合、運輸到澆置，依CNS 3090 A2042規定必須在幾小時內完成？ (A)0.5小時 (B)2小時 (C)1.5小時 (D)2.5小時。","C"],[1748,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土施工時，有關工作接縫之規定，下列何者錯誤？ (A)接縫應設置在剪力較小處 (B)方便下階段施工之的位置 (C)接縫面必須清除潔淨 (D)接縫如須傳遞剪力時，應加用剪力榫。","B"],[1749,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土澆置前，承包商應完成自主檢查工作，自主檢查工作應包括鋼筋自主檢查、模板自主檢查及混凝土施工自主檢查等，上述檢查表由承包商於施工前依據契約特訂條款、設計圖說及工程特性與相關規範之規定，自訂可供施工現場逐項檢驗之表格。請問哪一項不會寫在鋼筋自主檢查表內 (A)放樣 (B)鋼筋間距 (C)墊塊間距 (D)錨定長度。","A"],[1750,"單元二：第七章 鋼筋、模板、混凝土施工","有關混凝土澆置，下列敘述何者錯誤？ (A)混凝土自由落下高度<200㎝ (B)混凝土自拌和，輸送至澆置完成，輸送途中保持攪動者不得超過90分鐘 (C)氯含量<0.30㎏/㎥ (D)混凝土養護，澆置後保持潮濕至少7日。","C"],[1751,"單元二：第七章 鋼筋、模板、混凝土施工","施工縫與屬經計劃下留置的冷縫，所以應選擇在應力最小之處，並應考慮防水問題。請問以下何者有誤？ (A)穿過施工縫鋼筋須連續 (B)須埋設止水帶 (C)施工縫是為提供應力傳遞而預設之線縫 (D)於牆與版或基腳間設置施工縫時，可設置深度(榫高)至少4cm之縱向榫。","C"],[1752,"單元二：第七章 鋼筋、模板、混凝土施工","一般工程施工縫，在澆置銜接混凝土前須作處理，何者有誤: (A)除去水泥乳皮、不良表層及其他雜物 (B)除去硬化混凝土表面的乳沫及鬆動物質 (C)高壓沖刷清洗至露出良好堅實的鋼筋與混凝土面，凹凸深度約0.6cm (D)達露出粗粒料程度，並徹底潔淨後潤濕之，以形成良好的連接。","C"],[1753,"單元二：第七章 鋼筋、模板、混凝土施工","工程施工縫留設與下次澆置銜接混凝土前須作處理，何者正確: (A)垂直施工縫，於第一次澆置混凝土後設置臨時模板 (B)設置臨時模板可以用金屬網以使接縫面較為平整 (C)垂直施工縫，再澆置銜接混凝土後，縫線應加塗一層與混凝土水灰比相同之水泥漿 (D)水平施工縫，如液體儲存構造物之水平施工縫可用臨時模板設置。","B"],[1754,"單元二：第七章 鋼筋、模板、混凝土施工","施工縫如需特殊黏結時，經工程司許可下，可用下列方法，但何種有誤？ (A)使用經核可之黏結劑 (B)使用緩凝劑 (C)緩凝劑須能延遲但不影響表面水泥砂漿之強度 (D)添加緩凝劑之混凝土可無須再作施工縫接合面之處理。","D"],[1755,"單元二：第七章 鋼筋、模板、混凝土施工","澆築混凝土過程中，上端模板難免濺沾混凝土漿屑，故應注意哪些事項，以下何者有誤？ (A)因模板空間體積簿小，水份迅速被木模吸乾或蒸發，應清掃殘留的漿屑 (B)不規則的漿屑會致混凝土完成面形成凹凸不平 (C)每層混凝土澆注後，上端模板應以划漿板刮除濺沾在模板表面漿屑 (D)結構體拆模後，有後續工項如粉刷貼磚，則漿屑即可忽略不處理。","D"],[1756,"單元二：第七章 鋼筋、模板、混凝土施工","牆、柱等結構體混凝土，應分層澆築，振動機前端應插入前次澆置之混凝土內，而上下兩層相隔時間不可超逾一個小時，以免形成冷縫。每分層澆築高度應控制在約(A)30 (B)45 (C)60 (D)75 公分。","B"],[1757,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土分層澆置搗實作業，以下何者正確？ (A)應在澆置後90分鐘內使用振動器搗實 (B)振動器應置入模板最底處，以確保各層間結合良好 (C)使用的振動器應符合CNS 5646(內部振動器)和CNS 5648(模板振動器)的規定 (D)每分層澆築高度應控制在90公分。","C"],[1758,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土澆置時，如何避免過度震動，並可避免哪些品質影響 (A)混凝土輸送管需以輪胎等墊隔 (B)過度震動會使模板變形或鋼筋移位 (C)鋼筋四周粒料分離，影響握裏力等缺失 (D)以上皆是。","D"],[1759,"單元二：第七章 鋼筋、模板、混凝土施工","新舊混凝土介面處加舖同水灰比之水泥砂漿，以避免蜂窩產生，規範要求之加鋪厚度為: (A)3~5公分 (B)1~3公分厚 (C)5公分以上 (D)有塗滿即可。","A"],[1760,"單元二：第七章 鋼筋、模板、混凝土施工","有關斜坡面混凝土澆置時之品質注意事項，何者最正確: (A)使用高強度混凝土 (B)使用低坍度混凝土 (C)使用高流動混凝土 (D)由上往下澆置。","B"],[1761,"單元二：第七章 鋼筋、模板、混凝土施工","樓版混凝土澆置過程中，由於表面水份蒸發快，混凝土乾縮，其表層發生龜裂，可在初凝前亦即澆置 (A)3 (B)2 (C)1.5 (D)0.5小時內，以木製饅刀力推抹使之密合。","C"],[1762,"單元二：第七章 鋼筋、模板、混凝土施工","牆柱等結構體，應分層澆置，每層高度約 (A)45 (B)80 (C)100 (D)150公分振動機前端應插入前次澆置混凝土內，原則上下兩層相隔時間不可過1個小時。","A"],[1763,"單元二：第七章 鋼筋、模板、混凝土施工","下列有關混凝土施工品質規定敘述何者正確？ (A)斜屋頂，應由上往下澆築混凝土，加速混凝土流動 (B)混凝土蜂窩最容易發生在新舊混凝土介面處，為防止可於澆置新混凝土前，先加舖一層3~5公分厚之高水灰比水泥砂漿 (C)為避免模板或鋼筋在澆置混凝土過程中遭受擾動，混凝土輸送管可以使用輪胎墊隔 (D)樓版混凝土澆置過程中因表面水份蒸發過快，混凝土乾縮而表層發生龜裂，因此可在混凝土初凝後，以木製墁刀用力推抹或採用整體粉光設備，使之密合即可。","C"],[1764,"單元二：第七章 鋼筋、模板、混凝土施工","有關混凝土養護品質規定敘述何者不正確？ (A)混凝土澆置後，模板與露面之混凝土應連續保持潮濕至少3天 (B)水份過分蒸發，避免影響水化作用進行，係養護最主要之目的 (C)任何新澆置完成之混凝土，其表面即應立即進行養治作業，養治方式應依契約或特訂條款等相關規定辦理 (D)一般常用之混凝土養治可採濕治法、化學劑養治法、蒸汽養治法。","A"],[1765,"單元二：第七章 鋼筋、模板、混凝土施工","混凝土澆置後，模板與露面之混凝土應連續保持潮濕 (A)24小時 (B) 單元二：第八章 鋼結構施工及檢驗基準","鋼結構構件之現場接合主要分為銲接接合及螺栓接合，對於採用螺栓接合之構件必須於鋼構廠內先行開孔，最常使用之開孔作業方式為何？ (A)沖孔 (B)鑽孔 (C)火焰切割 (D)以上皆是。","B"],[1907,"單元二：第八章 鋼結構施工及檢驗基準","常見於鋼骨結構之箱型柱，下列柱內橫隔板之組立程序何者正確？ (A)先於橫隔板之對稱兩側預備缺口，再將箱型柱四片板組立封合，最後由橫隔板之預留缺口伸入柱內進行橫隔板之立向銲接 (B)先將橫隔板與箱型柱之三片板銲接，再將箱型柱最後一片板組立封合 (C)先將橫隔板與箱型柱相鄰兩片板進行L形銲接，再將箱型柱另外相鄰兩片板L形組立封合 (D)先於橫隔板之四邊均預備缺口，再將箱型柱四片板組立封合，最後由橫隔板之預留缺口伸入柱內進行橫隔板之立向銲接。","A"],[1908,"單元二：第八章 鋼結構施工及檢驗基準","鋼骨結構之箱型柱，組立製程上須先將箱型柱組立封合，建築物方型鋼柱內橫隔板係作為傳遞與其接合之鋼梁應力，其位置須與鋼梁上下翼板位置對齊，厚度亦須與翼板之厚度相同。為使橫隔板之四邊均能與柱鋼板確實銲接，橫隔板通常留設兩側互為對稱之預備缺口，作為下列哪種銲接之用？ (A)被覆金屬電弧銲接-SMAW (B)電熱熔渣銲接-ESW或電熱氣體銲接-EGW (C)潛弧銲接-SAW (D)氣體遮護金屬電弧銲接-GMAW。","B"],[1909,"單元二：第八章 鋼結構施工及檢驗基準","為有效消除銲接作業可能產生之瑕疵及構件不正常之變形，組立銲接接頭時須依檢驗標準進行。有關銲接位置組立精度，下列敘述何者有誤？ (A)T型接頭間隙許可差須小於2㎜ (B)對銲接頭之間隙最大加寬許可差須小於2㎜ (C)搭接銲之間隙許可差須小於2㎝ (D)對銲接頭之開槽角度不可大於設計角度10度以上。","C"],[1910,"單元二：第八章 鋼結構施工及檢驗基準","為有效消除銲接作業可能產生之瑕疵及構件不正常之變形，組立銲接接頭時須依檢驗標準進行，其中對銲之開槽角度(α)許可差為何？ (A)-10°≦△α≦+10° (B)-10°≦△α≦+5° (C)-5°≦△α≦+5° (D)-5°≦△α≦+10°。","D"],[1911,"單元二：第八章 鋼結構施工及檢驗基準","為有效消除銲接作業可能產生之瑕疵及構件不正常之變形，組立銲接接頭時須依檢驗標準進行。常見之T型接頭銲接，如：填角銲、半滲透銲，其間隙之許可差最大為多少？ (A)1.0㎜ (B)2.0㎜ (C)3.0㎜ (D)4.0㎜。","B"],[1912,"單元二：第八章 鋼結構施工及檢驗基準","下列哪種銲接方法俗稱「手銲」？ (A)被覆金屬電弧銲接-SMAW (B)電熱熔渣銲接-ESW (C)潛弧銲接-SAW (D)氣體遮護金屬電弧銲接-GMAW。","A"],[1913,"單元二：第八章 鋼結構施工及檢驗基準","被覆金屬電弧銲銲接之原理係藉由被覆銲條與工作母材間產生的電弧為熱源，將銲條與母材熔融以達到接合目的。依美國銲接協會(AWS)所訂英文名詞為ShieldedMetalArcWelding，簡稱SMAW。此法俗稱為： (A)釣魚銲 (B)手銲 (C)氬銲 (D)電弧銲。","B"],[1914,"單元二：第八章 鋼結構施工及檢驗基準","下列哪種銲接方法，藉由被覆銲條與工作母材間產生的電弧為熱源，將銲條與母材熔融以達到接合目的？ (A)氣體遮護金屬電弧銲接 (B)包藥銲線電弧銲接 (C)被覆金屬電弧銲接 (D)電熱氣體銲接。","C"],[1915,"單元二：第八章 鋼結構施工及檢驗基準","下列哪一種銲接方法，使用實心銲線為電極，由馬達持續送線自銲槍前端之銲嘴送出，並與母材接觸產生電弧，經由電弧熱熔融銲線與母材達接合目的： (A)氣體遮護金屬電弧銲接 (B)電熱氣體銲接 (C)被覆金屬電弧銲接 (D)潛弧銲接。","A"],[1916,"單元二：第八章 鋼結構施工及檢驗基準","下列哪一種銲接方法，銲線為管狀內含銲藥，其銲藥之功能同被覆金屬電弧銲接。銲接過程藉由連續送線方式與母材持續產生電弧，由電弧熱熔融母材加入銲材熔滴達接合目的： (A)氣體遮護金屬電弧銲接 (B)包藥銲線電弧銲接 (C)被覆金屬電弧銲接 (D)潛弧銲接。","B"],[1917,"單元二：第八章 鋼結構施工及檢驗基準","下列哪一種銲接方法，其銲線為管狀內含銲藥，俗稱包藥銲線： (A)被覆金屬電弧銲接 (B)包藥銲線電弧銲接 (C)潛弧銲接 (D)氣體遮護金屬電弧銲接。","B"],[1918,"單元二：第八章 鋼結構施工及檢驗基準","下列何種銲接方式，送線機將成捲型之實心銲線送出，與母材間形成電弧，藉由電弧熱熔融母材及銲線形成銲接金 電弧銲接 (D)被覆金屬電弧銲接。","A"],[1939,"單元二：第八章 鋼結構施工及檢驗基準","銲接方法中ESW之中文全名為： (A)潛弧銲接 (B)電熱熔渣銲接 (C)包藥銲線電弧銲接 (D)被覆金屬電弧銲接。","B"],[1940,"單元二：第八章 鋼結構施工及檢驗基準","銲接方法中EGW之中文全名為： (A)潛弧銲接 (B)氣體遮護金屬電弧銲接 (C)電熱氣體銲接 (D)被覆金屬電弧銲接。","C"],[1941,"單元二：第八章 鋼結構施工及檢驗基準","在工地現場就已吊裝完成之圓管接頭進行電銲，下列何種電銲方法不適用？ (A)包藥銲線電弧銲接 (B)被覆金屬電弧銲接 (C)潛弧銲接 (D)氣體遮護金屬電弧銲接。","C"],[1942,"單元二：第八章 鋼結構施工及檢驗基準","編訂銲接程序書(WPS)中\"已認可之銲接程序\"時，可參考下列何種規範？ (A)ASTM (B)CNS (C)JIS (D)AWS。","D"],[1943,"單元二：第八章 鋼結構施工及檢驗基準","一般鋼構工程之銲接程序可分成\"已認可之銲接程序\"及\"實作銲接程序\"兩類。實作銲接程序須於施工前完成銲接程序試驗，下列何者不包含於銲接程序試驗內容中？ (A)銲條材質 (B)母材材質 (C)構件數量 (D)開槽角度。","C"],[1944,"單元二：第八章 鋼結構施工及檢驗基準","一般鋼構工程之銲接程序可分成\"已認可之銲接程序\"及\"實作銲接程序\"兩類。\"已認可之銲接程序\"為美國銲接協會(AWS)認可之接頭細節作為施工依據，原則上無須再進行程序檢驗。下列哪一項條件變動時須重做銲接程序？ (A)電銲方法之用，如：手銲或自動電銲 (B)銲條種類 (C)母材材質 (D)以上皆是。","D"],[1945,"單元二：第八章 鋼結構施工及檢驗基準","一般鋼構工程之銲接程序可分成\"已認可之銲接程序\"及\"實作銲接程序\"兩類。\"已認可之銲接程序\"為美國銲接協會(AWS)認可之接頭細節作為施工依據。若個案工程特殊情況，施工前電銲作業人員應先完成銲接程序試驗，試驗內容不包括下列哪一項？ (A)電銲設備之電流及電壓設定 (B)電銲方法選用 (C)銲條種類及材質 (D)銲工體能。","D"],[1946,"單元二：第八章 鋼結構施工及檢驗基準","對於實務工程之特殊銲接案例，施工前電銲作業人員應先依工程實際製作及安裝時之相關銲接細節進行確認，稱之為： (A)銲接方法驗證 (B)銲接程序驗證 (C)銲工考試 (D)銲材驗證。","B"],[1947,"單元二：第八章 鋼結構施工及檢驗基準","由於人工電銲之銲條表面被覆著砂質助熔劑，其使用狀態必須完全乾燥，才能獲致良好電銲效果。因此，工地施工時，銲條必須進行管制，下列何者為正確？ (A)銲條放入保溫箱 (B)銲條放入保險箱 (C)銲條置放於露天 (D)工人自行保管銲條。","A"],[1948,"單元二：第八章 鋼結構施工及檢驗基準","由於人工電銲之銲條表面被覆著砂質助熔劑，其使用狀態必須完全乾燥，才能獲致良好電銲效果。因此，鋼結構電銲工於工作場合應隨身攜帶下列何項： (A)保溫罐 (B)乾燥筒 (C)石灰桶 (D)以上皆非。","B"],[1949,"單元二：第八章 鋼結構施工及檢驗基準","人工電銲之銲條表面被覆著砂質助熔劑，為獲致良好電銲效果，銲條於使用狀態時，必須保持： (A)完全乾燥 (B)表面濕氣 (C)表面無浮繡與灰塵 (D)潤滑油膜。","A"],[1950,"單元二：第八章 鋼結構施工及檢驗基準","當接頭之母材強度不同組合時，其可選用的填料金屬，下列敘述何者有誤？ (A)選用與較低強度母材匹配者 (B)選用與較高強度母材匹配者 (C)選用與較低強度母材匹配並產生低氫熔填金屬者 (D)以上皆非。","A"],[1951,"單元二：第八章 鋼結構施工及檢驗基準","當接頭之母材強度不同組合時，銲接填料金屬與預熱溫度如何選擇？ (A)與較低強度母材匹配 (B)與母材平均強度匹配 (C)與較低強度母材匹配並產生低氫熔填金屬者，且選用較高強度組之預熱溫度 (D)與較低強度母材匹配並產生低氫熔填金屬者，選用較低強度組之預熱溫度。","C"],[1952,"單元二：第八章 鋼結構施工及檢驗基準","兩種不同降伏強度之鋼材銲接時，其可選用的填料金屬規格，下列敘述何者正確？ (A)只能使用適用於較高強度鋼材之電銲條 (B)應使用適用於兩種鋼材平均強度之電銲條 (C)得採用較低強度鋼種之電銲條 (D)應使用高於較低強度鋼種之電銲條。","C"],[1953,"單元二：第八章 鋼結構施工及檢驗基準","填料金屬規格AWS E7016是下列何種銲接方法所使用的銲條？ (A)電 組立 (D)構件施工環境嚴苛。","C"],[2005,"單元二：第八章 鋼結構施工及檢驗基準","於鋼構廠儲料區內將製作完成鋼構件依實際工地情況進行模擬安裝，此作業稱為試併裝(假安裝)。評估該鋼構工程是否進行假安裝，下列之考量因素何者有誤？ (A)接頭調整困難之大型構件 (B)鋼構廠內的施工環境嚴苛 (C)確認構件精度 (D)複雜之接頭型式。","B"],[2006,"單元二：第八章 鋼結構施工及檢驗基準","鋼構工程通常依其工程特性考量是否進行試併裝(假安裝)作業，下列哪一項因素需進行假安裝作業： (A)接頭調整困難之大型構件 (B)螺栓接頭開孔過多的構件 (C)位於郊區的鋼構吊裝 (D)高單價的鋼構大樓豪宅。","A"],[2007,"單元二：第八章 鋼結構施工及檢驗基準","鋼構工程進行試併裝(假安裝)作業時，應確認內容包含下列哪一項細節： (A)構件全長、全寬、高程等幾何條件 (B)構件接頭情況，含接頭密合情況、螺栓貫通率、阻塞率、銲接接頭組立精度 (C)接頭施工條件，含螺栓接合之締結槍施工空間、人員進出空間、組裝動線、構件組立空間、施工機具運搬 (D)以上皆是。","D"],[2008,"單元二：第八章 鋼結構施工及檢驗基準","鋼構工程進行試併裝(假安裝)作業時，下列哪一項不是確認構件接頭精度的檢測： (A)接頭密合情形 (B)螺栓貫通率 (C)構件全長 (D)螺栓阻塞率。","C"],[2009,"單元二：第八章 鋼結構施工及檢驗基準","橋梁鋼構工程進行試併裝(假安裝)作業時，螺栓接頭之主構件間之間隙δ與連接板間之間隙δ，δ之檢驗標準不得大於多少？ (A)2㎜ (B)5㎜ (C)10㎜ (D)15㎜。","B"],[2010,"單元二：第八章 鋼結構施工及檢驗基準","鋼構工程進行試併裝(假安裝)作業時，結構體高度小於5m時(H<5m)，假安裝之組立高度容許誤差為何？ (A)±2mm (B)±5mm (C)±10mm (D)±15mm。","B"],[2011,"單元二：第八章 鋼結構施工及檢驗基準","鋼構工程進行試併裝(假安裝)作業時，精度調整及計測應使用何種儀器？ (A)水準儀 (B)經緯儀 (C)全測站儀 (D)以上皆是。","D"],[2012,"單元二：第八章 鋼結構施工及檢驗基準","鋼結構工地接頭採用高強度螺栓，當被鎖緊構件之最外緣兩側鋼板不相互平行時，即螺栓穿鎖後螺栓之軸心線未與鋼板面垂直，當其軸心線與鋼板法線之偏量斜率大於多少時，其螺栓墊片需使用硬化斜削墊片以調整螺栓軸心線偏量？ (A)1/5 (B)1/10 (C)1/15 (D)1/20。","D"],[2013,"單元二：第八章 鋼結構施工及檢驗基準","鋼結構工地接頭採用高強度螺栓，施工檢驗應包含： (A)螺栓安裝前，工程師須先確認螺栓材料是否符合規定 (B)工程師須依規定進行各類校正及相關試驗程序視導 (C)工程師須監督螺栓之穿鎖作業 (D)以上皆是。","D"],[2014,"單元二：第八章 鋼結構施工及檢驗基準","一般鋼結構摩擦型螺栓之接合面處理必須依相關規定辦理，下列哪項規定有誤？ (A)接合面不含漆膜 (B)若鋼構件接合面需噴佈漆膜，須先進行鋼板表面之噴砂處理，俟清潔乾淨後再予噴塗 (C)鋼構件之螺栓貼合面已塗裝漆膜時，須滿足施工規範規定之塗裝間隔及養護時程規定，未完成塗裝系統之全部作業時，構件不得進行貼合面螺栓之組裝作業 (D)鍍鋅構件之螺栓貼合面須採熱浸鍍鋅規定方式處理，且鍍鋅完後須以電動鋼刷進行貼合面粗糙處理。","D"],[2015,"單元二：第八章 鋼結構施工及檢驗基準","鋼結構螺栓接頭安裝時，應確實清潔被鎖緊構件間表面，含螺栓螺頭及螺帽與被鎖緊構件接觸附近，不得附著浮鏽、灰塵等雜物。一般摩擦型螺栓接合面之處理規定，下列何者有誤？ (A)接合面不含漆膜，於任何方向之塗漆均不得噴佈於螺栓孔附近周邊 (B)構件接合面須施予漆膜噴佈前，鋼板表面須進行噴砂處理，俟清潔乾淨後再予噴塗 (C)螺栓貼合面已塗裝漆膜之構件，須符合中間漆膜之塗裝間隔及養護時程規定，但非強制要求，故不一定要遵行 (D)鍍鋅構件之螺栓貼合面須採熱浸鍍鋅規定方式處理。","C"],[2016,"單元二：第八章 鋼結構施工及檢驗基準","針對高張力螺栓的使用以下何者正確？ (A)要調整梁柱接頭處的高低差已安裝使用的高張力螺栓均可拆除後再重複使用鎖固 (B)高張力螺栓穿鎖無需考慮順序有鎖緊就好 (C)斷尾螺栓只要只要螺栓斷尾後就無需再進行目視檢視 (D)使用斷尾行螺栓扭斷後應研磨銳角，確保後續塗裝品質。","D"],[2017,"單元二：第八章 鋼結構施工及檢驗基準","高強度螺栓廣泛應用於鋼構橋梁之工地接頭，有關螺栓接頭之規定，下列何者敘述有誤？ (A)結合面若有不平整，可用混凝土補平 (B)螺栓穿鎖範圍內之被鎖緊物均是鋼材 (C)接頭安裝時需確保被鎖緊構件間之表面清潔 (D)毛邊須於構件鑽孔完成時即予研磨去除。","A"],[2018,"單元二：第八章 鋼結構施工及檢驗基準","有關鋼結構使用螺栓工地接頭，下列敘述何者錯誤？ (A)螺栓群所需之全數螺栓須同時穿鎖 (B)螺栓進場後應盡量立即使用，未使用完畢之螺栓須儘速回存 (C)當摩擦型螺栓於工地儲置期間，若生鏽反而可以增加摩擦力 (D)螺栓儲存期間，應避免沾染灰塵及浸染水氣。","C"],[2019,"單元二：第八章 鋼結構施工及檢驗基準","高強度螺栓之鎖固程序，至少需經過幾階段作業？ (A)1 (B)2 (C)3 (D)4。","B"],[2020,"單元二：第八章 鋼結構施工及檢驗基準","目前國內鋼結構螺栓接頭施工，大多採用自動扭力控制之高強度螺栓，目視檢查螺栓群是否完成鎖緊程序，係依據下列何種情況判斷？(A)螺栓孔是否有毛邊(B)螺栓是否有斷尾 (C)螺栓是否有貼緊狀態 (D)螺栓接合表面是否有鏽蝕。","B"],[2021,"單元二：第八章 鋼結構施工及檢驗基準","鋼結構螺栓接頭安裝前之注意事項，下列敘述何者有誤？ (A)工程師須先確認螺栓之標註、外觀、儲置螺栓、螺帽、墊片及構件接頭之接合表面條件是否符合規定 (B)依規定進行各類校正及相關試驗程序，以確認選用之螺栓組依正確程序進行相關試驗 (C)採用自動扭力控制之高拉力螺栓，如未能順利鎖斷時，應指導施以斷尾技術 (D)監督螺栓之穿鎖作業，以確認工程期初所進行之相關試驗落實於實際作業程序。","C"],[2022,"單元二：第八章 鋼結構施工及檢驗基準","鋼結構之高強度螺栓接合，施工時之注意事項不包含： (A)螺栓接合部之清潔 (B)接合板面之平整度 (C)得鎚擊螺栓入孔 (D)螺栓受力部位之鎖緊順序。","C"],[2023,"單元二：第八章 鋼結構施工及檢驗基準","鋼結構之高強度螺栓施工時，首先將全數螺栓穿插完成後，進行第一階段鎖緊達到「貼緊狀態」後，再進行第二階段之鎖緊作業，其鎖緊作業順序為： (A)由螺栓群之上方往下方施作 (B)由螺栓群之下方往上方施作 (C)由螺栓群之兩端往中間施作 (D)由螺栓群之中間往兩端施作。","D"],[2024,"單元二：第八章 鋼結構施工及檢驗基準","螺栓接頭安裝時需確保被鎖緊構件間之表面潔淨，故須徹底清除浮鏽、鬆屑、油脂、塵垢及一切有害之附著物，接合面不得塗有漆膜，於任何方向之塗漆均須與螺栓恐邊距離至少： (A)1倍螺栓直徑且須大於1英吋 (B)2倍螺栓直徑且須大於1英吋 (C)2英吋 (D)2倍螺栓直徑。","A"],[2025,"單元二：第八章 鋼結構施工及檢驗基準","一般摩擦型螺栓接合部之摩擦面不得塗有漆膜，進行塗裝作業時，於任何方向之塗漆均須與螺栓恐邊距離至少： (A)螺栓孔邊外加0.5倍螺栓直徑且須大於0.5英吋 (B)螺栓孔邊外加1倍螺栓直徑且須大於1英吋 (C)螺栓孔邊外加1.5倍螺栓直徑且須大於1.5英吋 (D)螺栓孔邊外加2倍螺栓直徑且須大於2英吋。","B"],[2026,"單元二：第八章 鋼結構施工及檢驗基準","目前於鋼構廠之鋼構件表面處理方式，大多採何種方式處理？ (A)熱浸鍍鋅 (B)全面砂輪機拋光 (C)陽極處理 (D)全面噴砂加局部機械研磨。","D"],[2027,"單元二：第八章 鋼結構施工及檢驗基準","手工具或電動研磨砂輪機進行鋼構件表面處理，其潔淨等級之代號為： (A)Sa (B)Sm (C)St (D)Ss。","C"],[2028,"單元二：第八章 鋼結構施工及檢驗基準","鋼構件表面噴砂處理後，須於幾小時內進行後續防鏽底漆塗裝作業？ (A)4小時 (B)5小時 (C)6小時 (D)24小時。","A"],[2029,"單元二：第八章 鋼結構施工及檢驗基準","鋼構件表面噴砂處理後，超過幾小時才進行後續防鏽底漆塗裝作業，將有塗裝品質之疑慮？ (A)7小時 (B)6小時 (C)5小時 (D)4小時。","D"],[2030,"單元二：第八章 鋼結構施工及檢驗基準","下列何者屬於鍍鋅流程中的前處理作業？ (A)酸洗 (B)浸鍍 (C)冷卻 (D)表面整修。","A"],[2031,"單元二：第八章 鋼結構施工及檢驗基準","鍍鋅後構件之防蝕效果佳，一般環境防蝕效果可達30~50年，鍍鋅防蝕原理以下何者為非？ (A)電鍍保護 (B)抗腐蝕鋼材 (C)塗膜保護 (D)陰極保護。","B"],[2032,"單元二：第八章 鋼結構施工及檢驗基準","下列何者非熱浸鍍鋅的流程？ (A)助熔劑處理 (B)脫脂處理 (C)噴砂處理 (D)酸洗處理。","C"],[2033,"
