<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>題庫練習</title>
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--fg:#1c2333;--muted:#667085;--line:#dfe3ec;
  --pri:#2563eb;--pri-fg:#fff;--ok:#16a34a;--okbg:#e8f7ee;--bad:#dc2626;--badbg:#fdecec;--selbg:#e8efff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1420;--card:#1a2130;--fg:#e8ecf5;--muted:#9aa4b8;--line:#2a3348;
    --pri:#5b8cff;--pri-fg:#0b1020;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#3a1616;--selbg:#1e2a4a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:8px 0 2px}
h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
button,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--pri);color:var(--pri-fg);border-color:var(--pri);font-weight:600}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:44px}
.units{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.unit{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.95rem;cursor:pointer}
.unit:last-child{border-bottom:0}
.unit input{margin-top:5px;width:18px;height:18px;flex:none}
.unit .n{margin-left:auto;color:var(--muted);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px;min-height:44px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-fg);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.stem{white-space:pre-wrap;word-break:break-word;font-size:1.05rem;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;text-align:left;align-items:flex-start;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--fg)}
.opt .key{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt .txt{white-space:pre-wrap;word-break:break-word;padding-top:1px}
.opt.sel{border-color:var(--pri);background:var(--selbg)}
.opt.sel .key{background:var(--pri);color:var(--pri-fg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt:disabled{opacity:1;cursor:default}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.95rem;white-space:pre-wrap}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.nav{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.nav .btn{flex:1}
.score{font-size:3rem;font-weight:800;line-height:1.1}
.wi{border-top:1px solid var(--line);padding:12px 0}
.wi:first-child{border-top:0}
.wi .me{color:var(--bad);font-size:.92rem}
.wi .ans{color:var(--ok);font-size:.92rem}
.toast{position:fixed;left:16px;right:16px;bottom:24px;max-width:600px;margin:0 auto;background:#1c2333;color:#fff;padding:12px 16px;border-radius:12px;z-index:9;white-space:pre-wrap;font-size:.95rem}
.hint{color:var(--muted);font-size:.9rem;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>

window.BUILTIN={"name":"公共工程雲端服務網測試題目公布-公共工程品質管理訓練班(土建) 【115年1月起適用】","sheets":[[["公共工程雲端服務網測試題目公布-公共工程品質管理訓練班(土建) 【115年1月起適用】","","",""],["列印日期：民國115年09月18日","","",""],["序號","課程名稱","題目","答案"],[1,"單元一： 政府採購全生命週期概論","依公共建設工程經費估算編列手冊總則篇，以下何者非屬工程建造費之編列架構？ (A)直接工程成本 (B)間接工程成本 (C)用地取得及拆遷補償費用 (D)工程預備費。","C"],[2,"單元一： 政府採購全生命週期概論","下列因應物價波動之方式，何者非屬妥適？ (A)計畫階段預為編列物調費及預備費 (B)個案契約依工程會工程採購契約範本採用3層級物調規定 (C)工程招標時請廠商提出放棄物調聲明書 (D)招標文件公告前再次訪查市場行情。","C"],[3,"單元一： 政府採購全生命週期概論","下列何者非政府協調改善本國營造業工缺工之措施？ (A)合理檢討移工規定 (B)加強本國勞工訓練媒合 (C)推動營建自動化 (D)全面開放移工進駐工地。","D"],[4,"單元一： 政府採購全生命週期概論","依政府公共工程計畫與經費審議作業要點基本設計階段之必要圖說之規定，機關當次送審基本設計之工程建造經費達新臺幣多少時，應辦理替選方案評估，並將替選方案評估報告納為必要圖說文件？ (A)10億元 (B)4億元 (C)1億元 (D)5千萬元。","A"],[5,"單元一： 政府採購全生命週期概論","依共同性費用編列基準，專案研析後得計列之項目，不包含下列何者？ (A)基地一般性整理 (B)綠建築 (C)挑高空間 (D)智慧建築。","A"],[6,"單元一： 政府採購全生命週期概論","下列何者非屬「契約書圖條件不合理」之情形？ (A)保固年限過長 (B)訂定技術規格時，以功能或效益等精確方式說明招標需求，而不提供參考品牌 (C)材料綁標 (D)設計內容過簡要求廠商負設計責任。","B"],[7,"單元一： 政府採購全生命週期概論","機關應務實評選規劃設計廠商，評定實務可行之方案，評選委員及工作小組應於評選前瞭解之事項包含？1.計畫需求與預算。2.期程。3.各廠商投標內容。4.契約變更方案。 (A)1234 (B)123 (C)124 (D)234。","B"],[8,"單元一： 政府採購全生命週期概論","機關辦理採購應核實編列計畫預算，下列何者非考量之因素？ (A)機關需求 (B)使用年限 (C)未來契約可能因廠商違約重行招標之經費 (D)維護管理。","C"],[9,"單元一： 政府採購全生命週期概論","廠商如有違規棄土者，應要求限期清除；如未改善時，按契約規定(A)扣款 (B)停止估驗 (C)終止契約或移請直轄市、縣(市)政府依規定查處 (D)以上皆是。","D"],[10,"單元一： 政府採購全生命週期概論","機關辦理工程採購估驗計價，除契約另有約定，一般每期估驗款須扣除多少百分比之保留款？ (A)3％ (B)5% (C)6% (D)7%。","B"],[11,"單元一： 政府採購全生命週期概論","基於促進循環經濟效益，及輔導產業健全發展，工程會依行政院指示，推動部分工程材料可適材、適所、適量運用於公共工程，該等材料不包含下列何者？ (A)焚化再生粒料 (B)煉鋼爐碴 (C)AC刨除料 (D)廢輪胎。","D"],[12,"單元一： 政府採購全生命週期概論","工程會透過專案檢討會議發現流標皆有其個案因素，下列何者為非？ (A)物價上漲 (B)預算不符實際 (C)工期不符實際 (D)契約書圖條件不合理。","A"],[13,"單元一：第一章 公共工程施工品質管理制度理念與導入","下列何者非監造單位及其派駐現場人員工作重點？ (A)對各施工作業應依工程契約及監造計畫實施抽查，並填具施工品質抽查紀錄表 (B)依規定填報監造報表 (C)發現缺失時，應即通知廠商限期改善並採取矯正措施 (D)每日赴現場會同品管人員辦理自主檢查。","D"],[14,"單元一：第一章 公共工程施工品質管理制度理念與導入","下列哪一項非機關或監造單位建立品質查證系統之內容？ (A)成立監造組織 (B)訂定監造計畫 (C)撰寫施工計畫 (D)辦理施工及材料設備之抽(查)驗作業。","C"],[15,"單元一：第一章 公共工程施工品質管理制度理念與導入","品質管理的運作主要是利用下列哪些項目循環模式的管理加以落實？ (A)計劃、實施、查核及改善 (B)規劃、改善、結案及建檔 (C)需求、查核、執行及計畫 (D)稽核、變更、實施及確認。","A"],[16,"單元一：第一章 公共工程施工品質管理制度理念與導入","品管大師戴明博士(Dr.Deming)指出：「品質的問題的產生有百分之八十導因於 (A)管理不善 (B)設計不良 (C)業主需求不明 (D)無證照制度」。","A"],[17,"單元一：第一章 公共工程施工品質管理制度理念與導入","機關辦理公告金額以上工程，應辦理下列何者事項？(A)委託監造招標文件內應訂明監造單位提報監造計畫 (B)工程招標文件內應訂明廠商提報品質計畫 (C) 工程及委託監造招標文件內應訂明鋼筋、混凝土、瀝青混凝土及其他適當檢驗或抽驗項目，由符合CNS 17025規定之實驗室辦理，並出具報告 (D)以上皆是。","D"],[18,"單元一：第一章 公共工程施工品質管理制度理念與導入","查核金額以上工程，廠商應於何時將品管人員資料提報監造單位審查？ (A)竣工前 (B)竣工後 (C)開工前 (D)開工後。","C"],[19,"單元一：第一章 公共工程施工品質管理制度理念與導入","監造單位及其派駐現場人員工作重點，不包括下列何者？ (A)工地之人員、機具及材料等管理 (B)審查廠商所提施工計畫及品質計畫 (C)抽驗比對廠商所提之材料設備之出廠證明、檢驗文件、試驗報告等之內容、規格及有效日期 (D)對各施工作業實施抽查。","A"],[20,"單元一：第一章 公共工程施工品質管理制度理念與導入","廠商專任工程人員工作重點，不包括下列何者？ (A)督察品管人員及現場施工人員，落實品質計畫 (B)品質文件、紀錄之管理 (C)督導按圖施工、解決施工技術問題 (D)查核(驗)工程時到場說明。","B"],[21,"單元一：第一章 公共工程施工品質管理制度理念與導入","廠商品管人員工作重點，不包括下列何者？ (A)訂定品質計畫 (B)執行內部品質稽核 (C)矯正預防措施之提出及追蹤改善 (D)填報施工日誌。","D"],[22,"單元一：第一章 公共工程施工品質管理制度理念與導入","以下何項為正確？ (A)好的工程品質查證，主要係依賴查核達成 (B)品管表報文件是配合查核所自然產生的副產品，而不是另花時間刻意去編造 (C)承攬之工程獲得公共工程金質獎，施工廠商得免負品質無瑕疵的完全責任 (D)以上皆非。","D"],[23,"單元一：第一章 公共工程施工品質管理制度理念與導入","依｢工程施工查核小組組織準則｣規定，若某縣鄉公所辦理由某部會經費補助之工程，請問下列何機關之工程施工查核小組可以辦理該工程之查核？(1.行政院公共工程委員會2.補助之部會3.上級主管機關縣政府4.該鄉公所5.審計部) (A)1,2 (B)1,2,3 (C)2,3,4 (D)1,2,3,5。","B"],[24,"單元一：第一章 公共工程施工品質管理制度理念與導入","依「公共工程施工品質管理作業要點」規定，若某公共工程之招標採購預算為2億5千萬元，決標金額為1億5千萬元，其施工廠商應設置至少幾位品管人員？ (A)1人 (B)2人 (C)3人 (D)不需設置。","B"],[25,"單元一：第一章 公共工程施工品質管理制度理念與導入","品管人員有下列何項情事之一者，由機關通知廠商限期更換並調離工地，並由機關填報於工程會資訊網路系統備查：1.未能確實執行內部品質稽核，如查核自主檢查表之檢查項目、檢查結果是否詳實記錄等2.未能確實依據營造業法第三十五條規定，辦理相關工作，如督察按圖施工、解決施工技術問題3.工程查核列為丙等，僅可歸責於監造單位人員者4.工程查核缺失未於期限內改善完成且未經查核小組同意展延期限者，可歸責於該品管人員者 (A)4 (B)1.2 (C)1.4 (D)1.2.3.4。","C"],[26,"單元一：第一章 公共工程施工品質管理制度理念與導入","全面品質管理主要是利用下列何項步驟 1.計劃 2.實施 3.查核 4.改善的管理環循模式加以落實。 (A)1、2、4 (B)1、2、3 (C)2、3、4 (D)1、2、3、4。","D"],[27,"單元一：第一章 公共工程施工品質管理制度理念與導入","查核小組查核時，下列何者須配合到場說明？(不預先通知除外)1.建築師 2.技師 3.專任工程人員 4.工地主任。 (A)1.2 (B)1.2.3 (C)2.3.4 (D)1.2.3.4。","D"],[28,"單元一：第一章 公共工程施工品質管理制度理念與導入","工程品質成效，係指工程本體達到下列何者之1.契約2.設計圖說3.施工規範目標品質。 (A)1 (B)2、3 (C)1、3 (D)1、2、3。","D"],[29,"單元一：第一章 公共工程施工品質管理制度理念與導入","工程品管紀錄文件的產生，是 (A)品質管控過程中自然產生的副產品 (B)配合工程施工查核小組特別製作 (C)配合主辦機關督導特別製作 (D)花時間刻意編造的。","A"],[30,"單元一：第一章 公共工程施工品質管理制度理念與導入","建立三級品管制度，對工程品質有下列何者幫助？(1.提昇公共工程品質2.建立有效的品質系統3.藉以督促、矯正、預防廠商品質管理的缺失4.確保品質管理機制的運作) (A)1、4 (B)1、2 (C)1、2、3 (D)1、2、3、4。","D"],[31,"單元一：第一章 公共工程施工品質管理制度理念與導入","品質缺失須做到下列何項，方能避免重複發生，徹底做到矯正與預防？ (A)更換瑕疵品 (B)打除重做 (C)修補 (D)根本改變品控的機制及落實做到探討缺失發生的原因。","D"],[32,"單元一：第一章 公共工程施工品質管理制度理念與導入","如何做到好的工程品質，主要須靠下列何者才能達成？ (A)主管機關加強查核 (B)現場工作人員自始至終一貫的努力與堅持優良的品質信念 (C)主辦機關加強督導 (D)品管部門密集稽核。","B"],[33,"單元一：第一章 公共工程施工品質管理制度理念與導入","為監督及確保工程的施工成果符合設計及規範，主辦機關應辦理下列何項計畫，並落實執行以確保工程可如期如質達成？ (A)設置專任品管人員 (B)設立監造組織訂定監造計畫 (C)成立工程施工查核小組 (D)擬定施工計畫。","B"],[34,"單元一：第一章 公共工程施工品質管理制度理念與導入","檔案文件管理為了下列何者品質管理目的？ (A)為了工程施工查核需要而建置 (B)將龐雜無章的文件作有系統的整理分類以便於查閱 (C)屬於專案管理廠商及主辦機關之工作 (D)為了改正缺失而製作。","B"],[35,"單元一：第一章 公共工程施工品質管理制度理念與導入","下列何者不得因機關辦理查驗、測試或檢驗，而免除其依契約所應履行或承擔之責任？ (A)主辦機關 (B)設計單位 (C)監造單位 (D)承攬廠商。","D"],[36,"單元一：第一章 公共工程施工品質管理制度理念與導入","公共工程的施工品質下列何者應負品質無瑕疵的完全責任？ (A)主辦機關 (B)監造單位 (C)承攬廠商 (D)專任工程人員。","C"],[37,"單元一：第一章 公共工程施工品質管理制度理念與導入","下列何者不是施工查核缺失改正的目的？ (A)瑕疵品的更換、重做 (B)改變品質管控的機制 (C)撤換品管人員 (D)探討缺失原因，落實矯正與預防。","C"],[38,"單元一：第一章 公共工程施工品質管理制度理念與導入","下列何者敘述有誤？ (A)品管紀錄的產生應為執行品質管理所自然產生的副產品，而不是刻意去編造 (B)機關辦理查驗、測試或檢驗後，廠商可免除契約應履行或承擔之責任 (C)廠商應落實探討查核缺失原因，並進行矯正與預防 (D)文件保存的功能在於真實記錄施工的實際過程。","B"],[39,"單元一：第一章 公共工程施工品質管理制度理念與導入","下列何者不是監造單位派駐現場人員的工作重點？ (A)審查施工計畫及品質計畫 (B)對施工作業實施抽查 (C)填報施工日誌 (D)於檢驗停留點(限止點)時就適當檢驗項目會同廠商取樣送驗。","C"],[40,"單元一：第一章 公共工程施工品質管理制度理念與導入","依工程施工查核小組作業辦法，下列何者敘述有誤？ (A)查核缺失情節重大影響安全者，查核結果應列為丙等 (B)查核小組查核紀錄應於十個工作天內送工程主辦機關 (C)查核缺失情節重大者及未於期限改善，經檢討屬廠商權責者，應通知廠商撤換工地負責人及品管人員或勞工安衛管理人員 (D)查核缺失未能於期限內改善完成，應報請查核小組同意展延期。","B"],[41,"單元一：第二章 公共工程管理相關法規概要","政府採購法規定擇定適當之決標原則不包含下列何者方式 (A)採最低標 (B)採最有利標 (C)採評分及格最低標 (D)以上均可。","D"],[42,"單元一：第二章 公共工程管理相關法規概要","共同管道法規定，所列共同管道包含下列那些設施？ (A)幹管 (B)支管 (C)電纜溝 (D)以上皆是。","D"],[43,"單元一：第二章 公共工程管理相關法規概要","市區道路條例主管機關，在中央為內政部，直轄市為何 (A)工務局 (B)養護工程處 (C)直轄市政府 (D)區公所。","C"],[44,"單元一：第二章 公共工程管理相關法規概要","公有新建建築物之總工程建造經費達新臺幣多少金額以上者，自101年1月1日起，建築工程於工程驗收合格並取得合格級以上綠建築標章後，始得發給結算驗收證明書 (A)5000萬 (B)1億元 (C)2億元 (D)不限金額。","A"],[45,"單元一：第二章 公共工程管理相關法規概要","綠建築評估指標系統計有九項評估指標，不包含下列何項指標？ (A)基地保水 (B)水資源 (C)智慧化 (D)節能。","C"],[46,"單元一：第二章 公共工程管理相關法規概要","促進民間參與公共建設法於第52條及第53條規定，民間機構於興建或營運期間，如有施工進度嚴重落後、工程品質重大違失、經營不善或其他重大情事發生，主辦機關依投資契約得以書面通知民間機構，要求定期改善，屆期不改善或改善無效者，可採行之中止措施，不包含下列何者？ (A)興建 (B)營運一部分 (C)營運全部 (D)逕行解約。","D"],[47,"單元一：第二章 公共工程管理相關法規概要","水土保持之處理與維護之調查、規劃、設計、監造，如涉及農藝或植生方法、措施之工程金額達總計畫之多少比例以上者，主管機關應要求承辦技師交由具有該特殊專業技術之水土保持技師負責簽證。 (A)10% (B)20% (C)30% (D)40%。","C"],[48,"單元一：第二章 公共工程管理相關法規概要","水土保持法施行細則第4條規定，下列哪類專業技師依規定可以辦理規劃、設計及監造工作。 (A)水土保持技師 (B)土木技師 (C)水利技師 (D)以上皆可。","D"],[49,"單元一：第二章 公共工程管理相關法規概要","環境影響評估法係屬程序法，通過環評是指完成下列何者之程序的許可？ (A)開發 (B)考核 (C)請領建造執照 (D)以上皆是。","A"],[50,"單元一：第二章 公共工程管理相關法規概要","環境影響評估法有關環境影響評估工作包括第一階段、第二階段，係指完成下列那些程序作業 (A)評估 (B)審查 (C)追蹤考核 (D)以上皆是。","D"],[51,"單元一：第二章 公共工程管理相關法規概要","營造業法施行細則第18條規定本法第30條所定應置工地主任之工程金額或規模，下列何者錯誤？ (A)承攬金額新臺幣5,000萬元以上之工程 (B)建築物高度36公尺以上之工程 (C)建築物地下室開挖10公尺以上之工程 (D)橋樑柱跨距20公尺以上之工程。","D"],[52,"單元一：第二章 公共工程管理相關法規概要","技師法之主管機關，在中央為何？ (A)交通部 (B)內政部 (C)公共工程委員會 (D)經濟部。","C"],[53,"單元一：第二章 公共工程管理相關法規概要","建築師受委託辦理建築物之設計，應負該工程設計之責任；其受委託監造者，應負監督該工程施工之責任，但有關建築物結構與設備等專業工程部分，除幾層以下非供公眾使用之建築物外，其餘應由承辦建築師交由依法登記開業之專業技師負責辦理，建築師並負連帶責任 (A)3層 (B)4層 (C)5層 (D)10層。","C"],[54,"單元一：第二章 公共工程管理相關法規概要","土石採取法之主管機關，在中央為何？ (A)交通部 (B)內政部 (C)公共工程委員會 (D)經濟部。","D"],[55,"單元一：第二章 公共工程管理相關法規概要","依河川管理辦法(民國102年12月27日修正)第18條規定：防汛期間係指每年哪個期間) (A)5月1日至11月30日 (B)4月1日至10月31日 (C)3月1日至10月31日 (D)6月1日至11月30日。","A"],[56,"單元一：第二章 公共工程管理相關法規概要","市區道路條例所稱市區道路主管機關，在中央為何？ (A)交通部 (B)內政部 (C)公共工程委員會 (D)經濟部。","B"],[57,"單元一：第二章 公共工程管理相關法規概要","公路法所稱公路主管機關，在中央為何？ (A)交通部 (B)內政部 (C)公共工程委員會 (D)經濟部。","A"],[58,"單元一：第二章 公共工程管理相關法規概要","依建築法規定，建築物之設計、監造，必須由下列何者登記開業之專業人員為之 (A)建築師 (B)結構技師 (C)土木技師 (D)以上皆是。","A"],[59,"單元一：第二章 公共工程管理相關法規概要","政府採購法針對工程類巨額採購規定，係指多少新臺幣金額以上？ (A)5000萬 (B)1億元 (C)2億元 (D)主辦工程機關簽報核定。","C"],[60,"單元一：第二章 公共工程管理相關法規概要","公開招標、選擇性招標及限制性招標有關訂定底價，係由機關何層級人員負責核定底價？ (A)主辦工程機關首長或其授權人員 (B)主辦工程機關承辦人員 (C)主辦工程機關單位主管 (D)主辦工程機關之上級機關。","A"],[61,"單元一：第二章 公共工程管理相關法規概要","下列規定何者為非？ (A)國道、省道修建工程，由中央公路主管機關辦理， (B)市區道路改善加舖路面時，其寬度在15公尺以內者，得分次分車道鋪設， (C)水利法規定水為天然資源屬於國家所有，不因人民取得土地所有權而受影響， (D)下水道機構因勘查、測量、施工或維護下水道，臨時使用公、私土地時，土地所有人、占有人或使用人不得拒絕。但提供使用之土地因而遭受損害時，應予補償。","B"],[62,"單元一：第二章 公共工程管理相關法規概要","採購法108年5月22日修正後，有關拒絕往來廠商之處理程序，下列何者為非？ (A)通知前，應給予廠商口頭或書面陳述意見機會，機關並應成立採購工作及審查小組認定廠商該當第101條第1項各款情形， (B)機關審酌第101條第1項所定情節重大時，應考量機關所受損害之輕重、廠商可歸責之程度、廠商之實際補救或賠償措施等情形， (C)通知前，不須給予廠商口頭或書面陳述意見機會，逕由機關成立之採購工作及審查小組認定廠商該當第101條第1項各款情形， (D)機關發現廠商有第101條第1項各款情形之一，應將其事實、理由及依第103條第1項所定期間通知廠商，並附記如未提出異議者，將刊登政府採購公報。","C"],[63,"單元一：第二章 公共工程管理相關法規概要","有關驗收作業，下列何者為非？ (A)工程、財物或勞務採購之驗收，廠商未派員機關仍得為之， (B)機關應於收到廠商竣工書面通知之日起七日內會同監造單位及廠商，確定是否竣工， (C)有初驗程序者，機關應於收受全部資料之日起30日內辦理初驗， (D)無初驗程序者，機關應於接獲廠商通知備驗或可得驗收之程序完成後30日內辦理驗收。","A"],[64,"單元一：第二章 公共工程管理相關法規概要","按綠建築標章申請審核認可及使用作業要點規定，下列規定何者為非？ (A)綠建築標章依序分合格級、銅級、銀級、黃金級、鑽石級5等級， (B)綠建築評估指標系統，包括綠化、基地保水、水資源、日常節能、..等九大指標， (C)申請認可之建築物應至少通過四項指標，且包括「日常節能」及「水資源」二項門檻指標在內， (D)候選綠建築證書係於取得使用執照時核發。","D"],[65,"單元一：第二章 公共工程管理相關法規概要","下列規定何者為非？ (A)按108年5月22日增訂之採購法第70-1條規定，安全衛生費用得以直接工程費之一定比率編列，無須量化， (B)採總價結算之營繕工程，如契約內載有保險費單項金額，承包廠商依契約規定投保，其實際支付保險費用，雖低於契約所列該項目金額，機關仍應依契約所列金額支付廠商，惟機關應避免高估保險費， (C)工程保險費用之報價方式，係單獨一項報價，或將工程保險費併入利潤、管理費內不單獨報價，機關得本於權責決定， (D)同等品係指經機關審查認定，其功能、效益、標準或特性不低於招標文件所要求或提及者，並得予以檢驗或測試。","A"],[66,"單元一：第二章 公共工程管理相關法規概要","下列規定何者為非？ (A)開發單位取得目的事業主管機關核發之開發許可後，逾5年始實施開發行為時，應提出環境現況差異分析及對策檢討報告，送主管機關審查 (B)水土保持之處理與維護，如涉及農藝或植生方法、措施之工程金額達總計畫之30％以上者應交由水土保持技師負責簽證 (C)水土保持之處理與維護應由執業之水保技師、土木技師、水利技師、大地技師等辦理規劃、設計及監造 (D)促進民間參與公共建設法主管機關為財政部。","A"],[67,"單元一：第二章 公共工程管理相關法規概要","下列有關工地主任規定何者為非？ (A)新臺幣5,000萬元以上之工程應置工地主任， (B)新臺幣2,000萬元以上之工程應置工地主任， (C)營造業承攬之工程，依規定免置工地主任者，其應負責辦理之工作應由專任工程人員或指定專人為之， (D)建築物高度36公尺以上之工程應置工地主任。","B"],[68,"單元一：第二章 公共工程管理相關法規概要","下列規定何者正確？ (A)建築師開業證書及技師執業執照有效期間均為6年， (B)涉及不同科別技師執業範圍者，得由類似科別技師為之，並分別註明負責之範圍， (C)技師亦得擔任建築物之設計人與監造人， (D)技師執行業務涉及現場作業者，技師得事後查核文件資料。","A"],[69,"單元一：第二章 公共工程管理相關法規概要","有關建築師法，下列規定何者正確？ (A)開業建築師可以簽證五層以下供公眾使用之建築物結構與設備等專業工程 (B)領有建築師證書應具有2年以上建築工程經驗者，始得申請開業證書 (C)領有建築師證書應具有3年以上建築工程經驗者，始得申請開業證書 (D)建築師開業證書有效期間為3年。","B"],[70,"單元一：第二章 公共工程管理相關法規概要","下列規定何者為非？ (A)水利法主管機關在中央為內政部 (B)採取土石不論是河川、陸地或海域均採許可制度 (C)共同管道可分為幹管、支管及電纜溝 (D)下水道之規劃、設計及監造，得委託登記開業之有關專業技師辦理。","A"],[71,"單元一：第二章 公共工程管理相關法規概要","下列規定何者為非？ (A)公路法規定公路用地，非經許可，不得使用 (B)防汎期間為每年7月1日至11月30日 (C)設置穿越水道或水利設施底部之建造物，應申請主管機關核准，並接受施工指導 (D)下水道法規定，下水指排水區域內之雨水、家庭污水及事業廢水。","B"],[72,"單元一：第二章 公共工程管理相關法規概要","有關候選綠建築證書及候選智慧建築證書規定，下列何者正確？ (A)公有新建建築物建造經費達新臺幣5,000萬元以上者，申報開工時，應同時檢附合格級以上候選綠建築證書 (B)公有新建建築物建造經費達新臺幣5,000萬元以上者，申報一樓樓版勘驗時，應同時檢附合格級以上候選綠建築證書 (C)新建建築物不論規模，工程驗收合格並取得合格級以上綠建築標章後，始得發給結算驗收證明書 (D)公有新建建築物建造經費達新臺幣1億元以上者，申報一樓樓版勘驗時，應同時檢附合格級以上候選智慧建築證書。","B"],[73,"單元一：第二章 公共工程管理相關法規概要","有關建築法規定，下列何者為非？ (A)經參加國家考試領有建築師證書者可擔任建築物之設計人與監造人， (B)建築物為定著於土地上或地面下具有頂蓋，樑柱或牆壁之構造物， (C)建築物非經領得使用執照，不准接水、接電、或申請營業登記及使用， (D)領有使用執照之建築物拆除時須申請拆除執照。","A"],[74,"單元一：第二章 公共工程管理相關法規概要","有關採購法規定，下列何者為非？ (A)採最有利標決標者，應先報上級機關核准 (B)採購契約應訂明一方執行錯誤、不實或管理不善，致他方遭受損害之責任 (C)機關若有先行使用之必要者，得辦理部分驗收並支付部分價金 (D)工程採購必須先經初驗合格後，始得辦理驗收。","D"],[75,"單元一：第二章 公共工程管理相關法規概要","有關採購金額規定，下列何者正確？ (A)小額採購為新臺幣10萬元(不含)以下之採購， (B)工程採購查核金額為新臺幣5000萬元， (C)工程採購查核金額為新臺幣1億元， (D)巨額工程採購金額為新臺幣1億元。","B"],[76,"單元一：第二章 公共工程管理相關法規概要","有關採購法規定，下列何者為非？ (A)公告金額以上之採購，應有內部監辦程序， (B)查核金額以上之採購，除內部監辦外應另有上級機關監辦程序， (C)監辦人員對規格及底價訂定亦可提供建議， (D)監辦指監辦人員實地監視或書面審核機關辦理開標、比價、議價、決標及驗收是否符合規定之程序。","C"],[77,"單元一：第二章 公共工程管理相關法規概要","申請許可開發行為時，誰應檢具環境影響說明書，向目的事業主管機關提出，並由目的事業主管機關轉送主管機關審查： (A)土地所有者； (B)營造商； (C)建築師; (D)開發單位。","D"],[78,"單元一：第二章 公共工程管理相關法規概要","開發行為進行中及完成後使用時，應由誰辦理追蹤： (A)開發者 (B)營造商 (C)目的事業主管機關 (D)使用者。","C"],[79,"單元一：第二章 公共工程管理相關法規概要","下列何者開發行為對環境有不良影響之虞者，應實施環境影響評估？ (A)工廠之設立及工業區之開發 (B)蓄水、供水、防洪排水工程之開發 (C)新市區建設及高樓建築或舊市區更新 (D)以上皆是。","D"],[80,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？ (A)營建工程剩餘土石方之種類，包括建築工程、公共工程及其他民間工程所產生之剩餘泥、土、砂、石、磚、瓦、混凝土塊等; (B)所指收容處理場所，包括土石方資源堆置處理場、目的事業處理場所及其他經政府機關依法核准之場所等； (C)違規棄置建築工程及建築物拆除工程剩餘土石方者，應由地方政府勒令承造人按規定限期清除違規現場回復原土地使用目的與功能，逾期未清除回復原使用目的與功能者，得依建築法第58條規定勒令停工; (D)以上皆是。","D"],[81,"單元一：第二章 公共工程管理相關法規概要","營造業法第32條規定營造業之工地主任應負責辦理工作不包括 (A)依施工計畫書執行按圖施工; (B)每日填報施工日誌； (C)工地遇緊急異常狀況之通報; (D)辦理內部品質稽核。","D"],[82,"單元一：第二章 公共工程管理相關法規概要","下列何者不屬於工程技術顧問公司營業範圍？ (A)土木工程 (B)建築工程 (C)大地工程 (D)環境工程等從事在地面上下新建、增建、改建、修建、拆除構造物與其所屬設備、改變自然環境之行為及其他經主管機關認定工程之技術服務事項，包括規劃與可行性研究、基本設計、細部設計、協辦招標與決標、施工監造、專案管理及其相關技術性服務之公司。","B"],[83,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？ (A)技師之主管機關在中央為行政院公共工程委員會；在直轄市為直轄市政府；在縣(市)為縣(市)政府 (B)技師執行業務所製作之圖樣及書表，應由技師本人簽署，並加蓋技師執業圖記。涉及不同科別技師執業範圍者，應由不同科別技師為之，並分別註明負責之範圍。技師僅得就其本人或在本人監督下完成之工作為簽證 (C)涉及現場作業者，技師應親自赴現場實地查核。技師執行簽證，應提出簽證報告，並將簽證經過確實作成紀錄，連同所有相關資料、文據彙訂為工作底稿 (D)以上皆是。","D"],[84,"單元一：第二章 公共工程管理相關法規概要","下列何者不正確？ (A)公路法公路主管機關：在中央為交通部；在直轄市為直轄市政府；在縣(市)為縣(市)政府; (B)使用公路用地設置管線或其他公共設施時，使用人應填具申請書，並檢附工程計畫書，向公路主管機關申請許可後，始得設置； (C)擅自使用、破壞公路用地或損壞公路設施者，處新臺幣5萬元以上15萬元以下罰鍰； (D)公路工程之設計及監造，在中央公路主管機關指定工程規模以上者，應由依法登記執業之相關專業技師簽證。但公路主管機關自行辦理者，得由機關內依法取得相關專業技師證書者辦理。","C"],[85,"單元一：第二章 公共工程管理相關法規概要","下列何者不正確？ (A)綠建築評估指標系統，包括綠化、基地保水、水資源、日常節能、CO₂減量、廢棄物減量、污水垃圾改善、生物多樣性及室內環境九大指標 (B)申請認可之建築物應至少通過四項指標，且包括「日常節能」及「基地保水」二項門檻指標在內 (C)依綠建築評估手冊所訂定之分級評估方法，評定綠建築等級，依序為合格級、銅級、銀級、黃金級、鑽石級等5級 (D)綠建築標章係指已取得使用執照之建築物、經直轄市、縣(市)政府認定之合法房屋、已完工之特種建築物或社區，經內政部認可符合綠建築評估指標所取得之標章。","B"],[86,"單元一：第二章 公共工程管理相關法規概要","下列何者不正確？ (A)重大公共工程應設置公共藝術，美化環境 (B)供公眾使用之建築物所有人、管理人或使用人，如於其建築物設置公共藝術，美化建築物及環境，且其價值高於該建築物造價百分之一者，應予獎勵 (C)公有建築物應設置公共藝術，美化建築物及環境，且其價值不得少於該建築物造價千分之一 (D)公有建築物及重大公共工程公共藝術設置之事項，依文化藝術獎助條例第9條第5項規定「公共藝術設置辦法」，由主管機關會商行政院公共工程委員會及中央主管建築機關定之。","C"],[87,"單元一：第二章 公共工程管理相關法規概要","下列何者不正確？ (A)建築法所稱建築物，為定著於土地上或地面下具有頂蓋，樑柱或牆壁，供個人或公眾使用之構造物或雜項工作物; (B)建築技術規則暨建築管理規則由直轄市、縣市政府依地方自治法規訂定辦理; (C)依建築法規定，建築物之設計、監造必須由登記開業之建築師為之；其承造人為營造業，以依法登記開業之營造廠商為限; (D)建築工程中必須主管建築機關勘驗部分，應由承造人按照核准圖施工，並經監造人查驗無訛後，由承造人會同監造人依規定按時向主管建築機關申報後，方得繼續施工，主管建築機關得隨時勘驗之。","B"],[88,"單元一：第二章 公共工程管理相關法規概要","政府採購法第70-1條規定機關辦理工程規劃、設計，下列何者錯誤？ (A)應依工程規模，編製安全衛生費用 (B)機關辦理工程採購，應將安全衛生圖說及規範納入招標文件，並量化編列安全衛生費用 (C)於招標文件規定廠商須依職業安全衛生法規，採取必要之預防設備或措施，以確保施工安全 (D)廠商施工場所依法令或契約應有之安全衛生設施欠缺或不良，致發生職業災害者，除應受職業安全衛生相關法令處罰外，機關應依本法及契約規定處置。","A"],[89,"單元一：第二章 公共工程管理相關法規概要","非政府機關接受政府機關補助辦理採購，下列何者敘述有誤？ (A)補助辦理採購金額達半數以上且補助金額達公告金額以上，適用採購法 (B)於接受2個以上機關補助同一採購者，以其補助總金額計算之 (C)有2以上機關補助同一採購者，依指定代表機關或由所占補助金額比率最高者認定之 (D)受補助者於辦理查核金額以上採購開標時，應受補助機關之上級機關監督。","D"],[90,"單元一：第二章 公共工程管理相關法規概要","政府採購法適用範圍包括： (A)政府機關、公立學校、公營事業， (B)非政府機關接受政府機關補助辦理採購，補助金額占採購金額半數以上，且補助金額在公告金額以上， (C)機關委託法人或團體辦理之採購， (D)以上皆屬之。","D"],[91,"單元一：第二章 公共工程管理相關法規概要","關於依物價指數調整工程費之規定，下列敘述何者有誤？ (A)可依營造工程物價指數之個別項目、中分類項目及總指數漲跌幅，分別調整 (B)鋼筋、鋼板、型鋼屬中分類項目之調整 (C)廠商於投標時提出「投標標價不適用招標文件所定物價指數調整條款聲明書」者，廠商標價不適用招標文件所定物價指數調整條款 (D)管理費、利潤等項目不予調整。","B"],[92,"單元一：第二章 公共工程管理相關法規概要","關於同等品之規定，下列敘述何者有誤？ (A)招標文件所列廠牌僅供廠商參考，不得限制廠商必須採用， (B)同等品其功能、效益、標準或特性不可低於招標文件所要求或提及者， (C)同等品價格如較契約所載原要求或提及者為低，依總包價法之精神，無須自契約價金中扣除， (D)同等品價格如較契約所載為高，應以原契約為準，不得加價。","C"],[93,"單元一：第二章 公共工程管理相關法規概要","關於契約成立之規定，下列何者有誤？ (A)機關決標時，代表機關與該投標廠商對於招標文件規定之權利義務關係已經合意，該契約即為成立 (B)書面契約的簽訂，雖招標文件或契約明定契約需經雙方簽署方為有效者，仍以決標日為生效日 (C)廠商依招標文件規定，參與機關招標作業所為之投標行為屬要約 (D)機關依招標文件規定之決標原則決標予得標廠商之決標行為，屬機關對於投標廠商要約所為之承諾。","B"],[94,"單元一：第二章 公共工程管理相關法規概要","關於公共工程職業安全衛生之規定下列敘述何者有誤？ (A)在設計階段應按實際狀況，就可量化與不可量化部份盡量分解細項 (B)機關辦理工程規劃、設計應依工程規模及特性，分析潛在施工危險，編製符合職業安全衛生法規之安全衛生圖說及規範 (C)機關辦理工程採購應於招標文件規定廠商須依職業安全衛生法規，採取必要之預防設備或措施，實施安全衛生管理及訓練 (D)廠商施工場所依法令或契約應有之安全衛生設施欠缺或不良，致發生職業災害者，如已受職業安全衛生相關法令處罰則機關無須再依政府採購法及契約規定處置。","D"],[95,"單元一：第二章 公共工程管理相關法規概要","關於公共工程相關法規之規定，下列敘述何者有誤？ (A)開發單位取得環評開發許可後，逾三年始實施開發行為時，應提出環境現況差異分析及對策檢討報告，送主管機關審查， (B)未依規定擬具水土保持計畫送主管機關核定而擅自開發者，自第一次處罰之日起兩年內，暫停該地之開發申請， (C)剩餘土石方處理計畫報經工程主辦機關備查後，即可進行土方外運作業， (D)促進民間參與公共建設法所稱主管機關，為財政部。","C"],[96,"單元一：第二章 公共工程管理相關法規概要","關於營造業法之相關規定，下列敘述何者正確？ (A)承攬金額新臺幣2,000萬元以上之工程即應置工地主任 (B)營造業之專任工程人員應於查驗工程時到場說明，並於工程查驗文件簽名或蓋章 (C)土木包工業可承攬在登記許可當地或毗鄰地區之所有綜合營繕工程 (D)專業營造業無須設置專任工程人員。","B"],[97,"單元一：第二章 公共工程管理相關法規概要","關於技師執業，下列敘述何者有誤？(A)持有不同科別之技師證書者，得在不同執業機構執行各該科別之技師業務 (B)技師執行業務所製作之圖樣及書表，應由技師本人簽署，並加蓋技師執業圖記 (C)技師受申誡處分三次以上者，應另受停止業務之處分;受停止業務處分累計滿五年者，應廢止其執業執照 (D)涉及不同科別技師執業範圍者，應由不同科別技師為之，並分別註明負責之範圍。","A"],[98,"單元一：第二章 公共工程管理相關法規概要","若建築物為七層且供公眾使用，則有關建築物結構與設備等專業工程部分： (A)應由承辦建築師自行辦理 (B)應由承辦建築師交由依法登記開業之專業技師負責辦理，建築師無須負連帶責任 (C)得由承辦建築師自行辦理，或交由依法登記開業之專業技師負責辦理 (D)應由承辦建築師交由依法登記開業之專業技師負責辦理，建築師並負連帶責任。","D"],[99,"單元一：第二章 公共工程管理相關法規概要","關於共同管道之規定，下列敘述何者有誤？ (A)指設於地面上、下，用於容納一種以上公共設施管線之構造物及其排水、通風、照明、通訊、電力或有關安全監視(測)系統等之各種設施， (B)幹管一般設置於道路中央(分隔島或綠帶)下方，支管及電纜溝多設置於人行道下方， (C)除情形特殊經主管機關核准者外，禁止挖掘共同管道經過之道路， (D)共同管道系統以劃設於道路用地範圍為原則，如因工程之必要，得穿越公、私有土地之上空、地下或附著於建築物、工作物。","A"],[100,"單元一：第二章 公共工程管理相關法規概要","下水道機構因工程上之必要，得在公、私有土地下埋設管渠或其他設備： (A)其土地所有人、占有人或使用人得拒絕， (B)造成其損害之處所及方法無需特別考量，但應支付償金， (C)應擇其損害最少之處所及方法為之，並應支付償金， (D)如對處所及方法之選擇或支付償金有異議時，應報請地方主管機關核定後為之。","C"],[101,"單元一：第二章 公共工程管理相關法規概要","下列何者無須向主管機關申請許可？ (A)依工程契約規定，於基地內進行土方搬運平衡利用時 (B)依水利法規定，需設置穿越水道或水利設施底部之建造物時 (C)依公路法及市區道路條例規定，使用公路用地、挖掘公路或市區道路時 (D)依水利法規定，河川區域內施設、改建、修復或拆除建造物。","A"],[102,"單元一：第二章 公共工程管理相關法規概要","關於綠建築標章之規定，下列敘述何者有誤？ (A)綠建築等級，依序為合格級、銅級、銀級、黃金級、鑽石級等5級， (B)綠建築評估指標系統，包括綠化、基地保水、水資源、日常節能、CO₂減量、廢棄物減量、污水垃圾改善、生物多樣性及室內環境九大指標， (C)工程預算達新臺幣5千萬元以上之公有新建建築工程於申報一樓樓版勘驗時，應同時檢附合格級以上候選綠建築證書， (D)綠建築標章僅限已取得使用執照之建築物才可提出申請。","D"],[103,"單元一：第二章 公共工程管理相關法規概要","關於公有建築物或重大公共工程設置公共藝術之規定，下列敘述何者正確？ (A)公有建築物應設置公共藝術，且其價值不得少於該建築物造價百分之三 (B)公有建築物或政府重大公共工程主體符合公共藝術精神者，經申請審議通過後視為公共藝術，得免另辦理公共藝術設置計畫 (C)興辦機關辦理公共藝術設置計畫，應將該計畫納入公有建築物或政府重大公共工程之統包工程契約之項目及經費之中 (D)公共藝術僅得以平面或立體之藝術品方式呈現。","B"],[104,"單元一：第二章 公共工程管理相關法規概要","關於建築法之規定，下列敘述何者有誤？ (A)建築物非經申請直轄市、縣(市)主管建築機關之審查許可並發給執照，不得擅自建造或使用或拆除 (B)建築物之設計、監造必須由登記開業之建築師為之 (C)建築物之承造人為營造業，以依法登記開業之營造廠商為限 (D)建築物完工後尚未取得使用執照前，即可接水、接電。","D"],[105,"單元一：第二章 公共工程管理相關法規概要","關於政府採購法之規定，下列敘述何者有誤？ (A)非政府機關接受政府機關補助辦理採購，補助金額占採購金額半數以上，且補助金額在公告金額以上者，亦須適用政府採購法 (B)以維護公共利益及公平合理為原則，對廠商不得為無正當理由之差別待遇 (C)政府採購法對於機關辦理工程採購著重品質管理，對職業安全衛生的執行並無相關規定 (D)廠商與機關間關於招標、審標、決標之爭議，得依本法規定提出異議及申訴。機關與廠商間之履約爭議，得向採購申訴審議委員會申請調解。","C"],[106,"單元一：第二章 公共工程管理相關法規概要","機關辦理招標文件公開閱覽，不得少於多少工作天，但以電子化方式辦理者，不得少於5日曆天，末日為假日者順延之？ (A)2工作天 (B)5工作天 (C)6工作天 (D)7工作天。","B"],[107,"單元一：第二章 公共工程管理相關法規概要","有關逾期違約金，何者有誤 (A)為損害賠償額預定性違約金， (B)依契約金額之一定比率扣抵， (C)不得自應付價金或保證金中扣抵， (D)可繳納現金。","C"],[108,"單元一：第二章 公共工程管理相關法規概要","施工中環境保護費及工地安全衛生費，亦為直接工程成本之項目，在規劃階段常無法詳細分解細項，可按直接工程成本之 (A)0.6%至2%， (B)0.3%至2%， (C)0.3%至3%， (D)0.6%至3%編列。在設計階段，應按實際狀況，就可量化與不可量化部分盡量分解細項，並於施工中切實執行。","C"],[109,"單元一：第二章 公共工程管理相關法規概要","促進民間參與公共建設法，所稱主管機關為何？ (A)公共工程委員會 (B)經濟部 (C)公平會 (D)財政部。","D"],[110,"單元一：第二章 公共工程管理相關法規概要","水土保持法主管機關，在中央為(A)交通部 (B)農業部 (C)內政部 (D)經濟部。","B"],[111,"單元一：第二章 公共工程管理相關法規概要","營造業承攬一定金額或一定規模以上之工程，其施工期間，應於工地置工地主任。細則第十八條：本法第三十條所定應置工地主任之工程金額或規模如下：(以下何者為誤？) (A)承攬金額新臺幣5,000萬元以上之工程 (B)建築物高度21公尺以上之工程 (C)建築物地下室開挖10公尺以上之工程 (D)橋樑柱跨距25公尺以上之工程。","B"],[112,"單元一：第二章 公共工程管理相關法規概要","工程主管或主辦機關於勘驗、查驗或驗收工程時，營造業之專任工程人員及工地主任應在現場說明，並由下列哪位人員於勘驗、查驗或驗收文件上簽名或蓋章？ (A)品管人員 (B)工地主任 (C)專任工程人員 (D)監工人員。","C"],[113,"單元一：第二章 公共工程管理相關法規概要","依營造業法規定，營造業不包括？ (A)綜合營造業 (B)專業營造業 (C)土木包工業 (D)特殊營造業。","D"],[114,"單元一：第二章 公共工程管理相關法規概要","有關建築物結構與設備等專業工程部分，除幾層以下非供公眾使用之建築物外，應由承辦建築師交由依法登記開業之專業技師負責辦理，建築師並負連帶責任？ (A)2層 (B)5層 (C)6層 (D)10層。","B"],[115,"單元一：第二章 公共工程管理相關法規概要","共同管道之支管係以容納直接服務沿線地區之供給用管(纜)線為主，可直接或經由電纜溝引至用戶。電纜溝係指僅容納供應沿線用戶之纜線，而直接引至用戶。支管及電纜溝多設置於 (A)人行道下方 (B)慢車道下方 (C)快車道下方 (D)道路中央下方。","A"],[116,"單元一：第二章 公共工程管理相關法規概要","主管機關應酌量歷年水勢，決定設防之水位或日期。由設防日起至撤防日止，為防汛期(依河川管理辦法第18條)防汛期間為每年 (A)1月1日至4月30日止 (B)5月1日至11月30日止 (C)9月1日至12月31日止 (D)以上皆非。","B"],[117,"單元一：第二章 公共工程管理相關法規概要","水利法水為天然資源屬於國家所有，所稱主管機關，在中央為 (A)交通部 (B)工程會 (C)內政部 (D)經濟部。","D"],[118,"單元一：第二章 公共工程管理相關法規概要","市區道路主管機關，在中央為 (A)交通部 (B)工程會 (C)內政部 (D)經濟部。","C"],[119,"單元一：第二章 公共工程管理相關法規概要","綠建築評估指標系統，包括綠化、基地保水、水資源、日常節能、CO₂減量、廢棄物減量、污水垃圾改善、生物多樣性及室內環境9大指標。申請認可之建築物應至少通過4項指標，且包括以下2項門檻指標在內 (A)\"日常節能\"及\"污水垃圾改善\" (B)\"綠化\"及\"水資源\" (C)\"日常節能\"及\"水資源\" (D)\"日常節能\"及\"廢棄物減量\"。","C"],[120,"單元一：第二章 公共工程管理相關法規概要","公有建築物應設置公共藝術，美化建築物及環境，且其價值不得少於該建築物造價之 (A)1% (B)3% (C)4% (D)5%。","A"],[121,"單元一：第二章 公共工程管理相關法規概要","建築物之設計、監造必須由依法登記開業之 (A)結構技師， (B)建築師， (C)營造業之專任工程人員， (D)土木技師。","B"],[122,"單元一：第二章 公共工程管理相關法規概要","主管建築機關，在中央為 (A)內政部 (B)工程會 (C)經建會 (D)經濟部。","A"],[123,"單元一：第二章 公共工程管理相關法規概要","下列何者不是採購法之調解效果？ (A)當事人任一方不同意調解建議，調解不成立， (B)工程採購，經申訴會提出調解建議或調解方案，因機關不同意致調解不成立者，廠商提付仲裁，機關不得拒絕， (C)調解不成立，視同未申請調解， (D)調解經當事人合意而成立。","C"],[124,"單元一：第二章 公共工程管理相關法規概要","下列何種情形符合採購法之規定， (A)轉包， (B)得標廠商將契約全部交由其他廠商代為履行， (C)得標廠商將契約主要部分交由其他廠商代為履行， (D)分包。","D"],[125,"單元一：第二章 公共工程管理相關法規概要","機關辦理以下何者以上採購之開標、比價、議價、決標及驗收時，應於規定期限內，檢附相關文件報請上級機關派員監辦？ (A)小額採購 (B)公告金額 (C)查核金額 (D)巨額。","C"],[126,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？ (A)水土保持之處理與維護，係指應用工程、農藝或植生方法，以保育水土資源，維護自然生態景觀及防治沖蝕、崩塌、地滑、土石流等災害之措施； (B)水土保持之處理與維護之調查、規劃、設計、監造，如涉及農藝或植生方法、措施之工程金額達總計畫之30％以上者，主管機關應要求承辦技師交由具有該特殊專業技術之水土保持技師負責簽證； (C)未依核定之水土保持計畫實施水土保持之處理與維護者，除依第33條規定按次罰鍰外，由主管機關會同目的事業主管機關通知水土保持義務人限期改正; (D)以上皆是。","D"],[127,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？ (A)環境影響評估法係屬程序法 (B)環境影響評估工作包括第一階段、第二階段環境影響評估及審查、追蹤考核等程序 (C)開發單位取得目的事業主管機關核發之開發許可後，逾三年始實施開發行為時，應提出環境現況差異分析及對策檢討報告，送主管機關審查 (D)以上皆是。","D"],[128,"單元一：第二章 公共工程管理相關法規概要","下列何者開發行為對環境有不良影響之虞者，應實施環境影響評估？ (A)道路、鐵路、大眾捷運系統、港灣及機場之開發 (B)農、林、漁、牧地之開發利用 (C)文教、醫療建設之開發 (D)以上皆是。","D"],[129,"單元一：第二章 公共工程管理相關法規概要","下列何者不正確？ (A)環境影響評估報告書初稿，向目的事業主管機關提出; (B)主管機關監督環境影響說明書、評估書及審查結論之執行情形；必要時，得命開發單位定期提出環境影調查報告書； (C)開發單位不遵行目的事業主管機關依環境影響評估法所謂停止開發行為之命令者，處開發單位負責人三年徒刑或拘役，得併科新臺幣二十萬元以下罰金; (D)開發單位於通過環境影響說明書或評估書審查，並取得目的事業主管機關核發之開發許可後，逾3年始實施開發行為時，應提出環境現況差異分析及對策檢討報告，送主管機關審查。","C"],[130,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？ (A)工程技術顧問公司應投保專業責任保險；其投保方式採逐案強制投保 (B)公共工程實施技師簽證，涉及不同科別技師執業範圍者，應由不同科別技師為之，並分別註明各自負責之範圍等 (C)技師執行簽證時，應依技師法第16條規定於所製作之圖樣、書表及簽證報告上簽署，並加蓋技師執業圖記 (D)以上皆是。","D"],[131,"單元一：第二章 公共工程管理相關法規概要","技師下列行為者正確？ (A)容許他人借用本人名義執行業務或招攬業務 (B)執行業務時，違反與業務有關之法令 (C)工地遇緊急異常狀況之通報 (D)技師執行業務所製作之圖樣及書表及現場作業由技師簽署，並加蓋技師執業圖記。","D"],[132,"單元一：第二章 公共工程管理相關法規概要","建築師受委託辦理建築物監造時，應遵守各款之規定下列何者不正確？ (A)監督營造業依照前條設計之圖說施工; (B)遵守建築法令所規定監造人應辦事項； (C)其他約定之監造事項; (D)以上皆非。","D"],[133,"單元一：第二章 公共工程管理相關法規概要","品管人員取得結業證書者，每逾幾年應再取得最近之回訓證明，始得繼續擔任相關工作？ (A)4年 (B)5年 (C)6年 (D)8年。","A"],[134,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？(A)主管機關應酌量歷年水勢，決定設防之水位或日期。由設防日起至撤防日止，為防汛期(B)下水係指排水區域內之雨水、家庭污水及事業廢水(C)地面上、下，用於容納二種以上公共設施管線之構造物及其排水、通風、照明、通訊、電力或有關安全監視(測)系統等之各種設施(D)以上皆是。","D"],[135,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？ (A)市區道路，指都市計畫區域內所有道路 (B)市區道路，指直轄市及市行政區域以內，都市計畫區域以外所有道路 (C)市區道路，指中央主管機關核定人口集居區域內所有道路 (D)以上皆是。","D"],[136,"單元一：第二章 公共工程管理相關法規概要","下列何者正確？ (A)重大公共工程得設置公共藝術，美化環境; (B)供公眾使用之建築物所有人、管理人或使用人，如於其建築物設置公共藝術，美化建築物及環境，且其價值高於該建築物造價百分之二者，應予獎勵； (C)文化藝術事業獎勵、補助之主管機關為文化部; (D)公有建築物及重大公共工程公共藝術設置之事項，依文化藝術獎助條例規定「公共藝術設置辦法」，由主管機關定之。","C"],[137,"單元一：第二章 公共工程管理相關法規概要","為實施建築管理，以維護公共安全、公共交通、公共衛生及增進市容觀瞻，爰訂定建築法有關建築法規定下列何者不正確？ (A)建築法所稱建築物，為定著於土地上或地面下具有頂蓋，樑柱或牆壁，供個人或公眾使用之構造物或雜項工作物; (B)建築管理規則授權由直轄市、縣市政府依地方自治法規訂定辦理; (C)依建築法規定，建築物之設計、監造必須由登記開業之建築師為之；其承造人為營造業，以依法登記開業之營造廠商為限; (D)建築工程中必須主管建築機關勘驗部分，應由監造人按照核准圖施工，並經監造人查驗無訛後，由承造人會同監造人依規定按時向主管建築機關申報後，方得繼續施工，主管建築機關得隨時勘驗之。","D"],[138,"單元一：第二章 公共工程管理相關法規概要","政府採購法第7條： (A)工程係指在地面上下新建、增建、改建、修建、拆除構造物與其所屬設備及改變自然環境之行為 (B)工程包括建築、土木、水利、環境、交通、機械、電氣、化工及其他經主管機關認定之工程以上且補助金額達公告金額以上，適用採購法 (C)為政府機關、公立學校、公營事業(以下簡稱機關)興辦或機關依法核准由民間機構參與或投資興辦之工程以上且補助金額達公告金額以上，適用採購法 (D)以上皆屬之。","D"],[139,"單元一：第二章 公共工程管理相關法規概要","招標文件不得要求或提及特定之商標或商名、專利、設計或型式、特定來源地、生產者或供應者。但無法以精確方式說明招標要求，而已在招標文件內註明諸如「何者」字樣者，不在此限？ (A)或異質品 (B)或同質品 (C)或同等品 (D)以上皆是。","C"],[140,"單元一：第二章 公共工程管理相關法規概要","為避免保險費單獨列項衍生契約雙方就保險費給付之爭議，工程保險費與廠商利潤管理費用得否合併列項？ (A)僅能單獨列項 (B)僅能合併列項 (C)單獨或合併列項均可 (D)以上皆非。","C"],[141,"單元一：第二章 公共工程管理相關法規概要","各機關辦理公共工程規劃設計時，其成果應含職業安全衛生設施之圖說。施工中環境保護費及工地安全衛生費，亦為直接工程成本之項目，在規劃階段常無法詳細分解細項，可按直接工程成本之【多少金額區間】編列。 (A)0.1%-1% (B)0.2%-2% (C)0.3%-3% (D)0.4%-4%。","C"],[142,"單元一：第二章 公共工程管理相關法規概要","依營造業法及施行細則規定，應置工地主任之工程金額或規模，下列何者錯誤？ (A)承攬金額新臺幣1,000萬元以上之工程 (B)建築物高度36公尺以上之工程 (C)建築物地下室開挖10公尺以上之工程 (D)橋樑柱跨距25公尺以上之工程。","A"],[143,"單元一：第二章 公共工程管理相關法規概要","技師不得有下列行為: (A)容許他人借用本人名義執行業務或招攬業務 (B)執行業務時，違反與業務有關之法令 (C)無正當理由，洩漏因業務所知悉或持有他人之秘密 (D)以上皆是。","D"],[144,"單元一：第二章 公共工程管理相關法規概要","建築物結構與設備等專業工程部分，除【哪一種？】建築物外，應由承辦建築師交由依法登記開業之專業技師負責辦理，建築師並負連帶責任。 (A)10層以下非供公眾使用之 (B)10層以下供公眾使用之 (C)5層以下非供公眾使用 (D)5層以下供公眾使用之。","C"],[145,"單元一：第二章 公共工程管理相關法規概要","本法所稱共同管道:指設於地面上、下，用於容納二種以上公共設施管線之構造物及其排水、通風、照明、通訊、電力或有關安全監視(測)系統等之各種設施，請問可分下列哪項？ (A)幹管 (B)支管 (C)電纜溝 (D)以上皆是。","D"],[146,"單元一：第二章 公共工程管理相關法規概要","請問公有新建建築物之總工程建造經費達新臺幣【多少？】元以上者，自101年1月1日起，建築工程於申報一樓樓版勘驗時，應同時檢附合格級以上候選綠建築證書，於工程驗收合格並取得合格級以上綠建築標章後，始得發給結算驗收證明書。 (A)新台幣1000萬 (B)新台幣2000萬 (C)新台幣5000萬 (D)新台幣2億元。","C"],[147,"單元一：第二章 公共工程管理相關法規概要","評定台灣綠建築有五種等級，請問以下哪一種等級為最高級？ (A)合格級 (B)銀級 (C)黃金級 (D)鑽石級。","D"],[148,"單元一：第二章 公共工程管理相關法規概要","申請綠建築認可之建築物應至少通過四項指標，且包括「日常節能」及下列哪一項等二項門檻指標在內？ (A)基地保水 (B)水資源 (C)污水垃圾改善 (D)生物多樣性。","B"],[149,"單元一：第二章 公共工程管理相關法規概要","綠建築評估指標系統EEWH，包括生態、節能、減廢、健康四大面向及九大指標，請問下列何者不是屬於九大指標之一。 (A)綠化 (B)日常節能 (C)NO2增量 (D)生物多樣性。","C"],[150,"單元一：第二章 公共工程管理相關法規概要","綠建築評估指標系統EEWH，包括生態、節能、減廢、健康四大面向及九大指標，請問下列何者不是屬於九大指標之一？ (A)基地保水 (B)水資源 (C)污水垃圾改善 (D)廢棄物增量。","D"],[151,"單元一：第二章 公共工程管理相關法規概要","建築物非經申請地方主管建築機關之審查許可並發給執照，不得擅自建造或使用或拆除。所以建築物非經領得【何種？】執照，不准接水、接電、或申請營業登記及使用。 (A)建造執照 (B)雜項執照 (C)使用執照 (D)拆除執照。","C"],[152,"單元一：第二章 公共工程管理相關法規概要","建築工程中必須主管建築機關勘驗部分，應由承造人按照核准圖施工，並經【誰】查驗無訛後，由承造人會同依規定按時向主管建築機關申報後，方得繼續施工。 (A)起造人 (B)設計人 (C)監造人 (D)使用人。","C"],[153,"單元一：第二章 公共工程管理相關法規概要","建築物之新建、增建、改建及修建，應請領 (A)建造執照 (B)雜項執照 (C)使用執政 (D)拆除執照。","A"],[154,"單元一：第二章 公共工程管理相關法規概要","採購法第70條則規定機關辦理工程採購，應明訂廠商下列責任，並對重點項目訂定檢查程序及檢驗標準。 (A)執行品質管理 (B)環境保護 (C)施工安全衛生 (D)以上皆是。","D"],[155,"單元一：第二章 公共工程管理相關法規概要","政府採購法規定機關辦理採購應以維護以下選項為原則，對廠商不得為無正當理由之差別待遇，以強調政府採購契約之執行過程及履約結果。 (A)公共利益 (B)公平合理 (C)以上皆是 (D)以上皆非。","C"],[156,"單元一：第二章 公共工程管理相關法規概要","依據投標廠商資格與特殊或巨額採購認定標準第8條規定，工程採購金額在下列金額以上者，為巨額採購？ (A)新台幣5000萬 (B)新台幣1億 (C)新台幣2億 (D)新台幣5億元。","C"],[157,"單元一：第二章 公共工程管理相關法規概要","法人或團體接受機關補助辦理採購，其補助金額占採購金額百分之多少以上，且補助金額在公告金額以上者，適用本法之規定，並應受該機關之監督？ (A)20% (B)30% (C)40% (D)50%。","D"],[158,"單元一：第二章 公共工程管理相關法規概要","機關辦理採購，下列何者可不需適用採購法之規定。 (A)政府機關 (B)公立學校 (C)私立學校 (D)公營事業。","C"],[159,"單元一：第二章 公共工程管理相關法規概要","下列有關採購法解除契約之規定，何者屬於意定解除權？ (A)第50條第2項「決標或簽約後發現得標廠商於決標前有第一項情形者，應撤銷決標、終止契約或解除契約，並得追償損失」 (B)第59條第2項「違反前項規定者，機關得終止或解除契約」 (C)第64條「採購契約得訂明因政策變更，廠商依契約繼續履行反而不符公共利益者，機關得報經上級機關核准，終止或解除部分或全部契約」 (D)第66條第1項「得標廠商違反前條規定轉包其他廠商時，機關得解除契約、終止契約或沒收保證金，並得要求損害賠償」。","C"],[160,"單元一：第二章 公共工程管理相關法規概要","有關違約金規定，下列何者敘述錯誤？ (A)違約金者，以確保契約履行為目的， (B)違約金標的限於金錢， (C)品質缺失懲罰性違約金之性質屬於損害賠償總額預定性違約金， (D)逾期違約金之性質屬於損害賠償總額預定性違約金。","C"],[161,"單元一：第二章 公共工程管理相關法規概要","就政府採購契約而言，其屬債權契約性質，當機關審查廠商之投標文件，並依招標文件規定之決標原則決標予得標廠商之決標行為，屬於： (A)要約， (B)要約之引誘， (C)要約之承諾， (D)以上皆非。","C"],[162,"單元一：第二章 公共工程管理相關法規概要","就政府採購契約而言，其屬債權契約性質，當廠商依機關招標文件規定，參與機關招標作業所為之投標行為，屬於下列何者？ (A)要約 (B)要約之引誘 (C)要約之承諾 (D)以上皆非。","A"],[163,"單元一：第二章 公共工程管理相關法規概要","就政府採購契約而言，其屬債權契約性質，當機關辦理招標作業，發出招標公告或邀標通知，屬於： (A)要約， (B)要約之引誘， (C)要約之承諾， (D)以上皆非。","B"],[164,"單元一：第二章 公共工程管理相關法規概要","依政府採購法第70條之1規定，機關辦理工程規劃、設計，應依工程規模及特性，量化編列安全衛生費用，惟實務上在規劃階段常無法詳細分解細項，並按直接工程成本之百分比編列，其百分比為多少？ (A)0.6%至2% (B)0.3%至3% (C)0.3%至5% (D)0.5%至5%。","B"],[165,"單元一：第二章 公共工程管理相關法規概要","依水土保持法規定，水土保持之處理與維護在中央主管機關指定規模以上者，應由依法登記執業之相關專業技師或聘有該等相關專業技師之工程顧問機構規劃、設計及監造，其中所敘相關專業技師不包括下列何者？ (A)土木工程技師 (B)水利工程技師 (C)大地工程技師 (D)結構工程技師。","D"],[166,"單元一：第二章 公共工程管理相關法規概要","依水土保持法規定，水土保持之處理與維護之調查、規劃、設計、監造，如涉及農藝或植生方法、措施之工程金額達總計畫之多少百分比以上者，主管機關應要求承辦技師交由具有該特殊專業技術之水土保持技師負責簽證？ (A)20％， (B)30％， (C)40％， (D)50％。","B"],[167,"單元一：第二章 公共工程管理相關法規概要","依營造業法施行細則第18條規定，應置工地主任之工程金額或規模，下列何者敘述正確？ (A)承攬金額新臺幣500萬元以上之工程， (B)建築物高度30公尺以上之工程， (C)建築物地下室開挖10公尺以上之工程， (D)橋樑柱跨距20公尺以上之工程。","C"],[168,"單元一：第二章 公共工程管理相關法規概要","依營造業法施行細則第18條規定，應置工地主任之工程金額或規模，下列何者錯誤？ (A)承攬金額新臺幣5,000萬元以上之工程 (B)建築物高度30m以上之工程 (C)建築物地下室開挖10m以上之工程 (D)橋樑柱跨距25m以上之工程。","B"],[169,"單元一：第二章 公共工程管理相關法規概要","依營造業法規定，下列何者應於查驗工程時到場說明，並於工程查驗文件簽名或蓋章？ (A)營造業負責人 (B)專任工程人員 (C)工地主任 (D)技術士。","B"],[170,"單元一：第二章 公共工程管理相關法規概要","依河川管理辦法第18條規定，防汎期間為每年： (A)4月1日至10月31日， (B)5月1日至10月31日， (C)4月1日至11月30日， (D)5月1日至11月30日。","D"],[171,"單元一：第二章 公共工程管理相關法規概要","依「公有智慧綠建築實施方針與實施日期」規定，公有新建建築物之總工程建造經費達新臺幣5,000萬元以上者，自101年1月1日起，建築工程於下列何者時機，應同時檢附合格級以上候選綠建築證書？ (A)申領建造執照時， (B)申報開工時， (C)申報一樓樓版勘驗時， (D)以上皆非。","C"],[172,"單元一：第二章 公共工程管理相關法規概要","依「公有智慧綠建築實施方針與實施日期」規定，公有新建建築物之總工程建造經費達新臺幣5,000萬元以上者，自101年1月1日起，建築工程於申報一樓樓版勘驗時，應同時檢附何種等級以上候選綠建築證書？ (A)合格級， (B)銅級， (C)銀級， (D)黃金級。","A"],[173,"單元一：第二章 公共工程管理相關法規概要","申請綠建築認可之建築物應至少通過綠建築評估指標系統四項指標，其中並應包含那二項門檻指標？ (A)「綠化」及「水資源」， (B)「日常節能」及「水資源」， (C)「綠化」及「日常節能」， (D)「綠化」及「室內環境」。","B"],[174,"單元一：第二章 公共工程管理相關法規概要","依政府採購法規定，以下有關履約爭議之處理，何者錯誤？ (A)得向採購申訴審議委員會申請調解，或向仲裁機構提付仲裁， (B)其屬廠商申請調解者，機關不得拒絕， (C)工程及財物採購之調解，採購申訴審議委員會應提出調解建議或調解方案， (D)機關不同意調解建議者，應先報請上級機關核定，並以書面向採購申訴審議委員會及廠商說明理由。","C"],[175,"單元一：第三章 公共工程履約管理","下列敘述段何者正確？依政府採購法第73-1條，機關辦理工程採購之付款及審核程序，應依下列規定辦理： (A)定期估驗或分階段付款者，機關應於廠商提出估驗或階段完成之證明文件後10日內完成審核程序 (B)於接到廠商提出之請款單據後10日內付款 (C)驗收付款者，機關應於驗收合格後，填具結算驗收證明文件，並於接到廠商請款單據後15日內付款 (D)屬於應向上級機關申請核撥補助款之案件，各類期限可增加為20日。","C"],[176,"單元一：第三章 公共工程履約管理","新臺幣1千萬元以上未達5千萬元之工程品質計畫內容除機關及監造單位另有規定外，不包括： (A)計畫範圍、管理權責及分工 (B)品質管理標準 (C)材料及施工檢驗程序及自主檢查表 (D)品質稽核、文件紀錄管理系統等。","D"],[177,"單元一：第三章 公共工程履約管理","新臺幣5千萬元以上工程之監造計畫其內容除機關另有規定外，不包括 (A)監造範圍、監造組織及權責分工 (B)品質計畫審查作業程序、施工計畫審查作業程序 (C)材料及施工檢驗程序、自主檢查表 (D)品質稽核、文件紀錄管理系統等。","C"],[178,"單元一：第三章 公共工程履約管理","採購申訴審議委員會調解後，當事人不能合意，但已甚接近者，採購申訴審議委員會應斟酌一切情形，並徵詢調解委員之意見，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，以職權提出下列何者？ (A)調解裁定 (B)調解判決 (C)調解方案 (D)調解建議。","C"],[179,"單元一：第三章 公共工程履約管理","請挑出下列敘述錯誤？ (A)工程自驗收合格之日起，由廠商負責保固，其保固期限依契約規定辦理 (B)凡保固期內之任何毀壞、損壞、故障，應由廠商於機關指定之期限內負責免費無條件改正 (C)逾期不為改正者，機關得逕為處理，所需費用，由廠商負擔，或動用保固保證金逕為處理，不足時向廠商追償 (D)廠商於驗收後不履行保固責任，情節重大者，應將其事實、理由及拒絕往來期限通知廠商，並附記如未提出異議者，將刊登政府採購公報。","B"],[180,"單元一：第三章 公共工程履約管理","機關辦理採購，得於招標文件中規定優良廠商應繳納之押標金、履約保證金或保固保證金金額得予減收，其額度以不逾原定應繳總額之 (A)25% (B)50% (C)75% (D)60%為上限。繳納後方為優良廠商者，不溯及適用減收規定；減收後獎勵期間屆滿者，免補繳減收之金額。","B"],[181,"單元一：第三章 公共工程履約管理","下列何者錯誤？同等品定義係指經機關審查認定其 (A)功能 (B)效益 (C)標準 (D)價格不低於招標文件所要求或提及者並得予以檢驗或測試。","D"],[182,"單元一：第三章 公共工程履約管理","訂定材料標準時，下列何種方式正確？ (A)應選用與材料標準相同來源的測試標準(如CNS) (B)多增加非材料標準所規定的測試標準 (C)多引用ASTM、DIN或JIS的測試標準 (D)設定某種特殊規格試驗。","A"],[183,"單元一：第三章 公共工程履約管理","營造業法第30條規定營造業承攬一定金額或一定規模以上之工程，其施工期間，應於工地置工地主任，其一定金額規定為: (A)100萬 (B)2000萬 (C)5000萬 (D)2億。","C"],[184,"單元一：第三章 公共工程履約管理","下列哪項屬於營造業之專任工程人員應負責辦理之工作？ (A)實施技師簽證 (B)於施工日報表簽署 (C)施工操作或品質控管 (D)查核施工計畫書，並於認可後簽名或蓋章。","D"],[185,"單元一：第三章 公共工程履約管理","下列敘述何者有誤？ (A)公共工程實施技師簽證，涉及不同科別技師執業範圍者，應由不同科別技師為之 (B)關聯二以上科別技師執業範圍之介面部分，得標廠商應指定一技師負責整合，應由整合之技師簽證負責 (C)技師執行簽證時，應依法規定於所製作之圖樣、書表及簽證報告上簽署，並加蓋技師執業圖記 (D)技師簽證規則之主管機關為工程會。","B"],[186,"單元一：第三章 公共工程履約管理","依水利法及相關法令規定，下列敘述何者錯誤： (A)河川管理辦法訂有防汎期間為每年５月１日至１１月３０日 (B)防汛緊急時，主管機關為緊急處置，得就地徵用關於搶護必需之物料、人工、土地，拆毀防礙水流之障礙物，得不予補償 (C)水利法規之中央主管機關為經濟部 (D)水為天然資源屬於國家所有，不因人民取得土地所有權而受影響。","B"],[187,"單元一：第三章 公共工程履約管理","市區道路之修築、改善、養護、使用、管理及經費籌措係依循道市區道路條例規範，本條例未規定者，適用其他法律。市區道路條例之中央主管機關為 (A)行政院公共工程委員會 (B)內政部 (C)交通部 (D)財政部。","B"],[188,"單元一：第三章 公共工程履約管理","綠建築評估指標系統，包括綠化、基地保水、水資源、日常節能、CO2減量、廢棄物減量、污水垃圾改善、生物多樣性及室內環境九大指標。申請認可之建築物應至少通過四項指標，其中哪兩項指標一定要有？ (A)日常節能、CO2減量 (B)CO2減量、廢棄物減量 (C)廢棄物減量、污水垃圾改善 (D)日常節能及水資源。","D"],[189,"單元一：第三章 公共工程履約管理","為實施建築管理，以維護公共安全、公共交通、公共衛生及增進市容觀瞻，爰訂定建築法。本法令之中央主管建築機關為 (A)行政院公共工程委員會 (B)內政部 (C)交通部 (D)行政院環保署。","B"],[190,"單元一：第三章 公共工程履約管理","投標廠商資格與特殊或巨額採購認定標準中，採購金額在下列金額以上者，為巨額採購，下列何者錯誤？ (A)工程採購：新台幣2億元 (B)財物採購：新台幣1億元 (C)設備採購：新台幣5,000萬元 (D)勞務採購：新台幣2,000萬元。","C"],[191,"單元一：第三章 公共工程履約管理","政府採購法第70條則規定機關辦理工程採購，應明訂廠商執行品質管理、環境保護、施工安全衛生之責任，並對重點項目訂定？ (A)檢查程序及檢驗標準 (B)管理責任 (C)稽核制度 (D)施工綱要。","A"],[192,"單元一：第三章 公共工程履約管理","政府採購法立法宗旨為建立政府採購制度，依公平、公開之採購程序，提升採購效率與功能，確保採購品質。本法所稱主管機關為？ (A)行政院公共工程委員會 (B)內政部 (C)法務部 (D)司法院。","A"],[193,"單元一：第三章 公共工程履約管理","有關履約管理事項，下列何者為非？ (A)契約價金得採部分依契約價金總額結算，部分依實際施作或供應之項目及數量結算 (B)品質缺失依個案瑕疵情形而定，懲罰性違約金之總額無上限 (C)預付款之扣回方式，應自估驗金額達契約價金總額20%起至80%止，隨估驗計價逐期依計價比例扣回 (D)品質缺失懲罰性違約金之總額，以契約價金總額之20%為上限。","B"],[194,"單元一：第三章 公共工程履約管理","有關履約管理事項，下列何者為非？ (A)因天候影響或不可抗力事故，致影響要徑作業時，得申請展延工期， (B)因契約變更追加價金或展延工期時，營造綜合保險單之保險金額應增加，保險期間應比照順延， (C)依施工階段契約約定權責分工表約定，施工日誌應報業主核定， (D)營造綜合保險單應以機關及其技術服務廠商、施工廠商及全部分包廠商為共同被保險人。","C"],[195,"單元一：第三章 公共工程履約管理","有關減價收受辦理原則，下列何者正確？ (A)工程採購不論金額大小，減價收受報經機關首長或其授權人員核准後為之 (B)查核金額以上之採購，減價收受應先報經上級機關核准 (C)個別項目之減價金額及違約金之合計，不受限制 (D)竣工確認時如發現與圖說、規定不符，無須待正式驗收即可辦理減價收受作業。","B"],[196,"單元一：第三章 公共工程履約管理","有關驗收作業，下列何者為非？ (A)工程、財物或勞務採購之驗收，廠商未派員機關仍得為之 (B)營造業之專任工程人員及工地主任未在現場說明者，機關應不予驗收 (C)機關如有部分先行使用之必要者，應先就該部分辦理驗收，並得就該部分支付價金 (D)驗收合格後，機關應依「公共工程施工廠商履約情形計分要點」於完成驗收後，將完整之計分事實資料填報於工程會「公共工程標案管理系統」，並辦理計分作業。","A"],[197,"單元一：第三章 公共工程履約管理","依工程採購契約範本約定，契約價金採總額結算者，下列敘述何者為非？ (A)工程之個別項目實作數量較契約所定數量增減達3%以上時，其逾3%之部分，依原契約單價以契約變更增減契約價金 (B)工程之個別項目實作數量較契約所定數量增加達30%以上時，其逾30%之部分，應以契約變更合理調整契約單價及計算契約價金 (C)工程之個別項目實作數量較契約所定數量增減未達3%者，契約價金不予增減 (D)經確認屬漏列項目，仍應由廠商負責供應或施作，不得據以請求加價。","D"],[198,"單元一：第三章 公共工程履約管理","有關剩餘土石方之處理，下列何者為非？ (A)工程設計階段，機關應責成規劃設計單位符合工程挖填土石方之平衡原則， (B)工程出土期間應依「營建剩餘土石方處理方案」規定辦理紙本流向證明文件簽發、網路申報勾稽及查核作業， (C)營建剩餘土石方之處理屬廠商自主管理事項，無須提報處理計畫， (D)剩餘土石方處理計畫，由廠商負責人、專任工程人員、工地負責人會同簽章後，報機關(建築工程應含主管建築機關)據以核發剩餘土石方流向證明文件。","C"],[199,"單元一：第三章 公共工程履約管理","下列何者非屬辦理變更契約應注意之事項？ (A)決標簽約後，漏列項目及數量均應由廠商自行負擔， (B)契約原有項目，因機關要求契約變更，如變更之部分，其價格或施工條件改變，得就該等變更部分另行議價， (C)新增工程項目單價編列方式，應以原預算相關單價分析資料為基礎，並考慮市場價格波動情形， (D)於機關接受其所提出須變更之相關文件前，廠商不得自行變更契約。","A"],[200,"單元一：第三章 公共工程履約管理","下列何者非屬廠商得要求變更契約之情形？ (A)契約原標示之廠牌或型號不再製造或供應， (B)契約所定技術規格違反採購法第26條規定， (C)契約原標示之廠牌或型號，契約價金與市場行情明顯差異者， (D)較契約原標示者更優或對機關更有利。","C"],[201,"單元一：第三章 公共工程履約管理","有關估驗計價作業，下列何者為非？ (A)每期估驗款應扣除之保留款額度，得由機關依個案特性或實際需要決定 (B)每期估驗款應依契約約定扣除5%保留款 (C)如因可歸責於廠商之事由，而有施工查核結果列為丙等、發生重大勞安或環保事故之情形，機關得將估驗計價保留款提高為原規定之2倍 (D)依採購法第73-1條規定，定期估驗或分階段付款者，廠商提出估驗證明文件後，機關應於15日內完成審核程序，並於接到廠商提出之請款單據後，15日內付款。","A"],[202,"單元一：第三章 公共工程履約管理","有關工程材料設備之檢驗或抽驗事宜，下列何者為非？ (A)材料設備屬正字標記產品者，得免辦理材料設備送審之「出廠檢驗」 (B)產品檢驗報告書，實驗室應印有國家標準(CNS)之認可標誌 (C)機關就廠商履約標的為查驗、測試或檢驗之權利，應不受該標的曾通過其他查驗、測試或檢驗之限制 (D)契約規定以外之查驗、測試或檢驗，其結果符合者，由機關負擔費用。","B"],[203,"單元一：第三章 公共工程履約管理","履約期間，機關對廠商履約瑕疵得採行之措施，下列何者為非？ (A)自行或使第三人改正，並得向廠商請求償還改正必要之費用 (B)得依契約約定暫停發放估驗款 (C)擅自減省工料情節重大者，應依採購法第101條至第103條規定處理 (D)留待辦理初驗或驗收時再全部一併限期改善。","D"],[204,"單元一：第三章 公共工程履約管理","廠商延誤履約進度之處理，下列何者非屬機關得採行之措施？ (A)要求廠商提趕工計畫 (B)如施工進度已達百分之50%以上，機關得評估同意廠商及分包廠商共同申請採監督付款方式，由分包廠商繼續施工 (C)契約訂有連帶保證廠商責任規定者，機關得評估由連帶保證廠商接辦 (D)終止或解除契約重新招標。","B"],[205,"單元一：第三章 公共工程履約管理","有關進度管理，下列何者為非？ (A)履約期間若因天候影響無法施工，廠商應於辦理結算作業時，檢具事證以書面向機關申請不計工期 (B)開工前依規劃之施工步驟繪製施工預定進度網圖及要徑作業，以為管控基準 (C)履約期間若因天候影響無法施工，廠商應於事故發生或消滅後7日內通知機關，並於45日內檢具事證，以書面向機關申請展延工期 (D)進度落後達一定程度，且經通知限期改善後未積極改善者，機關得暫停核發估驗計價款。","A"],[206,"單元一：第三章 公共工程履約管理","有關建造執照或雜項執照，下列何者為非？ (A)起造人自接獲通知領取建造執照或雜項執照之日起，應於三個月內領照 (B)起造人自領得建造執照或雜項執照之日起，應於一年內開工 (C)起造人自領得建造執照或雜項執照之日起，應於六個月內開工 (D)起造人因故不能於期限內開工時，應敘明原因，申請展期一次，期限為三個月。","B"],[207,"單元一：第三章 公共工程履約管理","下列何者非屬開工前之準備作業？ (A)廠商須提報整體施工計畫及整體品質計畫 (B)公有新建建築物建造經費達新臺幣5,000萬元以上者，應申請綠建築標章 (C)廠商辦理營造綜合保險 (D)提報剩餘土石方處理計畫。","B"],[208,"單元一：第三章 公共工程履約管理","有關履約保證金規定，下列何者正確？ (A)履約保證金之發還，不得以履約進度、驗收、維修或保固期間等條件，一次或分次發還 (B)履約保證金之額度如係一定比率，以不逾契約金額之10%為原則 (C)履約保證金之額度如係一定比率，以不逾契約金額之20%為原則 (D)同一廠商同時作為各機關採購契約之連帶保證廠商者，以契約為限。","B"],[209,"單元一：第三章 公共工程履約管理","下列敘述何者正確： (A)契約變更以機關公文通知即為有效; (B)廠商履約結果涉及智慧財產權者，機關應取得全部權利; (C)機關對於廠商及其人員因履約所致之人體傷亡或財物損失，不負賠償責任; (D)機關應就廠商向保險人索賠所費時間給予延長履約期限。","C"],[210,"單元一：第三章 公共工程履約管理","下列有關契約之規定何者不正確？ (A)工程未經完成驗收前，所有已完成之工程及到場之材料、機具、設備，包括機關供給及廠商自備者，均由廠商依契約規定負責保管; (B)工程自驗收合格之日起，由廠商負責保固，保固期內發現瑕疵，應由廠商於機關指定之期限內負責免費無條件改正; (C)保固期內發現瑕疵，廠商逾期不為改正者，機關得逕為處理，所需費用，由廠商負擔，或動用保固保證金逕為處理，不足時向廠商追償; (D)機關對於廠商及其人員因履約所致之人體傷亡或財物損失，負賠償責任。","D"],[211,"單元一：第三章 公共工程履約管理","下列各項情形發生時主張機關應賠償承攬人之損害賠償是不正確？ (A)因政策變更，廠商依契約繼續履行反而不符公共利益者，機關得終止或解除部分或全部契約 (B)因可歸責於廠商之事由依契約規定終止或解除契約者，機關宜賠償承攬人 (C)因可歸責於機關得依契約終止或解除部分或全部契約，機關應賠償承攬人因契約終止或解除而生之損害 (D)工作未完成前，定作人得隨時終止契約。","B"],[212,"單元一：第三章 公共工程履約管理","下列何者為非？ (A)工程保證包括履約保證、差額保證、預付款還款保證、保固保證等 (B)保證金應由廠商以現金、金融機構簽發之本票或支票、保付支票、郵政匯票、無記名政府公債、設定質權之金融機構定期存款單、銀行開發或保兌之不可撤銷擔保信用狀繳納，或取具銀行之書面連帶保證、保險公司之連帶保證保險單為之 (C)招標文件中規定，同一廠商同時作為各機關採購契約之連帶保證廠商者，以二契約為限 (D)招標文件中規定優良廠商應繳納之押標金、履約保證金或保固保證金金額得予減收，其額度以不逾原定應繳總額之50%以內為限;繳納後方為優良廠商者，溯及適用減收規定。","D"],[213,"單元一：第三章 公共工程履約管理","下列何者不正確？ (A)機關業於招標文件標示屬於主要部分或應由得標廠商自行履行之部分，得標廠商不得轉包 (B)發現得標廠商將招標文件標示屬於主要部分或應由得標廠商自行履行之部分交其他廠商執行者，機關得依採購法第66條及契約規定解除契約、終止契約或沒收保證金，並得要求損害賠償 (C)其經發現者，逕依政府採購法第103條規定刊登政府採購公報辦理不良廠商停權公告 (D)招標文件標示或依其他法規規定應由得標廠商自行履行之部分，得標廠商不得轉包。","C"],[214,"單元一：第三章 公共工程履約管理","下列何者錯誤？ (A)工程主管或主辦機關於勘驗、查驗或驗收工程時，營造業之工地主任得在現場說明，並視工程規模於工程查驗文件簽名或蓋章 (B)民法規定承攬人因執行承攬事項，不法侵害他人之權利者，定作人不負損害賠償責任。但定作人於定作或指示有過失者，不在此限 (C)廠商應對其工地作業及施工方法之適當性、可靠性及安全性負完全責任 (D)專任工程人員依營造業法第35條規定，督察按圖施工、解決施工技術問題等。","A"],[215,"單元一：第三章 公共工程履約管理","技術顧問公司承接技術業務，應依規定交由相關科別執業技師負責辦理，下列何者錯誤？ (A)技師執行簽證，應親自為之，並僅得就本人或在本人監督下完成之工作為簽證 (B)涉及現場作業者，技師應親自赴現場實地查核後，始得為之 (C)技師執行簽證時，應於所製作之圖樣、書表及簽證報告上簽署，並加蓋技師執業圖記。建築師受委託辦理建築物之設計，應負該工程設計之責任 (D)受委託監造者，應負該工程施工之責任，有關建築物結構與設備等專業工程部分，交由建築師負責辦理。","D"],[216,"單元一：第三章 公共工程履約管理","刊登於政府採購公報受停權處分之廠商，在停權期間內，下列敘述何者正確？ (A)不得參加投標 (B)不得作為決標對象或分包廠商 (C)不得作為採購契約之連帶保證廠商 (D)以上皆是。","D"],[217,"單元一：第三章 公共工程履約管理","下列何者錯誤？ (A)機關通知廠商變更契約，廠商於機關接受其所提出須變更之相關文件前，不得自行變更契約； (B)機關於接受廠商所提出須變更之事項前即請求廠商先行施作，其後如未依原通知辦理契約變更者，應補償廠商所增加之必要費用； (C)各類採購契約以採用主管機關訂定之範本為原則，其要項及內容由主管機關參考國際及國內慣例定之； (D)機關以正式公文通知廠商變更契約，縱廠商表示反對，契約變更仍生效力。","D"],[218,"單元一：第三章 公共工程履約管理","下列何者非公共工程履約管理的範疇？ (A)風險管理， (B)履約爭議， (C)營運管理， (D)界面整合。","C"],[219,"單元一：第三章 公共工程履約管理","關於工程結算規定，下列何者有誤？ (A)工程之個別項目實作數量較契約所定數量增加達30%以上時，其逾30%之部分，應以契約變更合理調整契約單價及計算契約價金 (B)統包工程契約之結算，契約價金詳細表，如有變更，經雙方同意者，得於契約總價不變下調整流用 (C)機關應於驗收完畢後30日內填具驗收證明書，但有特殊情形必須延期，須經機關首長或其授權人員核准 (D)經得標廠商同意於第3頁填列分包部分資料者，該結算驗收證明書並同時副知該等分包廠商，且不影響得標廠商依政府採購法令規定參與政府工程採購投標之經驗或實績。","C"],[220,"單元一：第三章 公共工程履約管理","關於工程驗收之規定，下列何者有誤？ (A)無初驗程序者，除契約另有規定者外，機關應於接獲廠商通知備驗或可得驗收之程序完成後30日內辦理驗收，並作成驗收紀錄 (B)有初驗程序者，初驗合格後，除契約另有規定者外，機關應於30日內辦理驗收，並作成驗收紀錄 (C)機關應依「公共工程施工廠商履約情形計分要點」於工程驗收完成後15日內，將完整之計分事實資料填報於工程會「公共工程標案管理系統」，並辦理計分作業 (D)工程部分竣工後，如有部分先行使用之必要或已履約之部分有減損滅失之虞者，應先就該部分辦理驗收或分段查驗供驗收之用。","B"],[221,"單元一：第三章 公共工程履約管理","關於工程竣工、驗收之規定，下列何者有誤？ (A)機關應於收到廠商竣工日期書面通知之日起7日內會同監造單位及廠商，確定是否竣工， (B)除契約另有規定者外，監造單位應於竣工後7日內，將竣工圖表、工程結算明細表及契約規定之其他資料，送請機關審核， (C)有初驗程序者，機關應於收受全部資料之日起30日內辦理初驗，並作成初驗紀錄， (D)有初驗程序者，初驗合格後，除契約另有規定者外，機關應於30日內辦理驗收，並作成驗收紀錄。","D"],[222,"單元一：第三章 公共工程履約管理","關於品質缺失懲罰性違約金之規定，下列何者有誤？ (A)依查核小組查核之品質缺失扣點數，巨額工程施工廠商每點罰8000元 (B)依查核小組查核之品質缺失扣點數，新臺幣1,000萬元以上未達查核金額之工程每點罰2,000元 (C)查核成績為丙等且可歸責於廠商者，其品質缺失懲罰性違約金金額，另需加計該工程品管費用之10%(招標時契約未載明者) (D)依查核小組查核之品質缺失扣點數，查核金額以上未達巨額之工程每點罰4,000元。","C"],[223,"單元一：第三章 公共工程履約管理","關於公共工程施工期間之職業安全衛生規定，下列何者有誤？ (A)安全衛生設施應予以量化並據以估驗計價 (B)屬丁類營造工地危險性工作場所者，應向工程主辦機關申請審查合格後方可作業 (C)工程開工前，廠商向機關報備工作場所人員名單(含分包廠商員工)，並提報該等人員之勞工保險資料及依職業安全衛生法規應完成之安全衛生教育訓練紀錄送機關備查，方可使勞工進場 (D)施工廠商應於施工計畫(或安全生管理計畫)之施工程序明定安全衛生查驗點。","B"],[224,"單元一：第三章 公共工程履約管理","關於設計變更之規定，下列何者正確？ (A)新增工作中如包括原有契約項目，廠商即應依原單價施作，不得要求議價 (B)設計變更工期之核計，可將原工期按變更設計增加金額與原契約金額之比例，等比例增加，無須考量是否屬要徑 (C)經契約雙方確定之設計變更新增工程項目，未經議價程序議定單價者，不得辦理估驗計價 (D)設計變更在未完成議價程序前，機關得於設計變更方案核定後，協調廠商先行施工。","D"],[225,"單元一：第三章 公共工程履約管理","依政府採購法第73-1條機關辦理工程採購之付款及審核程序之規定，下列何者有誤？ (A)機關應於廠商提出估驗或階段完成之證明文件後，15日內完成審核程序 (B)依規定期限完成審核程序，於接到廠商提出之請款單據後，15日內付款 (C)應向上級機關申請核撥補助款者，付款期限為45日 (D)上開日數日數係指實際工作日，不包括例假日、特定假日及退請受款人補正之日數。","C"],[226,"單元一：第三章 公共工程履約管理","有關應由技師本人簽署並加蓋技師執業圖記之圖樣、書表及技師簽署方式，下列何者有誤？ (A)細部設計圖應逐頁簽署並加蓋技師執業圖記 (B)工程預算書應逐頁簽署並加蓋技師執業圖記 (C)測量、地質調查及其他補充調查或勘測報告應於封面或內容首頁簽署並加蓋技師執業圖記 (D)施工廠商之品質計畫於相關審查意見表(單)簽署並加蓋技師執業圖記。","B"],[227,"單元一：第三章 公共工程履約管理","關於施工品管之規定，下列何者有誤？ (A)招標文件應明訂廠商於開工前將重要施工項目，由廠商專任工程人員負責指導施工人員相關作業程序並於工地現場製作樣品 (B)廠商應由品管人員按各類自主檢查表，執行第一層級品管，並於檢查完畢後當場簽名 (C)屬機關或監造單位指定之重要施工項目、隱蔽部分之施工項目或檢驗停留點，應報經監造單位核備或抽(查)驗合格後，始得進行次一階段之施工項目 (D)品管人員對品質缺失探討原因採取矯正與預防措施，除追蹤缺失之限期改善外，並回饋至制度面，防止缺失重複發生。","B"],[228,"單元一：第三章 公共工程履約管理","關於三級品管之規定，下列何者有誤？ (A)施工廠商之自主檢查屬一級品管 (B)監造單位之抽(查)驗屬二級品管 (C)主辦機關之上級機關設置工程督導小組辦理工程督導，屬三級品管 (D)主管機關設置施工查核小組辦理品質查核，屬三級品管。","C"],[229,"單元一：第三章 公共工程履約管理","關於監造計畫及品質計畫之規定，下列何者有誤？ (A)品質計畫應於開工前核定，提供監造單位作為編製監造計畫依據， (B)監造計畫及品質計畫的內容項目，依採購金額級距不同，有不同的規定， (C)分項品質計畫之內容，除機關及監造單位另有規定外，應包括施工要領、品質管理標準、材料及施工檢驗程序、自主檢查表等項目， (D)工程具機電設備者，品質計畫應增訂設備功能運轉檢測程序及標準。","A"],[230,"單元一：第三章 公共工程履約管理","有關廠商延誤履約進度之處理方式，下列何者有誤？ (A)如因可歸責於廠商之事由，致進度落後達一定程度，且經通知限期改善後未積極改善者，機關得依契約約定暫停核發估驗計價款， (B)如廠商依提報趕工計畫實施後，其進度落後情形經機關認定已有改善者，機關得恢復核發估驗計價款， (C)機關通知連帶保證廠商履約時，得考量公共利益及連帶保證廠商申請之動員進場施工時間，重新核定工期， (D)如施工進度已達百分之七十五以上，機關得經評估後，同意廠商及分包廠商共同申請採監督付款方式，由分包廠商繼續施工。","B"],[231,"單元一：第三章 公共工程履約管理","關於履約期間之計算，下列何者有誤？ (A)以限期完成者，星期例假日、國定假日或其他休息日均應計入， (B)以日曆天計者，星期例假日、國定假日或其他休息日均應計入， (C)以日曆天計者，星期例假日、國定假日或其他休息日，是否計入，應於契約中明定， (D)以工作天計者。星期例假日、國定假日或其他休息日，均應不計入。","B"],[232,"單元一：第三章 公共工程履約管理","關於開工前準備事項，下列何者有誤？ (A)由機關邀集(專案管理單位)、規劃、設計、監造單位、廠商召開施工前說明會 (B)機關應要求監造單位及廠商依契約及核定之送審文件管制一覽表的期限提送監造計畫、整體施工計畫、品質計畫、各項保證金、工程保險等相關文件 (C)機關通知廠商於契約約定限期內申報開工，申報開工時廠商應提出「開工報告書」 (D)屬建築工程者，起造人自領得建造執照或雜項執照之日起，應於一年內開工。","D"],[233,"單元一：第三章 公共工程履約管理","下列何者非屬履約爭議之處理方式？ (A)向採購申訴審議委員會提出申訴 (B)向鄉、鎮、市公所所設調解委員會聲請調解 (C)於個案契約約定由契約雙方自行成立「爭議處理小組」進行爭議處理 (D)經雙方合意向仲裁機構申請調解或訂立仲裁協議後提付仲裁。","A"],[234,"單元一：第三章 公共工程履約管理","關於逾期違約金之規定，下列何者有誤？ (A)為損害賠償額預定性違約金 (B)一般以每日依契約價金千分之一計算 (C)逾期違約金之總額以契約價金總額之30％為上限 (D)約定之違約金過高者，法院得減至相當之數額。","C"],[235,"單元一：第三章 公共工程履約管理","依公共工程施工品質管理作業要點規定，下列何者非廠商專任工程人員工作重點？ (A)依據營造業法第35條規定，辦理相關工作 (B)工地之人員、機具及材料等管理，並按日填報施工日誌 (C)查核小組辦理查核時，廠商之專任工程人員應配合到場說明 (D)督察品管人員及現場施工人員，落實執行品質計畫，並填具督察紀錄表。","B"],[236,"單元一：第三章 公共工程履約管理","驗收人員及其權責，何者為會驗人員 (A)主(會)計人員， (B)施工廠商， (C)監造單位人員， (D)接管或使用機關人員。","D"],[237,"單元一：第三章 公共工程履約管理","驗收結果與規定不符，而不妨礙安全及使用需求，亦無減少通常效用或契約預定效用，經機關檢討不必拆換或拆換確有困難者， (A)不得採取減價驗收方式處理， (B)得於必要時減價收受方式處理， (C)不減價亦可， (D)以上皆非。","B"],[238,"單元一：第三章 公共工程履約管理","竣工計價，監造單位應於結算驗收證明書機關核定後，檢具竣工計價單、竣工照片，連同廠商保固保證金、統一發票或收據，陳報機關於幾日內完成付款手續？ (A)3日內 (B)7日內 (C)15日內 (D)30日內。","C"],[239,"單元一：第三章 公共工程履約管理","有初驗程序者，機關應於收受全部資料之日起 (A)7日內 (B)10日內 (C)20日內 (D)30日內辦理初驗，並作成初驗紀錄。","D"],[240,"單元一：第三章 公共工程履約管理","工程竣工後，除契約另有規定者外，監造單位應於竣工後 (A)3 (B)7 (C)15 (D)30日內，將竣工圖表、工程結算明細表及契約規定之其他資料，送請機關審核。","B"],[241,"單元一：第三章 公共工程履約管理","契約約定之採購標的，得標廠商其有下列情形之一者，廠商得敘明理由，檢附規格、功能、效益及價格比較表，徵得機關書面同意後，以其他規格、功能及效益相同或較優者代之。但不得據以增加契約價金。其因而減省廠商履約費用者，應自契約價金中扣除 (A)所交之工程標的不符契約規定 (B)廠商所施作之工法不符契約規定 (C)契約原標示之廠牌或型號不再製造或供應 (D)所使用之材料不符契約規定要求減價收受。","C"],[242,"單元一：第三章 公共工程履約管理","起造人因故不能於自領得建造執照或雜項執照之日起6個月內開工時，應敘明原因，申請展期1次，期限為 (A)1 (B)2 (C)3 (D)6個月。未依規定申請展期，或已逾展期期限仍未開工者，其建造執照或雜項執照自規定得展期之期限屆滿之日起，失其效力。","C"],[243,"單元一：第三章 公共工程履約管理","起造人自接獲通知領取建造執照或雜項執照之日起，逾 (A)1 (B)2 (C)3 (D)6 個月未領取者，主管建築機關得將該執照予以廢止。","C"],[244,"單元一：第三章 公共工程履約管理","採購之驗收，有初驗程序者，初驗合格後，除契約另有規定者外，機關應於多少日內辦理驗收，並作成驗收紀錄？ (A)15日內 (B)20日內 (C)25日內 (D)30日內。","B"],[245,"單元一：第三章 公共工程履約管理","查核成績列為丙等者，機關除應依契約約定處理外，並依個案缺失情節檢討人員之責任歸屬後，通知廠商依契約撤換 (A)工地負責人 (B)品管人員 (C)安全衛生人員 (D)以上均可。","D"],[246,"單元一：第三章 公共工程履約管理","風險管理計畫之內容應包括那些事項？ (A)風險因素之評估 (B)風險處理對策 (C)應變流程及監控措施 (D)以上均是。","D"],[247,"單元一：第三章 公共工程履約管理","防止崩塌、倒塌施工開挖超過幾公尺必須裝設擋土支撐等？ (A)1公尺， (B)1.5公尺， (C)2公尺， (D)2.5公尺。","B"],[248,"單元一：第三章 公共工程履約管理","交維計畫先送請那個單位審查核可？ (A)主辦單位 (B)監造單位 (C)交通主管單位 (D)規劃單位。","C"],[249,"單元一：第三章 公共工程履約管理","機電系統工程各關連性廠商在各工項施工前，應提出設備元件安裝計畫(稱為初步安裝計畫)，由什麼廠商綜整出總和的安裝計畫或是安裝時程，進而繪製施工網圖？ (A)機電廠商 (B)土建廠商 (C)水電廠商 (D)機械廠商。","B"],[250,"單元一：第三章 公共工程履約管理","如有新增工程項目，其變更原則核准有案者，未經議價前，機關完成施工預算後，經機關核定之修正契約總價表預估單價，依契約約定之百分比估驗計價，契約未明訂百分比者，得先按擬定單價幾成估驗，俟奉核定並與廠商協議後，再行調整計價。 (A)6成， (B)7成， (C)8成， (D)9成。","C"],[251,"單元一：第三章 公共工程履約管理","品質計畫之內容除機關及監造單位另有規定外，新臺幣1千萬元以上未達查核金額之工程應包含那些內容？ (A)品質管理標準， (B)材料及施工檢驗程序， (C)自主檢查表及文件紀錄管理系統等， (D)以上均是。","D"],[252,"單元一：第三章 公共工程履約管理","為達成工程品質目標，由廠商建立什麼系統？ (A)施工品質查證系統 (B)施工品質管制系統 (C)工程施工查核小組 (D)以上均是。","B"],[253,"單元一：第三章 公共工程履約管理","廠商延誤履約進度案件，如施工進度已達多少%以上，機關得經評估後，同意廠商及分包廠商共同申請採監督付款方式，由分包廠商繼續施工。 (A)65%以上， (B)70%以上， (C)75%以上， (D)80%以上。","C"],[254,"單元一：第三章 公共工程履約管理","履約期間之計算，以日曆天計者。是否計入，應於契約中明定，是那些日子？ (A)星期例假日， (B)國定假日， (C)其他休息日， (D)以上均是。","D"],[255,"單元一：第三章 公共工程履約管理","新建公有建築物之總造價在新台幣幾萬元以上者，應先取得候選綠建築證書，始得申報開工？ (A)2000萬元以上 (B)3000萬元以上 (C)4000萬元以上 (D)5000萬元以上。","D"],[256,"單元一：第三章 公共工程履約管理","開工前說明會，由機關邀集那些單位召開施工前說明會 (A)專案管理單位 (B)規劃、設計單位 (C)監造單位、廠商 (D)以上均是。","D"],[257,"單元一：第三章 公共工程履約管理","工程執行過程，涉及之單位包括機關、專案管理單位、設計單位、監造單位、廠商等，應建立幾層級品質管理機制？ (A)一層 (B)二層 (C)三層 (D)四層。","C"],[258,"單元一：第三章 公共工程履約管理","同一廠商同時作為各機關採購契約之連帶保證廠商者，以幾個契約為限？ (A)一個， (B)二個， (C)三個， (D)四個。","B"],[259,"單元一：第三章 公共工程履約管理","履約管理之目的為公共工程於有效的管理作業下，為使那些單位均能善盡契約責任？ (A)機關、專案管理單位 (B)設計、監造單位 (C)施工廠商 (D)以上均是。","D"],[260,"單元一：第三章 公共工程履約管理","因非可歸責於廠商的事由，接管單位有異議或藉故拒絕、拖延時，機關應負責處理，並在驗收合格後 (A)3 (B)7 (C)15 (D)30日內處理完畢，否則應由機關自行接管。","C"],[261,"單元一：第三章 公共工程履約管理","機關應於驗收完畢後 (A)7 (B)10 (C)15 (D)30日內，填具驗收證明書，並經主驗及監驗人員分別簽認。","C"],[262,"單元一：第三章 公共工程履約管理","初驗合格後，除契約另有規定者外，機關應於 (A)7 (B)10 (C)20 (D)30日內辦理驗收，並作成驗收記錄。","C"],[263,"單元一：第三章 公共工程履約管理","無初驗程序者，除契約另有規定外，機關應於接獲廠商通知備驗或可得驗收之程序完成後，幾日內辦理驗收，並做成驗收紀錄 (A)30 (B)20 (C)10 (D)7日。","A"],[264,"單元一：第三章 公共工程履約管理","工程之個別項目實作數量較契約所定數量增加【達___%】以上時，其【逾___%】之部分，應以契約變更合理調整契約單價及計算契約價金。 (A)10% (B)20% (C)30％ (D)50%。","C"],[265,"單元一：第三章 公共工程履約管理","廠商應於工程預定竣工日前或竣工當日，將竣工日期書面通知監造單位及機關。除契約另有規定者外，機關應於收到該書面通知之日起幾日內會同監造單位及廠商，依據契約、圖說或貨樣核對竣工之項目及數量，確定是否竣工；廠商未依機關通知派代表參加者，仍得予確定？ (A)7 (B)10 (C)20 (D)30。","A"],[266,"單元一：第三章 公共工程履約管理","建築師受委託辦理建築物之設計，應負該工程設計之責任；其受委託監造者，應負監督該工程施工之責任，有關建築物結構與設備等專業工程部分，交由依法登記開業之專業技師負責辦理時，建築師並須負下列哪些責任？ (A)無須負 (B)負連帶 (C)負全部 (D)以上皆非。","B"],[267,"單元一：第三章 公共工程履約管理","懲罰性違約金金額，應依查核小組查核之品質缺失扣點數計算之，查核金額以上未達巨額之工程，每點罰款金額為： (A)新臺幣6,000元， (B)新臺幣5,000元， (C)新臺幣4,000元， (D)新臺幣2,000元。","C"],[268,"單元一：第三章 公共工程履約管理","依政府採購法第73條之1規定，機關辦理工程採購之付款及審核程序，除契約另有約定或向上級機關申請核撥補助款外，其屬驗收付款者，機關應於驗收合格後，填具結算驗收證明文件，並於接到廠商請款單據後幾日內付款？ (A)10日 (B)15日 (C)30日 (D)45日。","B"],[269,"單元一：第三章 公共工程履約管理","分項品質計畫之內容，除機關另有規定外，不包含下列何者？ (A)施工要領 (B)品質管理標準 (C)材料及施工檢驗程序 (D)文件紀錄管理系統。","D"],[270,"單元一：第三章 公共工程履約管理","新臺幣150萬元以上未達1,000萬元之工程，其整體品質計畫內容不包含下列何者？ (A)管理權責及分工 (B)品質管理標準 (C)材料及施工檢驗程序 (D)自主檢查表。","B"],[271,"單元一：第三章 公共工程履約管理","新臺幣1,000萬元以上未達5,000萬元之工程，除機關另有規定外，其整體品質計畫內容不包含下列何者？ (A)品質管理標準 (B)施工要領 (C)材料及施工檢驗程序 (D)自主檢查表。","B"],[272,"單元一：第三章 公共工程履約管理","新臺幣150萬元以上未達1,000萬元之工程，其監造計畫內容不包含下列何者？ (A)品質計畫審查作業程序， (B)施工計畫審查作業程序， (C)品質稽核， (D)施工抽查程序及標準。","C"],[273,"單元一：第三章 公共工程履約管理","依建築法規定，起造人自領得建造執照或雜項執照之日起，應於幾個月內開工？ (A)1個月， (B)2個月， (C)3個月， (D)6個月。","D"],[274,"單元一：第三章 公共工程履約管理","依建築法規定，建築期限以開工之日起算，承造人因故未能於建築期限內完工時，得申請展期多久，並以一次為限？ (A)3個月 (B)6個月 (C)1年 (D)2年。","C"],[275,"單元一：第三章 公共工程履約管理","依建築法規定，起造人自接獲通知領取建造執照或雜項執照之日起，逾幾個月未領取者，主管建築機關得將該執照予以廢止？ (A)1個月， (B)2個月， (C)3個月， (D)6個月。","C"],[276,"單元一：第三章 公共工程履約管理","機關與廠商因採購履約爭議未能達成協議者，得向採購申訴審議委員會申請： (A)申訴 (B)仲裁 (C)調解 (D)訴訟。","C"],[277,"單元一：第三章 公共工程履約管理","下列有關履約保證之敘述，何者錯誤？ (A)優良廠商應繳納之履約保證金金額得予減收，其額度以不逾原定應繳總額之50%為限 (B)同一廠商同時作為各機關採購契約之連帶保證廠商者，以二契約為限 (C)公告金額以上之採購，機關得於招標文件中規定得標廠商提出符合招標文件所定投標廠商資格條件之其他廠商之履約及賠償連帶保證者，其應繳納之履約保證金得予減收 (D)得標廠商延誤履約進度，經機關通知連帶保證廠商履約時，不得重新核定工期。","D"],[278,"單元一：第三章 公共工程履約管理","下列有關施工安全衛生之敘述，何者錯誤？ (A)機關應明訂廠商執行施工安全衛生之責任，並對重點項目訂定檢查程序及檢驗標準 (B)勞工執行職務發現有立即發生危險之虞時，得在不危及其他工作者安全情形下，自行停止作業及退避至安全場所，並立即向直屬主管報告 (C)營繕工程如屬勞動檢查法公告指定之營造工程危險性工作場所者，廠商應於工程施工前10天向當地檢查機構申請審查 (D)廠商所提之施工計畫，應包括職業安全衛生管理計畫及繪製相關設施之施工詳圖等項目。","C"],[279,"單元一：第三章 公共工程履約管理","下列有關工程進度管理之敘述，何者錯誤？ (A)工程招標前，主辦機關應要求設計單位訂定合理工期，以作為決標後履約管理控管工程進度之依據， (B)機關應要求廠商於開工前擬定施工預定進度表或施工預定進度網狀圖等，送請主辦機關核定， (C)重大或緊急工程之預定進度表應明定每一工作項目之預定完成日(即里程碑)， (D)因天災或事變等不可抗力或不可歸責於契約當事人之事由，致未能依時履約者，得展延履約期限。","C"],[280,"單元一：第三章 公共工程履約管理","下列有關工程品質管理之敘述，何者錯誤？ (A)機關辦理工程採購，應明訂廠商執行品質管理、環境保護、施工安全衛生之責任， (B)機關辦理工程採購，應對重點項目訂定檢查程序及檢驗標準， (C)執行工程品質管理為機關之責任，廠商得因機關辦理查驗、測試或檢驗，而免除其依契約所應履行或承擔之責任， (D)機關於廠商履約中，若發現或可預見其履約瑕疵，得通知廠商限期改正，廠商不依照改正或履行者，機關得依契約規定暫停發放工程估驗款。","C"],[281,"單元一：第三章 公共工程履約管理","機關依採購法第101條規定通知廠商有擅自減省工料情節重大之情形，經廠商提出異議申訴審議結果並無不實者，自刊登公報之次日起多少期間內不得參加投標或作為決標或分包廠商？ (A)6個月， (B)1年， (C)2年， (D)3年。","D"],[282,"單元一：第三章 公共工程履約管理","機關依政府採購法第101條規定通知廠商有違反第65條規定轉包之情形，且該廠商於機關通知日起前5年內已被任一機關刊登累計3次，則經廠商提出異議申訴審議結果並無不實者，自刊登公報之次日起多少期間內不得參加投標或作為決標或分包廠商？ (A)3個月， (B)6個月， (C)1年 (D)3年。","C"],[283,"單元一：第三章 公共工程履約管理","分包廠商及於得標廠商對於機關之價金或報酬請求權之條件？ (A)分包契約報備於採購機關，並經得標廠商就分包部分設定權利質權予分包廠商者 (B)分包契約報備於採購機關，或經得標廠商就分包部分設定權利質權予分包廠商者 (C)得標廠商之投標文件載明分包廠商者 (D)分包契約報備於採購機關，並經機關同意者。","A"],[284,"單元一：第三章 公共工程履約管理","下列有關營造業專任工程人員敘述，何者錯誤？ (A)為擔任其所承攬工程之施工技術指導及施工安全之人員， (B)應負責填寫所有承攬工程之施工日誌， (C)工程主管或主辦機關於勘驗、查驗或驗收工程時，應在現場說明，並於勘驗、查驗或驗收文件上簽名或蓋章， (D)應督察品管人員及現場施工人員，落實執行品質計畫。","B"],[285,"單元一：第三章 公共工程履約管理","有關轉包規定，下列何者為非？ (A)招標文件標示屬於主要部分或應由得標廠商自行履行之部分，得標廠商不得轉包 (B)廠商如違反規定轉包尚無須刊登為拒絕往來廠商， (C)不得轉包之主要部分，係指招標文件標示為主要部分者；招標文件標示或依其他法規規定應由得標廠商自行履行之部分， (D)廠商如違反規定轉包，得解除契約、終止契約或沒收保證金，並得要求損害賠償。","B"],[286,"單元一：第三章 公共工程履約管理","有關採購契約責任規定，下列何者為非？ (A)採購契約應訂明一方執行錯誤、不實或管理不善，致他方遭受損害之責任 (B)受機關委託辦理規劃、設計、審查、監造、專案管理或代辦採購廠商之人員，不得意圖為私人不法之利益，對技術、工法、材料、設備或規格 (C)營造業之工地主任擔任其所承攬工程之施工技術指導及施工安全之人員 (D)綜合營造業之專任工程人員(主任技師或主任建築師)，為擔任其所承攬工程之施工技術指導及施工安全之人員。","C"],[287,"單元一：第三章 公共工程履約管理","下列何者不正確: (A)整體品質計畫應於開工前提出，並經機關或監造單位核備; (B)分項品質計畫配合各分項施工計畫依施工時程先後，於工程開工前提出，並報機關或監造單位核備後施工; (C)未達新臺幣一千萬元之工程僅需提送整體品質計報機關或監造單位核備; (D)新臺幣一百萬元以上工程，應符合CNS 17025規定之實驗室辦理，並出具檢驗或抽驗報告印有依標準法授權之實驗室認證機構之認可標誌。","B"],[288,"單元一：第三章 公共工程履約管理","下列何者正確？ (A)因可歸責於廠商之事由，致解除或終止契約者，機關應將其事實及理由通知廠商，並刊登政府採購公報 (B)工程總預定進度表應能清楚說明工期與施工進度之相對關係，並能清楚看出要徑作業，明確標示契約規定之里程碑、重要工程界面管制點及每月累計預定進度等 (C)因可歸責於廠商之事由，致施工進度落後百分之十五以上時，機關處理廠商延誤履約進度案件，得視機關與廠商所訂契約之約定及廠商履約情形，就下列事項綜合評估 (D)機關得以書面通知廠商終止契約或解除契約之部分或全部，且不補償廠商因此所生之損失。","B"],[289,"單元一：第三章 公共工程履約管理","履約期間之計算，由機關載明於契約辦理之敘述下列何者不正確: (A)以限期完成者。星期例假日、國定假日或其他休息日均應計入; (B)以日曆天計者。星期例假日、國定假日或其他休息日，是否計入，應於契約中明定; (C)以工作天計者。星期例假日、國定假日或其他休息日，均應不計入; (D)以工作天計者。星期例假日、國定假日或其他休息日，均應計入。","D"],[290,"單元一：第三章 公共工程履約管理","下列有關開工前準備作業包括何者不正確: (A)廠商應在施工範圍內之適當地點，設置固定或臨時水準點與座標基準點，俾便隨時檢測; (B)主辦工程機關應建立施工品質管制系統，指派具工程相關學經歷之適當人員或委託適當機構負責監造、並設置工程督導小組; (C)機關應召開施工前說明會;並邀集規劃、設計、監造單位、廠商等均應到場參加; (D)監造單位及廠商應依契約及核定之送審文件管制一覽表的期限提送監造計畫、整體施工計畫、品質計畫、各項保證金、工程保險等相關文件。","B"],[291,"單元一：第三章 公共工程履約管理","經契約雙方確定之設計變更新增工程項目，未經議價程序議定單價者，機關得以完成設計變更之總價預估單之 (A)30% (B)50% (C)80％ (D)100%，並依實際施工情形給付部分估驗款。","C"],[292,"單元一：第三章 公共工程履約管理","廠商於徵得機關書面同意後，以其他規格、功能及效益與契約約定之採購標的相同或較優者代之時 (A)因此增加之費用由機關負責 (B)不得據以增加契約價金 (C)不增減契約價金 (D)契約價金按實際需要調整增減。","B"],[293,"單元一：第三章 公共工程履約管理","約定之採購標的，得標廠商其有下列情形之一者，得請求契約變更： (A)契約原標示之廠牌或型號，契約價金與市場行情明顯差異者 (B)契約原標示之分包廠商有營業且可供應 (C)契約原標示之廠牌或型號不再製造或供應 (D)較契約原標示者較差或對機關不利。","C"],[294,"單元一：第三章 公共工程履約管理","依政府採購法第73-1條機關辦理工程採購之付款及審核程序，除契約另有約定外，應依下列規定辦理：其中定期估驗或分階段付款者，機關應於廠商提出估驗或階段完成之證明文件後，幾日內完成審核程序，並於接到廠商提出之請款單據後，幾日內付款 (A)10日,10日 (B)15日,15日 (C)20日,20日 (D)30日,30日。","B"],[295,"單元一：第三章 公共工程履約管理","分項施工計畫則配合各分項工程依施工時程先後，於分項工程 (A)施工後 ( ：第一章 監造計畫與品質計畫指導","制定設備功能運轉檢測程序時，應先提出下列何項？以表達單機項目、系統、整體間之關聯性 (A)設備功能運轉檢測標準表 (B)製造過程中之作業計畫 (C)施工(或組裝)過程之文件 (D)機電系統架構圖。","D"],[553,"單元二：第一章 監造計畫與品質計畫指導","依「公共工程施工品質管理作業要點」規定，應先辦理下列何項工作，才對不符合事項提出矯正及預防措施？ (A)品質稽核 (B)品管統計分析 (C)不合格品之管制 (D)材料及施工檢驗程序。","B"],[554,"單元二：第一章 監造計畫與品質計畫指導","於不符合事項提出矯正及預防措施，且對矯正結果辦理追蹤，並留存紀錄，為下列何種人員的職掌？ (A)監造人員 (B)工地主任 (C)專任工程人員 (D)品管人員。","D"],[555,"單元二：第一章 監造計畫與品質計畫指導","有關矯正措施，下列何項有誤？ (A)所關切的是缺失本身 (B)是確保不符合事項不再發生的管制流程 (C)追查並消除現存不符合事項之原因，以回饋到下一階段之施工 (D)廠商應依所訂定之矯正時機適時辦理矯正措施。","A"],[556,"單元二：第一章 監造計畫與品質計畫指導","矯正採行之措施，不包含下列何項？ (A)程序修改 (B)消除潛在不符合之原因 (C)人員調派 (D)制度面修改。","B"],[557,"單元二：第一章 監造計畫與品質計畫指導","矯正與預防措施，下列何項正確？ (A)預防措施若達成效，回饋至矯正措施 (B)預防措施效果不彰，重新執行矯正措施 (C)矯正措施若達成效，回饋到品質制度面 (D)矯正廣義定義在防患未然。","B"],[558,"單元二：第一章 監造計畫與品質計畫指導","預防措施此處所強調的項目為下列何項？ (A)「事前」之「防患未然」 (B)不再發生的「管制流程」 (C)回饋到品質制度面 (D)追查並消除現存不符合事項之原因。","C"],[559,"單元二：第一章 監造計畫與品質計畫指導","預防措施執行過程倘發現效果不彰，則應檢討其產生之原因，針對該缺失原因辦理改善，並執行下列何項？ (A)矯正措施 (B)預防措施 (C)不合格品之管制 (D)矯正與預防措施。","A"],[560,"單元二：第一章 監造計畫與品質計畫指導","工地品管人員對工地管理組織的內部稽核項目不包括？ (A)施工人員確實了解執行工作的標準 (B)施工人員應具備執行工作的基本知能 (C)矯正與預防措施是否落實執行 (D)對於工地之各項計畫是否落實執行。","C"],[561,"單元二：第一章 監造計畫與品質計畫指導","稽核流程，不包含下列何項？ (A)稽核結果通知 (B)起始會議 (C)矯正及預防措施 (D)不合格品之管制。","D"],[562,"單元二：第一章 監造計畫與品質計畫指導","文件紀錄管理系統中文件紀錄移轉及存檔，需規劃文件紀錄資料最終之存檔位置及下列何項？ (A)存檔年限 (B)存檔密碼 (C)存檔櫃址 (D)存檔密級。","A"],[563,"單元二：第一章 監造計畫與品質計畫指導","規劃工地內所作各項相關紀錄資料之作業程序，及如何配合文件之何項？將其紀錄成果作有系統之歸檔 (A)登錄、收發 (B)核定、保存 (C)分類、編碼 (D)保存、作廢。","C"],[564,"單元二：第二章 統計分析方法與應用","常態分配直方圖，品管數據的平均數，可由下列哪一個累積相對次數百分比判斷？ (A)100% (B)75% (C)50% (D)25%。","C"],[565,"單元二：第二章 統計分析方法與應用","由直方圖次數分配表可估計 (A)數據分佈範圍 (B)數據之平均數 (C)某範圍所佔比例 (D)以上皆是。","D"],[566,"單元二：第二章 統計分析方法與應用","直方圖橫座標係以何數據繪示 (A)組上限 (B)組下限 (C)組中值 (D)組距。","C"],[567,"單元二：第二章 統計分析方法與應用","直方圖次數分配表之次數或相對次數，即為直方圖之 (A)縱座標 (B)橫座標 (C)座標原點 (D)以上皆非。","A"],[568,"單元二：第二章 統計分析方法與應用","在相同條件下所生產或施工之工程品質特性，大部分情形都會出現在何處？ (A)規範要求值邊緣 (B)中心值附近 (C)1/2標準差附近 (D)不一定。","B"],[569,"單元二：第二章 統計分析方法與應用","直方圖成單峰山形，此現象稱之為 (A)集中趨勢 (B)造山運動 (C)離散趨勢 (D)標準化。","A"],[570,"單元二：第二章 統計分析方法與應用","直方圖成單峰山形，這種現象稱「集中趨勢」，工程品管上常用哪個統計量數據表示該中心值？ (A)標準差 (B)變異係數 (C)全距 (D)平均數。","D"],[571,"單元二：第二章 統計分析方法與應用","工程品質必有若干程度之不均勻性，以平均數為中心，上下分布，其散佈之寬窄稱之為 (A)寬窄程度 (B)高低程度 (C)離散程度 (D)集中程度。","C"],[572,"單元二：第二章 統計分析方法與應用","工程品管上常以何種統計量數據來表示離散程度 (A)標準差 (B)變異係數 (C)全距 (D)以上皆可。","D"],[573,"單元二：第二章 統計分析方法與應用","一組品管數據的離散程度愈明顯即表示品質 (A)越均勻 (B)越不均勻 (C)越恰當 (D)以上皆非。","B"],[574,"單元二：第二章 統計分析方法與應用","下列何者較不適合用來表示離散程度的指標？ (A)全距 (B)標準差 (C)平均數 (D)變異係數。","C"],[575,"單元二：第二章 統計分析方法與應用","以下何種項目，由直方圖比較不容易觀察估算？ (A)標準差 (B)形狀 (C)全距 (D)平均值。","A"],[576,"單元二：第二章 統計分析方法與應用","某工程最有利標評選會議，7位評選委員就同一家廠商均評給84分，試問全體委員就該廠商評分之全距等於 (A)84分 (B)42分 (C)21分 (D)0分。","D"],[577,"單元二：第二章 統計分析方法與應用","假設包括價格及品質特性平均值等所有條件均同的三家廠商，分別提供30個製程數據，則採購部門可採何統計量來判斷生產較為穩定者 (A)平均值 (B)移動平均值 (C)全距 (D)以上皆非。","B"],[578,"單元二：第二章 統計分析方法與應用","下列何種統計量非工程品管上對離散程度的衡量指標 (A)標準差 (B)平均值 (C)全距 (D)變異係數。","B"],[579,"單元二：第二章 統計分析方法與應用","工程統計品管的平均數係指？ (A)幾何平均數 (B)調和平均數 (C)算術平均數 (D)加權平均數。","C"],[580,"單元二：第二章 統計分析方法與應用","接地電阻測試數據依時序不斷下降，則其品質變化趨勢線型朝哪個方向發展 (A)水平 (B)左下右上 (C)左上右下 (D)波浪狀起伏。","C"],[581,"單元二：第二章 統計分析方法與應用","報價與品質特性平均值均相同的同等品，三家品牌製程數據繪製品質變化趨勢圖，採購單位應優先選擇哪種線型之品牌 (A)貼近平均值的近乎水平狀 (B)左上右下 (C)左下右上 (D)無從判斷。","A"],[582,"單元二：第二章 統計分析方法與應用","某廠商之承攬工程標案，5次施工查核分數分別為80、79、81、80、79，試問該廠商施工品質變化趨勢線型 (A)水平線 (B)左上右下 (C)左下右上 (D)無從判斷。","A"],[583,"單元二：第二章 統計分析方法與應用","假設所有條件均相同，機關對兩件標案督導工程紀錄為甲廠商(72、74、75、71、73)，乙廠商(85、82、83、84、80)，為比較甲乙廠商施工品質良窳，宜採何統計量較合理？ (A)全距 (B)標準差 (C)變異數 (D)平均值。","D"],[584,"單元二：第二章 統計分析方法與應用","假設某次工程查核委員有15人，每位委員都給評分82分，請問該次查核成績之標準差為何？ (A)20 (B)15 (C)10 (D)0。","D"],[585,"單元二：第二章 統計分析方法與應用","比較不同量測單位的品質特性離散程度，以何種統計量為宜？ (A)全距 (B)移動平均數 (C)標準差 (D)變異係數。","D"],[586,"單元二：第二章 統計分析方法與應用","依據30次混凝土抗壓試驗結果計算標準差，數值愈大則代表品質 (A)愈好 (B)愈差 (C)持平 (D)以上皆非。","B"],[587,"單元二：第二章 統計分析方法與應用","有關標準差之敘述，下列何者錯誤？ (A)變異數開平方根為標準差 (B)如果數據含有過大或過小的極端值時，標準差比全距更能表達其差異 (C)標準差衡量品質特性變異的範圍 (D)標準差愈大表示品質特性變異愈小愈穩定。","D"],[588,"單元二：第二章 統計分析方法與應用","甲、乙同一種類不同批次進場材料，甲批次材料檢驗結果其平均值為48、標準差為6，乙材料檢驗結果平均值64，標準差為8，請問甲、乙兩批材料何者品質較為不均勻？ (A)甲 (B)乙 (C)甲、乙相同 (D)無法比較。","C"],[589,"單元二：第二章 統計分析方法與應用","評估混凝土管制水準(均勻性)之全面變異，不論是普通強度或高強度，一律皆採 (A)標準差 (B)變異係數 )平均數管制圖。","D"],[730,"單元二：第二章 統計分析方法與應用","CNS 3090[預拌混凝土]規定設計強度(fc')在350kgf/cm²以下時，任何連續3組強度試驗結果之平均數不得小於規定強度fc’，可化約為哪種圖形來表示 (A)魚骨圖 (B)直方圖 (C)卡常態分配曲線 (D)三點移動平均數管制圖。","D"],[731,"單元二：第二章 統計分析方法與應用","繪製移動平均全距管制圖的目的？ (A)偵測施工品質 (B)計算工率 (C)顯示試驗精密度 (D)以上皆非。","C"],[732,"單元二：第二章 統計分析方法與應用","30次抗壓試驗結果繪製移動平均全距管制圖，依時序由左向右線型約略呈左下右上者，表示試驗精密度 (A)提高 (B)降低 (C)維持 (D)以上皆非。","B"],[733,"單元二：第三章 品質分析方法與應用","工程中較熟悉的量化資料，下列何者為非？ (A)瀝青溫度 (B)壓實度 (C)材料類別 (D)水灰比。","C"],[734,"單元二：第三章 品質分析方法與應用","石川馨博士在1974年將一系列品質管制工具方法納入「品質管制指針」一書，即為品管七大工具Q7，其中不包括 (A)散佈圖 (B)層別法 (C)親和圖 (D)特性要因圖。","C"],[735,"單元二：第三章 品質分析方法與應用","新七大品管工具N7，主要是用來分析非量化的資料，其中不包括 (A)KJ法 (B)矩陣資料解析法 (C)箭線圖法 (D)層別法。","D"],[736,"單元二：第三章 品質分析方法與應用","下列敘述何者為非？ (A)全面品質管理是問題解決導向 (B)品管新七大工具手法N7，可用來解決量化數據資料取出前的問題 (C)量化數據資料取出後，較屬定性問題，可以用品管七大工具手法Q7解決 (D)品管七大工具手法Q7與品管新七大工具手法N7兩者相輔相成，互為運用。","C"],[737,"單元二：第三章 品質分析方法與應用","傳統的品管七大工具手法Q7中，層別法必須配合其他手法一起運用，所以有另外一種分類方式總稱圖形法，以之取代層表法，其圖形包括下列何者？ (A)推移圖 (B)系統圖 (C)柏拉圖 (D)流程圖。","A"],[738,"單元二：第三章 品質分析方法與應用","義大利經濟學者柏拉圖提出只要控制少數的財富所有人，就可以控制社會上多數的財富，關於柏拉圖法則何者為非？(A)此法則運用在工作現場改善作業，可以針對關鍵原因尋求解決對策 (B)依蒐集的資料進行分類，並將類別資料統計計次按其次數的多寡降冪排序 (C)柏拉圖縱軸有兩種衡量尺度 (D)項目排列的順序依百分比從大到小，不論其他項目百分比大小，一律統整放至於最後。","D"],[739,"單元二：第三章 品質分析方法與應用","下列有關魚骨圖，何者敘述為非？ (A)整理成具有層次且相互關聯的圖形，又稱之為特性要因圖 (B)魚頭向右者為探討原因型 (C)小要因對照現場作業標準程序(SOP)，可作為SOP修訂或作業改善的依據 (D)可搭配散佈圖一起運用，對魚骨圖上的重要要因可看出相關程度。","D"],[740,"單元二：第三章 品質分析方法與應用","判讀直方圖時，下列數種分布造成原因何者為非？ (A)高原型(數個變異數差異不大的群體混合所造成 (B)離島型(不同群體混入造成之異常現象) (C)雙峰型(兩個不同群體混和所造成) (D)鋸齒型(分組及組距測定有誤差所造成)。","A"],[741,"單元二：第三章 品質分析方法與應用","下列何者為非？ (A)要因與結果的散佈圖關係如原料純度與製品良率 (B)結果與其他結果的散佈圖關係如鋼材的張力強度與硬度 (C)要因與其他要因的散佈圖關係如災害預防措施與安全服裝 (D)結果與要因的散佈圖關係如缺失產生預警與抽樣平均值。","D"],[742,"單元二：第三章 品質分析方法與應用","關聯圖工具手法敘述何者為非？ (A)在歐美國家亦發展類似品管手法，稱為推移圖，與關聯圖特性相十分類似 (B)此手法與魚骨圖功能相近 (C)盡量從外層原因著手，因為外層原因通常是根本原因 (D)適合應用在挖掘原因間或手段間有糾纏不清、錯綜複雜的關係時。","A"],[743,"單元二：第三章 品質分析方法與應用","營建工程中的分工結構圖WBS(Work Breakdown Structure)，即與哪一個品管工具手法應用十分接近 (A)箭線圖法 (B)系統圖 (C)關聯圖 (D)矩陣圖。","B"],[744,"單元二：第三章 品質分析方法與應用","系統圖適用範圍下列何者為非？ (A)價值分析之機能展開 (B)為解決問題時的創意展開 (C)要因之展開 (D)關聯性之展開。","D"],[745,"單元二：第三章 品質分析方法與應用","下列有關親和圖敘述何者為非？ (A)KJ法又稱親和圖，對混沌未知的事件展開認知 (B)依據所蒐集的文本語意量化資料的相關性，加以歸納整理 (C)是由日本人類文化學者川喜田二郎教授開發 (D)適用範圍在傳達組織理念教育團隊貫徹方針。","B"],[746,"單元二：第三章 品質分析方法與應用","全面品質管理(TQM)盛行於 (A)1950s (B)1960s (C)1970s (D)1980s。","D"],[747,"單元二：第三章 品質分析方法與應用","全面品質管理(TQM)的概念起源於 (A)1950s， (B)1960s， (C)1970s， (D)1980s。","A"],[748,"單元二：第三章 品質分析方法與應用","新QC七大手法主要用於 (A)Plan階段， (B)Do階段， (C)Check階段， (D)Action階段。","A"],[749,"單元二：第三章 品質分析方法與應用","百分之二十的主要原因通常造成百分之八十的後果，這種法則稱為 (A)20-80法則， (B)80-20法則， (C)戴明法則 (D)以上均非。","B"],[750,"單元二：第三章 品質分析方法與應用","魚骨圖外型類似魚骨，若用於擬定對策時， (A)魚頭向右， (B)魚頭向左， (C)左右均可， (D)以上皆是。","B"],[751,"單元二：第三章 品質分析方法與應用","魚骨圖分析的適用範圍有 (A)結果和原因間的分析， (B)目的和手段間的分析， (C)全體和要素間的分析， (D)以上均是。","D"],[752,"單元二：第三章 品質分析方法與應用","開發出關聯圖手法的學者是 (A)千住鎮雄教授 (B)石川馨教授 (C)裘蘭博士 (D)川喜田二郎。","A"],[753,"單元二：第三章 品質分析方法與應用","依據所蒐集的文本語意資料的相互親和性，加以歸納整理後，明確指認問題所在的圖形，稱為 (A)關聯圖， (B)PDPC法， (C)特性要因圖， (D)KJ法。","D"],[754,"單元二：第三章 品質分析方法與應用","探討為了達到某種目的或目標，經由系統展開圖形尋求最適當的手段或策略的方法，指的是下列何者？ (A)親和圖 (B)PDPC圖 (C)系統圖 (D)關聯圖。","C"],[755,"單元二：第三章 品質分析方法與應用","矩陣圖的Y型矩陣，屬於 (A)二元矩陣， (B)三元矩陣， (C)四元矩陣， (D)五元矩陣。","B"],[756,"單元二：第三章 品質分析方法與應用","箭線圖可應用於 (A)工程進度管理與控制， (B)工程資源調度， (C)工程成本控制， (D)以上均可。","D"],[757,"單元二：第三章 品質分析方法與應用","Process Decision Program Chart，簡稱PDPC，係指下列何者？ (A)親和圖 (B)過程決策計畫圖 (C)系統圖 (D)箭線圖。","B"],[758,"單元二：第三章 品質分析方法與應用","解決何種問題時，須採取預防措施 (A)臨界問題 (B)潛在問題 (C)顯在問題 (D)危機問題。","B"],[759,"單元二：第三章 品質分析方法與應用","土建施工時，鋼架組裝作業違規次數多，其中鋼架組裝作業違規是 (A)品質特性 (B)異常現象 (C)趨勢 (D)以上均非。","B"],[760,"單元二：第三章 品質分析方法與應用","擬定改善活動計劃要應用六何，六何是指 (A)4M+E (B)5W1H (C)六標準差 (D)以上均非。","B"],[761,"單元二：第三章 品質分析方法與應用","實施真因驗證時，下列何種方法不適用 (A)觀察， (B)經驗， (C)調查， (D)實驗。","B"],[762,"單元二：第三章 品質分析方法與應用","評估改善對策時，評估的基準有 (A)預期效果， (B)可行性， (C)完成所需時間， (D)以上均是。","D"],[763,"單元二：第三章 品質分析方法與應用","改善對策的實施效果是否能夠維持，要靠 (A)品質稽核， (B)監督查驗， (C)對策納入作業標準， (D)以上均非。","C"],[764,"單元二：第三章 品質分析方法與應用","施工查核缺失項目、工程性質、材料類別等屬於下列哪種資料？ (A)質化資料 (B)量化資料 (C)數據資料 (D)以上均非。","A"],[765,"單元二：第三章 品質分析方法與應用","下列對柏拉圖的敘述何者有誤？ (A)橫軸的項目排列順序從大到小 (B)縱軸左邊是品質特性，右邊是個別項目百分比 (C)是用來做重點管理的工具 (D)可用做問題改善前、中、後的比較分析，以確認改善對策的效果。","B"],[766,"單元二：第三章 品質分析方法與應用","下列對魚骨圖的敘述何者有誤？ (A)適合用作結果和原因 (B)適合用作目的和手段 (C)適合用作改善前後效果 (D)適合用作全體和要素間的分析。","C"],[767,"單元二：第三章 品質分析方法與應用","下列對直方圖的敘述何者有誤？ (A)鋸齒型由於分組及組距測定有誤差所造成 (B)絕壁型由於某種規格限制所造成 (C)高原型由於數個平均值差異較大的群體混合所造成 (D)離島型由於不同群體混入造成。","C"],[768,"單元二：第三章 品質分析方法與應用","下列對管制圖的敘述何者正確？ (A)連續三點之中有兩點接近管制界限即為異常現象 (B)平均值分別加減3個全距成為管制界限 (C)中心線的一邊連續出現7點，但7點均介於中心線與管制界限之間時，仍為異常現象 (D)主要以數據群之平均值與數據群之全距作為管制依據。","C"],[769,"單元二：第三章 品質分析方法與應用","下列對查檢表的敘述何者正確？ (A)以簡單容易明瞭的方式做成表格，用來記錄事實和分析事實的統計表 (B)查檢表的目的有記錄事實和分析事實兩種 (C)一般常用的自主檢查表，即屬於分析事實為目的 (D)查檢表統計完成可運用魚骨圖分析，以掌握關鍵的問題。","A"],[770,"單元二：第三章 品質分析方法與應用","下列對散佈圖的敘述何者有誤？ (A)由數據點的分佈情形可判讀兩組數據間相關或無關 (B)若相關可分辨為正相關、負相關或線性相關 (C)數據點的分佈呈現一團圓形時，表示兩組數據間無關 (D)散佈圖之應用可配合層別法做進一步分析研判。","B"],[771,"單元二：第三章 品質分析方法與應用","模糊不清數據混亂或是原因複雜的品管問題，經過下列何者品管手法，可迅速分析其現象或原因。 (A)直方圖 (B)魚骨圖 (C)管制圖 (D)層別法。","D"],[772,"單元二：第三章 品質分析方法與應用","下列品管手法的敘述何者有誤？ (A)直方圖中若柱形圖一邊出現離島形式，則須核對有無異常、測定有無誤差及是否有無其他數據混入 (B)魚骨圖之製作可以“腦力激盪法”收集分析要因 (C)管制圖中偶而有一兩個點位於管制界限外，即為異常現象 (D)層別法為將群體資料分層，使層內的差異大，而各層間的差異小，以便進行分析。","D"],[773,"單元二：第三章 品質分析方法與應用","下列對KJ法的敘述何者有誤？ (A)適用於認知未知事件，對未知事件建立有整體性的構想 (B)適用於釐清複雜性或模糊性問題 (C)核心精神為文字語言資料卡片化，需先將文字語意資料寫在卡片上，再依據資料的性質歸納整理而成的圖形 (D)是一種從抽象到具體逐步親和演變過程的圖形。","D"],[774,"單元二：第三章 品質分析方法與應用","系統圖展開手段或策略後，可以用 (A)關聯圖 (B)箭線圖 (C)矩陣圖 (D)矩陣數據解析法進行手段或策略之評價與工作任務之分配。","C"],[775,"單元二：第三章 品質分析方法與應用","下列對矩陣圖的敘述何者有誤？ (A)適用於流程分析及品質機能展開 (B)二元矩陣圖配置呈現L型 (C)三元矩陣圖配置呈現X型或Y型 (D)各因素間的關聯程度有強關聯、關聯、無關聯等。","C"],[776,"單元二：第三章 品質分析方法與應用","可用於新工具之研創、開發及產品新用途之探索的品管手法為 (A)矩陣圖 (B)KJ法 (C)系統圖 (D)矩陣數據解析法。","D"],[777,"單元二：第三章 品質分析方法與應用","箭線圖法的應用可以作為 (A)進度管理與控制 (B)資源調度 (C)成本控制 (D)以上皆是。","D"],[778,"單元二：第三章 品質分析方法與應用","隨著事態的進展，預測未來可能發生的不希望情況或結果，進而採取預防措施，並導入回饋機制，使事實的發展導向所希望的方向，此種新QC手法為 (A)矩陣圖 (B)箭線圖 (C)過程決策計畫圖 (D)系統圖。","C"],[779,"單元二：第三章 品質分析方法與應用","可用於品質設計、可靠度工程及重大事故防止的品管手法為 (A)矩陣圖 (B)KJ法 (C)系統圖 (D)過程決策計畫圖。","D"],[780,"單元二：第三章 品質分析方法與應用","下列何者品管手法不可用作結果和原因間的分析 (A)關聯圖 (B)魚骨圖 (C)系統圖 (D)柏拉圖。","D"],[781,"單元二：第三章 品質分析方法與應用","下列何者品管手法不可用作目的和手段間的分析 (A)關聯圖 (B)魚骨圖 (C)系統圖 (D)親和圖。","D"],[782,"單元二：第三章 品質分析方法與應用","品質問題的形成依序可分為四階段 元二：第三章 品質分析方法與應用","目前品質之觀念已發展至品質是 (A)製造出來的 (B)設計出來的 (C)管理出來的 (D)習慣出來的。","D"],[806,"單元二：第三章 品質分析方法與應用","下列何者非品管七大手法之一？ (A)散怖圖 (B)層別法 (C)柏拉圖 (D)腦力激蕩法。","D"],[807,"單元二：第三章 品質分析方法與應用","柏拉圖資料可以讓讀者明白 (A)應由哪一個項目先下手 (B)不良最多之項目 (C)不良現象最多之原因 (D)以上皆是。","D"],[808,"單元二：第三章 品質分析方法與應用","通稱為魚骨圖的QC手法為 (A)特性要因圖 (B)直方圖 (C)柏拉圖 (D)管制圖。","A"],[809,"單元二：第三章 品質分析方法與應用","用以探討兩個成對的數據關係之手法為 (A)直方圖 (B)柏拉圖 (C)管制圖 (D)散佈圖。","D"],[810,"單元二：第三章 品質分析方法與應用","自主檢查表屬於？ (A)特性要因圖 (B)直方圖 (C)查檢表 (D)魚骨圖。","C"],[811,"單元二：第三章 品質分析方法與應用","將數據分門別類，再看各類別的差異，此種QC手法為 (A)直方圖 (B)柏拉圖 (C)層別法 (D)因果圖。","C"],[812,"單元二：第三章 品質分析方法與應用","下列何者為品管新七大手法之一？ (A)柏拉圖 (B)散佈圖 (C)系統圖 (D)特性要因圖。","C"],[813,"單元二：第三章 品質分析方法與應用","下列何者非品管新七大手法之一？ (A)矩陣圖 (B)親和圖 (C)系統圖 (D)柏拉圖。","D"],[814,"單元二：第三章 品質分析方法與應用","將不同個人之意見、想法、經驗等文字資料收集起來，不經取捨與選擇地全部採用，再根據文字資料加以統合，此種新QC手法為 (A)關聯圖 (B)親和圖 (C)過程決定計劃圖 (D)系統圖。","B"],[815,"單元二：第三章 品質分析方法與應用","從問題現象中找出成對的要素，採用行列配置，在其交點上表示各要素關聯的有無和關聯程度，此種QC手法為(A)散布圖 (B)層別法 (C)矩陣圖 (D)柏拉圖。","C"],[816,"單元二：第三章 品質分析方法與應用","箭線圖法的應用可以計算 (A)最晚開始時間LS (B)最早完成時間EF (C)總浮時TF (D)以上皆是。","D"],[817,"單元二：第三章 品質分析方法與應用","一般機關制定之SOP，用以防範未然之QC手法為 (A)矩陣圖 (B)箭線圖 (C)系統圖 (D)過程決定計劃圖。","D"],[818,"單元二：第三章 品質分析方法與應用","下列何者為質化資料？ (A)混凝土抗壓強度 (B)瀝青混凝土壓實度 (C)拆模後混凝土外觀不良 (D)水灰比。","C"],[819,"單元二：第三章 品質分析方法與應用","下列何者是用來分析非量化的資料？ (A)柏拉圖 (B)關聯圖 (C)管制圖 (D)直方圖。","B"],[820,"單元二：第三章 品質分析方法與應用","下列品管手法何者必須配合其他手法一起運用？ (A)層別法 (B)魚骨圖 (C)查核表 (D)柏拉圖。","A"],[821,"單元二：第三章 品質分析方法與應用","下列何者是柏拉圖的主要概念？ (A)分門別類 (B)80-20法則 (C)腦力激盪術 (D)相似、相近、相同的親和原則。","B"],[822,"單元二：第三章 品質分析方法與應用","柏拉圖的右邊是 (A)品質特性 (B)分析的項目 (C)累計百分比 (D)分析項目的單位。","C"],[823,"單元二：第三章 品質分析方法與應用","特性要因圖一般俗稱為 (A)魚骨圖 (B)關聯圖 (C)分工結構圖 (D)雷達圖。","A"],[824,"單元二：第三章 品質分析方法與應用","魚骨圖兩側大骨三大要因分類法則常運用4M+E，請問下列何者非屬於4M+E？ (A)人員 (B)情緒 (C)材料 (D)環境。","B"],[825,"單元二：第三章 品質分析方法與應用","運用魚骨圖在分析要因時，若發現不同要因間彼此有因果關係時，要改用 (A)系統圖 (B)親和圖 (C)柏拉圖 (D)關聯圖。","D"],[826,"單元二：第三章 品質分析方法與應用","在直方圖的分佈形態中，次數在中心附近出現最多，離開中心逐漸減少且左右對稱，顯示品質特性處在安定狀態的是： (A)鋸齒型 (B)高原型 (C)常態型 (D)雙峰型。","C"],[827,"單元二：第三章 品質分析方法與應用","管制圖中心線的所在位置，分別加減幾個標準差而成為管制上界線與下界線？ (A)一個 (B)二個 (C)三個
