度，以及下列何項成為新的品管標的？ (A)流程 (B)組織 (C)成本 (D)進度。","A"],[2462,"單元二：第十一章 工程品質稽核","管理品質技術的探討，從工學院的知識領域，跨入了商學院，建構一個持續生產優良品質的經營環境，也因此誕生了下列何項？ (A)品管制度 (B)稽核制度 (C)經營制度 (D)矯正制度。","B"],[2463,"單元二：第十一章 工程品質稽核","當品質以下列何項為主後，傳統品管或品保單位的功能與組織定位也產生重大的改變？ (A)成本 (B)保證 (C)管理 (D)管制。","C"],[2464,"單元二：第十一章 工程品質稽核","品管單位(人員)驗證品質的目的，是為了下列何項？ (A)確認管理系統是否正常與有效運作 (B)確認產品的品質 (C)確認統計技術是否完備 (D)確認生產人員的員額是否足夠。","A"],[2465,"單元二：第十一章 工程品質稽核","依據公共工程品質管理作業要點，承包商實施稽核的目的是下列何項？ (A)驗證公司是否符合ISO 9000標準 (B)確認核定的品質計畫被落實執行 (C)確認組織所擁有整體資源的表現 (D)確認整個工程技術的範疇。","B"],[2466,"單元二：第十一章 工程品質稽核","監造單位透過下列何項，確實掌握承包商品質計畫執行狀況，以及監造計畫的執行成效？ (A)稽核 (B)查證 (C)評鑑 (D)查驗。","A"],[2467,"單元二：第十一章 工程品質稽核","為能建立全球共識，國際規範組織以下列何項為架構基礎，於西元1986年發佈ISO 9000系列標準規範？ (A)品質管制制度 (B)品質稽核制度 (C)品質保證制度 (D)品質管理制度。","C"],[2468,"單元二：第十一章 工程品質稽核","為能建立全球共識，國際規範組織除品質架構基礎外，並納入經營所需的何項觀念，於西元1986年發佈ISO 9000系列標準規範？ (A)品質管制 (B)品質成本 (C)品質保證 (D)品質管理。","B"],[2469,"單元二：第十一章 工程品質稽核","我國亦於民國七十九年翻譯ISO 9000系列內容，正式公佈品質管理國家標準為CNS？ (A)14001 (B)27001 (C)12860 (D)12680。","D"],[2470,"單元二：第十一章 工程品質稽核","在國家標準品質管理系統基本原理與詞彙的標準中，將稽核這項工作明確的定位在品質管理系統的何種範疇？ (A)評估 (B)保證 (C)執行 (D)改正。","A"],[2471,"單元二：第十一章 工程品質稽核","係用下列何種方式，決定品質管理系統要求所達成的程度？ (A)評鑑 (B)稽核 (C)查驗 (D)查證。","B"],[2472,"單元二：第十一章 工程品質稽核","係用下列何項，以評鑑品質管理系統的效果與鑑別改進的機會？ (A)稽核評估 (B)稽核準則 (C)稽核發現 (D)稽核證據。","C"],[2473,"單元二：第十一章 工程品質稽核","公共工程委員會考量營建產業客觀環境因素，公共工程品質管理的標準，是採用下列何項？ (A)ISO 9001 (B)ISO 9000 (C)公共工程施工品質管理作業要點 (D)CNS 12680。","C"],[2474,"單元二：第十一章 工程品質稽核","品質計畫與監造計畫(品質系統)的內容中，下列何項的内涵不是援引國家標準的精神？ (A)責任與職權 (B)量測 (C)分析 (D)紀錄。","D"],[2475,"單元二：第十一章 工程品質稽核","承包商依據作業要點所執行的稽核，是由組織本身或其代表者為其內部目的所執行者，稱為下列何項？ (A)第一者稽核 (B)第二者稽核 (C)第三者稽核 (D)查核。","A"],[2476,"單元二：第十一章 工程品質稽核","營造廠對工地工務所之稽核，稱為下列何項？ (A)外部稽核 (B)第一者稽核 (C)第二者稽核 (D)第三者稽核。","B"],[2477,"單元二：第十一章 工程品質稽核","監造單位以主辦/管機關核定的監造計畫為基礎，確認監造計畫的落實成效，稱為下列何項？ (A)第一者稽核 (B)第二者稽核 (C)第三者稽核 (D)查核。","A"],[2478,"單元二：第十一章 工程品質稽核","監造單位針對承包商的品質系統所做的效果鑑別，稱為下列何項？ (A)第一者稽核 (B)第二者稽核 (C)第三者稽核 (D)查核。","B"],[2479,"單元二：第十一章 工程品質稽核","監造單位的稽核不包括下列何項？ (A)第一者稽核 (B)第二者稽核 (C)第三者稽核 (D)內部稽核。","C"],[2480,"單元二：第十一章 工程品質稽核","下列何項單位都會定期與不定期的依據工程進展，對特定工程實施查核？ (A)主管機關 (B)監造單位 (C)公共工程委員會 (D)工程主管機關與公共工程委員會。","D"],[2481,"單元二：第十一章 工程品質稽核","定期與不定期的依據工程進展，對特定工程實施查核，這種已經跳脫契約甲、乙方的查核，應可歸類為下列何項之稽核？ (A)第一者稽核 (B)第二者稽核 (C)第三者稽核 (D)內部稽核。","C"],[2482,"單元二：第十一章 工程品質稽核","以驗證主辦機關或其委託或自辦的監造單位是否落實計畫與發揮功效為目標，為下列何項之稽核？ (A)第一者稽核 (B)第二者稽核 (C)公共工程委員的稽核 (D)工程主管機關的稽核。","D"],[2483,"單元二：第十一章 工程品質稽核","除對施工團隊是否落實契約規定為稽核重點外，對其所頒布之各項行政命令是否被落實與其執行成效，亦應作為稽核的目標，為下列何項之稽核？ (A)行政院公共工程委員會的查核 (B)第一者稽核 (C)第二者稽核 (D)內部稽核。","A"],[2484,"單元二：第十一章 工程品質稽核","我們應以下列何項為核心，描繪出國內落實公共工程品質的一個管理體系？ (A)ISO 9001 (B)ISO 9000 (C)公共工程施工品質管理作業要點 (D)CNS 12680。","C"],[2485,"單元二：第十一章 工程品質稽核","依據工程管理與專案需求所制訂的標準作業程序，下列何項為執行稽核的準則？ (A)品質檢驗標準 (B)公共工程施工品質管理作業要點 (C)監造、品質、施工計畫 (D)主要稽核計畫。","C"],[2486,"單元二：第十一章 工程品質稽核","對稽核的定義為:以系統的、獨立的及下列何項之過程，做客觀的評估？ (A)證據化 (B)文件化 (C)品質化 (D)準則化。","B"],[2487,"單元二：第十一章 工程品質稽核","對稽核的定義為:以文件化、獨立的及下列何項之過程，做客觀的評估？ (A)證據的 (B)準則的 (C)責任的 (D)系統的。","D"],[2488,"單元二：第十一章 工程品質稽核","對稽核的定義為:以系統的、文件化及下列何項之過程，做客觀的評估？ (A)證據的 (B)準則的 (C)獨立的 (D)明確的。","C"],[2489,"單元二：第十一章 工程品質稽核","用以獲得稽核證據，並對他做客觀的評估，以決定下列何項所滿足之程度？ (A)稽核準則 (B)稽核方法 (C)稽核目標 (D)稽核原則。","A"],[2490,"單元二：第十一章 工程品質稽核","「作為依據的一組政策、程序或要求」是下列何項之定義？ (A)稽核 (B)準則 (C)查核 (D)證據。","B"],[2491,"單元二：第十一章 工程品質稽核","承包商與監造單位若能落實執行計畫承諾，工程品質應能確保，若再輔以下列何項，讓工程品質進入良性循環？ (A)主管機關與工程會的工程查核 (B)ISO 9001 (C)第二者稽核 (D)CNS 12680。","A"],[2492,"單元二：第十一章 工程品質稽核","關於品質稽核程序，下列何項敘述正確？ (A)查證工作因查證對象而異 (B)查證工作因執行者而異 (C)作業法則因人而異 (D)作業程序幾乎舉世皆然，不論內外或深淺。","D"],[2493,"單元二：第十一章 工程品質稽核","品質稽核的作業程序幾乎舉世皆然，不論內外或深淺。此處所指「內外」是指下列何項？ (A)主管機關 (B)監造單位 (C)承包商 (D)稽核小組。","B"],[2494,"單元二：第十一章 工程品質稽核","品質稽核的作業程序幾乎舉世皆然，不論內外或深淺。此處所指「深淺」是指下列何項？ (A)稽核要求改善件數與時限之規定 (B)稽核時間之長短 (C)稽核內容之多寡 (D)制度稽核與符合度稽核。","D"],[2495,"單元二：第十一章 工程品質稽核","品質稽核的目的，是在確認下列何項？ (A)品管及技術作業規範 (B)企業或組織作業規範 (C)品質系統的執行成效 (D)材料及施工規範。","C"],[2496,"單元二：第十一章 工程品質稽核","稽核計畫與時程，為下列何項時機的工作？ (A)稽核前 (B)稽核中 (C)稽核後 (D)以上皆非。","A"],[2497,"單元二：第十一章 工程品質稽核","通知與資料收集，為下列何項時機的工作？ (A)稽核前 (B)稽核中 (C)稽核後 (D)以上皆非。","A"],[2498,"單元二：第十一章 工程品質稽核","成立稽核組織，為下列何項時機的工作？ (A)稽核前 (B)稽核中 (C)稽核後 (D)以上皆非。","A"],[2499,"單元二：第十一章 工程品質稽核","編寫稽核查對表，為下列何項時機的工作？ (A)稽核前 (B)稽核中 (C)稽核後 (D)以上皆非。","A"],[2500,"單元二：第十一章 工程品質稽核","為釐清每一項稽核工作的目的與範圍，稽核執行單位應就其品質系統之內涵及參與單位之多寡，研定整體品質稽核計畫稱為？ (A)稽核時程計畫 (B)主要品質計畫 (C)主要稽核計畫 (D)主要查核計畫。","C"],[2501,"單元二：第十一章 工程品質稽核","當主要稽核計畫訂定後，應該由何種人員安排稽核時程？ (A)稽核組長 (B)觀察員 (C)稽核員 (D)品管人員。","D"],[2502,"單元二：第十一章 工程品質稽核","當主要稽核計畫訂定後，對於稽核工作的安排，下列何項為非？ (A)安排時段的長短有一定的法則 (B)就工作現況安排日常稽核工作 (C)就稽核人力資源安排日常稽核工作 (D)完全視管理階層所提供的資源。","A"],[2503,"單元二：第十一章 工程品質稽核","當主要稽核計畫訂定後，應就安排日常稽核工作，這種安排稱之為下列何項？ (A)通知與資料收集 (B)稽核時程 (C)編寫稽核查對表 (D)稽核作業之規劃。","B"],[2504,"單元二：第十一章 工程品質稽核","下列何項不屬於稽核前的工作？ (A)稽核計畫與時程 (B)通知與資料收集 (C)成立稽核組織 (D)缺失之追蹤列管。","D"],[2505,"單元二：第十一章 工程品質稽核","下列何項屬於稽核前的工作？ (A)稽核前會議 (B)執行稽核 (C)編寫稽核查對表 (D)簽發稽核報告。","C"],[2506,"單元二：第十一章 工程品質稽核","稽核前應使用下列哪一表單訂定稽核頻率？ (A)稽核計畫表 (B)稽核計畫時程管制表 (C)稽核查對表 (D)稽核通知。","B"],[2507,"單元二：第十一章 工程品質稽核","監造單位稽核的目的是確認承包商品管作業符合其所提送的計畫，且能確實達成下列何項？ (A)契約規定 (B)主要稽核計畫規定 (C)稽核查對表規定 (D)稽核準則規定。","A"],[2508,"單元二：第十一章 工程品質稽核","監造單位原則上應針對承包商所提送的計畫，於下列何項時機，實施該計畫第一次稽核？ (A)該計畫核定時 (B)該計畫簽約時 (C)該計畫開工後一段時限內 (D)該計畫完工時。","C"],[2509,"單元二：第十一章 工程品質稽核","監造單位實施第一次稽核後，依工程之規模大小及下列何項，執行往後的定期稽核？(A)契約金額 (B)分項施工計畫的數量 (C)稽核準則 (D)工程期程長短。","D"],[2510,"單元二：第十一章 工程品質稽核","稽核計畫與時程，對承包商而言，稽核的安排可自契約啟始日至少在多少天內，應執行第一次品質稽核？ (A)30天內 (B)60天內 (C)90天內 (D)180天內。","C"],[2511,"單元二：第十一章 工程品質稽核","承包商實施第一次稽核，主要查證下列何項？ (A)品質管理符合度與成效 (B)品質系統建立之狀況 (C)公司之品質管理方案 (D)契約工作之實際執行狀況。","B"],[2512,"單元二：第十一章 工程品質稽核","承包商實施第一次稽核，主要查證下列何項？ (A)評估品質系統與實務需求之落差性 (B)評估品質系統執行有效性 (C)公司之品質管理方案 (D)人員對系統內容之認知。","D"],[2513,"單元二：第十一章 工程品質稽核","實施第一次稽核後，往後至少多久執行一次「符合度與成效稽核」？ (A)每季 (B)每月 (C)每半年 (D)每周。","A"],[2514,"單元二：第十一章 工程品質稽核","對承包商而言，執行「符合度與成效稽核」，下列何項敘述為非？ (A)查證契約工作之實際執行狀況 (B)查證公司之品質管理方案 (C)人員對系統內容之認知 (D)定期評估品質系統執行有效性。","C"],[2515,"單元二：第十一章 工程品質稽核","對承包商而言，執行「符合度與成效稽核」，查證下列何項間之差異程度？ (A)監造計畫 (B)施工計畫 (C)職安衛計畫 (D)品質計畫。","D"],[2516,"單元二：第十一章 工程品質稽核","對承包商而言，執行「符合度與成效稽核」，綜合管理制度及符合度之查證內容，據以進行改善矯正或下列何項之檢討？ (A)可行性 (B)成效性 (C)落差性 (D)符合性。","A"],[2517,"單元二：第十一章 工程品質稽核","執行該分項作業相關品質作業之稽核，依據所研訂之分項施工計畫作業規定，查證下列何項人員對計畫作業的瞭解程度？ (A)品管人員 (B)工地主任 (C)作業人員 (D)公司管理階層。","C"],[2518,"單元二：第十一章 工程品質稽核","對承包商要求，每一分項施工計畫核定後多少天内，必須執行該分項作業相關品質作業之稽核？ (A)20天内 (B)30天内 (C)40天内 (D)50天內。","B"],[2519,"單元二：第十一章 工程品質稽核","品管人員得視實際狀況合併相關稽查項目併案辦理稽核，惟範圍以多少天内為度？ (A)20天内 (B)30天内 (C)40天内 (D)50天內。","B"],[2520,"單元二：第十一章 工程品質稽核","當稽核時程排定後，品管人員(監造單位)下列何者為非？ (A)告知稽核範圍 (B)知選定雙方都方便的日期 (C)於行前適當日期內，書面通知受稽核單位 (D)應先正式的與受稽核單位聯繫。","D"],[2521,"單元二：第十一章 工程品質稽核","在稽核行前書面通知受稽核單位時，稽核通知內容，不需包括下列何項？ (A)稽核成員及希望對方配合事項 (B)目的、範圍 (C)稽核組長的考核標準 (D)日期、時間。","C"],[2522,"單元二：第十一章 工程品質稽核","確定稽核時程後，品管人員(監造單位)應針對主要稽核計畫所訂定之目的與範圍，蒐集與彙整相關資料，內容不包括下列何項？ (A)工程契約 (B)檢測計畫 (C)規範(標準) (D)歷次稽核報告。","A"],[2523,"單元二：第十一章 工程品質稽核","在確定稽核時程後，品管人員應蒐集相關資料，若以往已有稽核紀錄，則應一併取得下列何項文件？ (A)程序書 (B)工作說明書 (C)規範(標準) (D)歷次稽核報告。","D"],[2524,"單元二：第十一章 工程品質稽核","執行稽核時則必須完全獨立，下列何項敘述為非？ (A)不可以用主觀的好惡去影響判斷 (B)嚴謹的評估 (C)以日常協助專案的角色 (D)提出前瞻的建議。","C"],[2525,"單元二：第十一章 工程品質稽核","執行品質稽核工作的稽核組織成員通常可分為下列幾種？ (A)5種 (B)4種 (C)3種 (D)2種。","B"],[2526,"單元二：第十一章 工程品質稽核","下列何項人員不屬於品質稽核組織的成員？ (A)稽核組長 (B)觀察員 (C)專家 (D)品管人員。","D"],[2527,"單元二：第十一章 工程品質稽核","稽核作業之規劃、聯繫與工作分配，為下列何項人員工作項目？ (A)專家 (B)稽核組長 (C)稽核員 (D)公司管理階層。","B"],[2528,"單元二：第十一章 工程品質稽核","參與稽核工作成員之擇選，為下列何項人員工作項目？ (A)專家 (B)稽核員 (C)稽核組長 (D)公司管理階層。","C"],[2529,"單元二：第十一章 工程品質稽核","指揮稽核工作之執行，為下列何項人員工作項目？ (A)專家 (B)稽核組長 (C)稽核員 (D)公司管理階層。","B"],[2530,"單元二：第十一章 工程品質稽核","稽核報告之撰寫，為下列何項人員工作項目？ (A)稽核組長 (B)專家 (C)稽核員 (D)公司管理階層。","A"],[2531,"單元二：第十一章 工程品質稽核","稽核員於作業期間之表現考核，為下列何項人員工作項目？ (A)專家 (B)稽核員 (C)公司管理階層 (D)稽核組長。","D"],[2532,"單元二：第十一章 工程品質稽核","下列何項不於稽核組長之工作？ (A)稽核作業之規劃與工作分配 (B)參與稽核工作成員之選擇 (C)稽核查對表之編擬 (D)稽核報告之撰寫。","C"],[2533,"單元二：第十一章 工程品質稽核","下列何項不屬於稽核組長的工作範圍？ (A)在被稽核單位處召開「稽核前會議」介紹雙方與會人員 (B)依事前規劃之稽核查對表所列事項逐項查核 (C)主持稽核後會議 (D)對稽核員於作業期間之表現進行考核。","B"],[2534,"單元二：第十一章 工程品質稽核","稽核查對表之編擬，為下列何項人員工作？ (A)專家 (B)稽核組長 (C)觀察員 (D)稽核員。","D"],[2535,"單元二：第十一章 工程品質稽核","執行稽核，為下列何項人員所負責的工作項目？ (A)稽核組長及稽核員 (B)稽核員 (C)稽核員及專家 (D)稽核員及觀察員。","B"],[2536,"單元二：第十一章 工程品質稽核","下列何項人員於稽核過程中，僅提供專技知識諮詢，不實際執行稽核作業？ (A)稽核組長 (B)稽核員 (C)專家 (D)觀察員。","C"],[2537,"單元二：第十一章 工程品質稽核","稽核組織的成員中，主要是下列何項人員？ (A)稽核組長及稽核員 (B)稽核員 (C)稽核員及專家 (D)稽核組長及專家。","A"],[2538,"單元二：第十一章 工程品質稽核","稽核組織成員中，視實際需求邀請或選派，是下列何項人員？ (A)專家 (B)專家及觀察員 (C)觀察員 (D)稽核組長及專家。","B"],[2539,"單元二：第十一章 工程品質稽核","由於稽核工作涉及許多溝通與調查技巧，稽核員必須具備下列何項經驗條件？ (A)曾擔任工地主任三年以上 (B)具備工程技術專業且有管理背景 (C)曾擔任專案經理且通過國家考試 (D)受過稽核訓練，並曾多次參與稽核工作者。","D"],[2540,"單元二：第十一章 工程品質稽核","由於稽核工作涉及許多溝通與調查技巧，稽核員曾以下列何項身分，多次參與稽核工作者？ (A)專家 (B)觀察員 (C)稽核承辦人 (D)稽核組長。","B"],[2541,"單元二：第十一章 工程品質稽核","稽核員之進階，為下列何項人員？ (A)稽核組長 (B)公司管理階層 (C)專家 (D)品管人員。","A"],[2542,"單元二：第十一章 工程品質稽核","稽核查對表編擬完成後，必須經過下列何項人員的審核？ (A)稽核員 (B)專家 (C)稽核組長 (D)公司管理階層。","C"],[2543,"單元二：第十一章 工程品質稽核","稽核查對表對稽核者的益處，為下列何項？ (A)執行稽核作業時之工作導引 (B)協助接受稽核單位準備稽核資料，以供驗證 (C)有助於掌握工作重點 (D)已經稽核查證事務之佐證。","A"],[2544,"單元二：第十一章 工程品質稽核","稽核查對表對稽核者的益處，為下列何項？ (A)有助於掌握工作重點 (B)協助接受稽核單位準備稽核資料，以供驗證 (C)有助稽核員掌握作業進度 (D)已經稽核查證事務之佐證。","C"],[2545,"單元二：第十一章 工程品質稽核","稽核查對表對稽核者的益處，為下列何項？ (A)已經稽核查證事務之佐證 (B)協助接受稽核單位準備稽核資料，以供驗證 (C)有助於掌握工作重點 (D)稽核組長與稽核員的溝通橋梁。","D"],[2546,"單元二：第十一章 工程品質稽核","稽核查對表對稽核者的益處，為下列何項？ (A)協助接受稽核單位準備稽核資料，以供驗證 (B)有助於稽核員間的技術交流與傳承 (C)有助於掌握工作重點 (D)已經稽核查證事務之佐證。","B"],[2547,"單元二：第十一章 工程品質稽核","稽核查對表對稽核者的益處，為下列何項？ (A)稽核作業中之作業登錄簿 (B)協助接受稽核單位準備稽核資料，以供驗證 (C)有助於掌握工作重點 (D)已經稽核查證事務之佐證。","A"],[2548,"單元二：第十一章 工程品質稽核","稽核查對表對稽核者的益處，為下列何項？ (A)協助接受稽核單位準備稽核資料，以供驗證 (B)已經稽核查證事務之佐證 (C)提供稽核組長編寫稽核報告時之參考佐證 (D)有助於掌握工作重點。","C"],[2549,"單元二：第十一章 工程品質稽核","稽核查對表對接受稽核者的益處，為下列何項？ (A)執行稽核作業時之工作導引 (B)有助於掌握工作重點 (C)稽核作業中之作業登錄簿 (D)有助稽核員掌握作業進度。","B"],[2550,"單元二：第十一章 工程品質稽核","稽核查對表對接受稽核者的益處，為下列何項？ (A)協助接受稽核單位準備稽核資料，以供驗證執行稽核作業時之工作導引 (B)執行稽核作業時之工作導引 (C)有助稽核員掌握作業進度 (D)提供稽核組長編寫稽核報告時之參考佐證。","A"],[2551,"單元二：第十一章 工程品質稽核","稽核查對表對接受稽核者的益處，為下列何項？ (A)執行稽核作業時之工作導引 (B)稽核組長與稽核員的溝通橋梁 (C)稽核作業中之作業登錄簿 (D)已經稽核查證事務之佐證。","D"],[2552,"單元二：第十一章 工程品質稽核","制訂稽核查對表的原因，為下列何項？ (A)免除稽核組織投入管理資源 (B)有效率的執行稽核工作 (C)增加被稽核者人力時間 (D)增加稽核員思索稽核標的物所耗時間。","B"],[2553,"單元二：第十一章 工程品質稽核","稽核人員專業考量關鍵之一，為下列何項？ (A)技術交流與傳承 (B)稽核查對表的完整性 (C)與稽核組長的溝通 (D)如何有效率的完成。","D"],[2554,"單元二：第十一章 工程品質稽核","接受稽核單位瞞過稽核人員的最佳法則，為下列何項？ (A)作弊 (B)造假 (C)依規定行事 (D)隱匿事實。","C"],[2555,"單元二：第十一章 工程品質稽核","稽核臨場的變化與適時的調整，仰賴於下列何項？ (A)稽核員的智慧與敏銳的反應 (B)稽核查對表 (C)依規定行事(D)主要稽核計畫。","A"],[2556,"單元二：第十一章 <script>
'use strict';

/* ============================================================
 * 小工具
 * ============================================================ */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
  return el;
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function hash(s) {
  let x = 5381;
  for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
  return (x >>> 0).toString(36);
}

function normLetter(s) {
  s = String(s == null ? '' : s).trim().toUpperCase()
    .replace(/[Ａ-Ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  return s.charAt(0);
}

let toastTimer;
function toast(msg, ms = 3500) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = h('div', { class: 'toast' }, msg);
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), ms);
}

/* ============================================================
 * 題型登錄表  ——  要新增題型，只要多呼叫一次 registerType()
 *
 * 每個題型需提供：
 *   label            顯示名稱
 *   aliases          Excel「題型」欄可以寫的名稱
 *   parse(rec)       把 Excel 一列 {stem, answer, ...} 轉成題目物件，
 *                    格式不符就回傳 null（會被歸為「無法辨識」）
 *   render(q, ctx)   畫出作答區。ctx = {value, revealed, locked, onChange(v)}
 *   isAnswered(q,v)  是否已作答
 *   isCorrect(q,v)   是否答對
 *   fmt(q,v)         把使用者答案轉成文字（結果頁用）
 *   fmtAnswer(q)     把正確答案轉成文字
 * ============================================================ */
const TYPES = {};
function registerType(id, def) { TYPES[id] = Object.assign({ id }, def); }

/* ---- 選擇題（四選一，選項寫在題目文字內：(A)…(B)…(C)…(D)…） ---- */
registerType('choice', {
  label: '選擇題',
  aliases: ['選擇題', '選擇', 'choice', 'mc'],
  parse(rec) {
    const t = rec.stem;
    const starts = [...t.matchAll(/[(（]A[)）]/g)];
    for (let i = starts.length - 1; i >= 0; i--) {
      const a = starts[i].index;
      const m = t.slice(a).match(/^[(（]A[)）]([\s\S]*?)[(（]B[)）]([\s\S]*?)[(（]C[)）]([\s\S]*?)[(（]D[)）]([\s\S]*)$/);
      if (!m) continue;
      const answer = normLetter(rec.answer);
      const stem = t.slice(0, a).trim();
      if (!stem || !answer || !'ABCD'.includes(answer)) return null;
      return { stem, options: m.slice(1).map(s => s.trim()), answer };
    }
    return null;
  },
  render(q, ctx) {
    return h('div', { class: 'opts' }, q.options.map((text, i) => {
      const L = 'ABCD'[i];
      let cls = 'opt';
      if (ctx.value === L) cls += ' sel';
      if (ctx.revealed) {
        if (L === q.answer) cls += ' right';
        else if (ctx.value === L) cls += ' wrong';
      }
      return h('button', { class: cls, type: 'button', disabled: ctx.locked, onclick: () => ctx.onChange(L) },
        h('span', { class: 'key' }, L), h('span', { class: 'txt' }, text));
    }));
  },
  isAnswered: (q, v) => !!v,
  isCorrect: (q, v) => v === q.answer,
  fmt(q, v) {
    if (!v) return '未作答';
    return `(${v}) ${q.options['ABCD'.indexOf(v)] || ''}`;
  },
  fmtAnswer(q) { return this.fmt(q, q.answer); },
});

/* 之後要加是非題／填空題，照上面的格式再 registerType('truefalse', {...}) 即可 */

/* ============================================================
 * Excel 列 → 題庫
 * 必要欄位：題目、答案
 * 選用欄位：序號、課程名稱（單元）、題型、解析
 * ============================================================ */
function findType(rec) {
  const want = String(rec.type || '').trim().toLowerCase();
  if (want) {
    for (const t of Object.values(TYPES)) {
      if (t.aliases.some(a => a.toLowerCase() === want)) return t.parse(rec) ? t : null;
    }
    return null;
  }
  // 沒有「題型」欄就自動判斷
  return Object.values(TYPES).find(t => t.parse(rec)) || null;
}

function sheetToQuestions(rows, seen, out) {
  let hi = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const r = rows[i].map(x => String(x).trim());
    if (r.includes('題目') && r.includes('答案')) { hi = i; break; }
  }
  if (hi < 0) return { skipped: 0, found: false };
  const head = rows[hi].map(x => String(x).trim());
  const col = names => head.findIndex(x => names.includes(x));
  const c = {
    no: col(['序號', '編號', 'No']), unit: col(['課程名稱', '單元', '章節', '類別']),
    stem: col(['題目']), ans: col(['答案']), type: col(['題型']), exp: col(['解析', '說明']),
  };
  const get = (r, i) => (i < 0 || r[i] == null ? '' : String(r[i]).trim());
  let skipped = 0;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const stem = get(r, c.stem);
    if (!stem) continue;
    const rec = { stem, answer: get(r, c.ans), type: get(r, c.type), unit: get(r, c.unit) || '未分類', explain: get(r, c.exp) };
    const T = findType(rec);
    if (!T) { skipped++; continue; }
    const parsed = T.parse(rec);
    let id = hash(rec.unit + '|' + stem);
    if (seen[id] != null) id += '_' + (++seen[id]); else seen[id] = 0;
    const no = parseInt(get(r, c.no), 10);
    out.push(Object.assign({ id, type: T.id, unit: rec.unit, no: isNaN(no) ? null : no, explain: rec.explain }, parsed));
  }
  return { skipped, found: true };
}

function buildBank(src) {
  const questions = [], seen = {};
  let skipped = 0, found = false;
  for (const rows of src.sheets) {
    const r = sheetToQuestions(rows, seen, questions);
    skipped += r.skipped;
    found = found || r.found;
  }
  if (!found) throw new Error('找不到標題列：Excel 需要有「題目」與「答案」欄位');
  if (!questions.length) throw new Error('沒有讀到任何可用的題目，請確認題目格式');
  const units = [];
  const idx = {};
  for (const q of questions) {
    if (idx[q.unit] == null) { idx[q.unit] = units.length; units.push({ name: q.unit, count: 0 }); }
    units[idx[q.unit]].count++;
  }
  return { name: src.name, questions, units, skipped };
}

/* ============================================================
 * 狀態
 * ============================================================ */
const S = {
  bank: null,
  screen: 'home',
  session: null,   // 進行中的作答
  result: null,    // 剛完成的結果
  settings: Object.assign({ units: null, count: 20, random: true, mode: 'practice' }, store.get('exam.settings', {})),
};
const Q = {};      // id → 題目

const saveSettings = () => store.set('exam.settings', S.settings);
const persistSession = () => S.session ? store.set('exam.session', S.session) : store.del('exam.session');

function getWrong() {
  const ids = store.get('exam.wrong', []).filter(id => Q[id]);
  return new Set(ids);
}
function record(q, ok) {
  const w = getWrong();
  if (!ok) w.add(q.id);
  else if (S.session && S.session.from === 'wrong') w.delete(q.id);
  store.set('exam.wrong', [...w]);
}

function setBank(bank) {
  S.bank = bank;
  for (const k of Object.keys(Q)) delete Q[k];
  bank.questions.forEach(q => Q[q.id] = q);
}

function loadBank() {
  const saved = store.get('exam.bank', null);
  if (saved) {
    try { return buildBank(saved); } catch (e) { store.del('exam.bank'); }
  }
  if (window.BUILTIN) return buildBank(window.BUILTIN);
  return null;
}

/* ============================================================
 * 匯入 Excel
 * ============================================================ */
function importBuffer(buf, filename) {
  const wb = XLSX.read(buf, { type: 'array' });
  const sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true }));
  const src = { name: filename.replace(/\.(xlsx|xls|csv)$/i, ''), sheets };
  const bank = buildBank(src);        // 失敗會丟例外，不會蓋掉原本的題庫
  const saved = store.set('exam.bank', src);
  setBank(bank);
  S.settings.units = null;
  saveSettings();
  store.del('exam.session');
  S.session = null;
  return { bank, saved };
}

function pickExcel() {
  const input = h('input', { type: 'file', accept: '.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  input.addEventListener('change', async () => {
    const f = input.files[0];
    if (!f) return;
    try {
      const { bank, saved } = importBuffer(await f.arrayBuffer(), f.name);
      let msg = `匯入成功：共 ${bank.questions.length} 題`;
      if (bank.skipped) msg += `\n有 ${bank.skipped} 題格式無法辨識，已略過`;
      if (!saved) msg += '\n題庫太大，無法保存在手機上，關閉後需要重新匯入';
      toast(msg, 5000);
      go('home');
    } catch (e) {
      toast('匯入失敗：' + e.message, 6000);
    }
  });
  input.click();
}

/* ============================================================
 * 畫面
 * ============================================================ */
function go(screen, keepScroll) {
  S.screen = screen;
  const view = { home: viewHome, quiz: viewQuiz, result: viewResult }[screen];
  $app.replaceChildren(view());
  if (!keepScroll) window.scrollTo(0, 0);
}
const $app = document.getElementById('app');

function startSession(ids, mode, from) {
  S.session = { ids, answers: {}, idx: 0, mode, from };
  persistSession();
  go('quiz');
}

/* ---- 首頁 ---- */
function viewHome() {
  const b = S.bank, st = S.settings;
  const sel = new Set(st.units || b.units.map(u => u.name));
  const wrong = getWrong();
  const pool = () => b.questions.filter(q => sel.has(q.unit));
  const info = h('div', { class: 'hint' });
  const startBtn = h('button', { class: 'btn pri block', type: 'button' }, '開始作答');
  const refresh = () => {
    const n = pool().length;
    info.textContent = `已選 ${sel.size} 個單元，共 ${n} 題`;
    startBtn.disabled = n === 0;
    st.units = sel.size === b.units.length ? null : [...sel];
    saveSettings();
  };

  const boxes = b.units.map(u => {
    const cb = h('input', { type: 'checkbox', checked: sel.has(u.name) });
    cb.addEventListener('change', () => { cb.checked ? sel.add(u.name) : sel.delete(u.name); refresh(); });
    return { cb, u, el: h('label', { class: 'unit' }, cb, h('span', {}, u.name), h('span', { class: 'n' }, u.count)) };
  });
  const setAll = on => { boxes.forEach(x => { x.cb.checked = on; on ? sel.add(x.u.name) : sel.delete(x.u.name); }); refresh(); };

  const countSel = h('select', {}, [10, 20, 30, 50, 100, 0].map(n =>
    h('option', { value: n, selected: st.count === n }, n === 0 ? '全部' : n + ' 題')));
  countSel.addEventListener('change', () => { st.count = +countSel.value; saveSettings(); });

  const seg = (opts, cur, onPick) => {
    const wrap = h('div', { class: 'seg' });
    opts.forEach(([val, label]) => {
      const b = h('button', { type: 'button', class: val === cur ? 'on' : '' }, label);
      b.addEventListener('click', () => { onPick(val); wrap.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
      wrap.append(b);
    });
    return wrap;
  };

  startBtn.addEventListener('click', () => {
    let ids = pool().map(q => q.id);
    if (st.random) ids = shuffle(ids);
    if (st.count > 0) ids = ids.slice(0, st.count);
    startSession(ids, st.mode, 'bank');
  });

  const s = S.session;
  const resume = s && s.ids.every(id => Q[id]) ? h('div', { class: 'card' },
    h('h2', {}, '有一份未完成的作答'),
    h('div', { class: 'sub' }, `${s.mode === 'exam' ? '模擬測驗' : '練習'}，做到第 ${s.idx + 1} / ${s.ids.length} 題`),
    h('div', { class: 'row', style: 'margin-top:10px' },
      h('button', { class: 'btn pri grow', type: 'button', onclick: () => go('quiz') }, '繼續'),
      h('button', { class: 'btn', type: 'button', onclick: () => { if (confirm('放棄這份作答？')) { S.session = null; persistSession(); go('home'); } } }, '放棄'))) : null;

  const node = h('div', {},
    h('h1', {}, '題庫練習'),
    h('div', { class: 'sub' }, `${b.name}｜${b.questions.length} 題`),
    resume,
    h('div', { class: 'card' },
      h('div', { class: 'row between' }, h('h2', { style: 'margin:0' }, '選擇單元'),
        h('div', { class: 'row' },
          h('button', { class: 'btn small', type: 'button', onclick: () => setAll(true) }, '全選'),
          h('button', { class: 'btn small', type: 'button', onclick: () => setAll(false) }, '全不選'))),
      h('div', { class: 'units' }, boxes.map(x => x.el)),
      info),
    h('div', { class: 'card' },
      h('div', { class: 'row between' }, h('span', {}, '題數'), countSel),
      h('div', { style: 'margin-top:12px' }, h('div', { class: 'sub' }, '出題順序'),
        seg([[true, '隨機'], [false, '依序']], st.random, v => { st.random = v; saveSettings(); })),
      h('div', { style: 'margin-top:12px' }, h('div', { class: 'sub' }, '模式'),
        seg([['practice', '練習（即時對答案）'], ['exam', '模擬測驗（交卷才看）']], st.mode, v => { st.mode = v; saveSettings(); }))),
    startBtn,
    h('div', { class: 'card' },
      h('div', { class: 'row between' },
        h('div', {}, h('h2', { style: 'margin:0' }, '錯題本'), h('div', { class: 'sub' }, `目前 ${wrong.size} 題`)),
        h('div', { class: 'row' },
          h('button', { class: 'btn small', type: 'button', disabled: wrong.size === 0, onclick: () => { if (confirm('清空錯題本？')) { store.set('exam.wrong', []); go('home', true); } } }, '清空'),
          h('button', { class: 'btn pri small', type: 'button', disabled: wrong.size === 0, onclick: () => startSession(shuffle([...wrong]), 'practice', 'wrong') }, '練習錯題')))),
    h('div', { class: 'card' },
      h('h2', {}, '題庫'),
      h('div', { class: 'row' },
        h('button', { class: 'btn grow', type: 'button', onclick: pickExcel }, '匯入 Excel 題庫'),
        window.BUILTIN && store.get('exam.bank', null)
          ? h('button', { class: 'btn', type: 'button', onclick: () => { store.del('exam.bank'); setBank(buildBank(window.BUILTIN)); S.settings.units = null; toast('已還原內建題庫'); go('home'); } }, '還原內建')
          : null),
      h('div', { class: 'hint' }, 'Excel 需有「題目」「答案」欄；選填「課程名稱」「題型」「解析」。選擇題的選項寫在題目內，格式 (A)…(B)…(C)…(D)…')));
  refresh();
  return node;
}

/* ---- 作答 ---- */
function viewQuiz() {
  const s = S.session;
  if (!s) return viewHome();
  const q = Q[s.ids[s.idx]], T = TYPES[q.type];
  const total = s.ids.length, practice = s.mode === 'practice';
  const v = s.answers[q.id];
  const answered = T.isAnswered(q, v);
  const locked = practice && answered;

  const onChange = val => {
    if (locked) return;
    if (!practice && val === s.answers[q.id] && T.deselectable !== false) delete s.answers[q.id];
    else s.answers[q.id] = val;
    if (practice) record(q, T.isCorrect(q, val));
    persistSession();
    go('quiz', true);
  };

  const goto = i => { s.idx = i; persistSession(); go('quiz'); };
  const last = s.idx === total - 1;

  let feedback = null;
  if (practice && answered) {
    const ok = T.isCorrect(q, v);
    feedback = h('div', { class: 'fb ' + (ok ? 'ok' : 'bad') },
      ok ? '✔ 答對了' : '✘ 答錯了，正確答案：' + T.fmtAnswer(q),
      q.explain ? '\n' + q.explain : '');
  }

  return h('div', {},
    h('div', { class: 'row between' },
      h('button', { class: 'btn small', type: 'button', onclick: () => go('home') }, '‹ 離開'),
      h('span', { class: 'sub' }, `第 ${s.idx + 1} / ${total} 題`),
      practice ? h('span', { style: 'width:64px' }) : h('button', { class: 'btn small', type: 'button', onclick: () => finishSession(true) }, '交卷')),
    h('div', { class: 'bar' }, h('i', { style: `width:${(s.idx + 1) / total * 100}%` })),
    h('div', { class: 'card' },
      h('div', { class: 'tag' }, q.unit + (q.no ? `　#${q.no}` : '')),
      h('p', { class: 'stem' }, q.stem),
      T.render(q, { value: v, revealed: practice && answered, locked, onChange }),
      feedback),
    h('div', { class: 'nav' },
      h('button', { class: 'btn', type: 'button', disabled: s.idx === 0, onclick: () => goto(s.idx - 1) }, '上一題'),
      last
        ? h('button', { class: 'btn pri', type: 'button', onclick: () => finishSession(!practice) }, practice ? '看結果' : '交卷')
        : h('button', { class: 'btn pri', type: 'button', onclick: () => goto(s.idx + 1) }, '下一題')));
}

function finishSession(confirmUnanswered) {
  const s = S.session;
  const unanswered = s.ids.filter(id => !TYPES[Q[id].type].isAnswered(Q[id], s.answers[id])).length;
  if (confirmUnanswered && unanswered && !confirm(`還有 ${unanswered} 題未作答，確定要交卷嗎？`)) return;
  if (s.mode === 'exam') {
    for (const id of s.ids) {
      const q = Q[id], T = TYPES[q.type];
      if (T.isAnswered(q, s.answers[id])) record(q, T.isCorrect(q, s.answers[id]));
    }
  }
  S.result = { ids: s.ids, answers: s.answers, mode: s.mode, from: s.from };
  S.session = null;
  persistSession();
  go('result');
}

/* ---- 結果 ---- */
function viewResult() {
  const r = S.result;
  if (!r) return viewHome();
  const items = r.ids.map(id => {
    const q = Q[id], T = TYPES[q.type], v = r.answers[id];
    return { q, T, v, ok: T.isAnswered(q, v) && T.isCorrect(q, v) };
  });
  const right = items.filter(x => x.ok).length, total = items.length;
  const bad = items.filter(x => !x.ok);
  let showAll = false;
  const list = h('div', {});
  const drawList = () => {
    const shown = showAll ? items : bad;
    list.replaceChildren(...(shown.length ? shown.map(x => h('div', { class: 'wi' },
      h('div', { class: 'tag' }, x.q.unit + (x.q.no ? `　#${x.q.no}` : '')),
      h('p', { class: 'stem', style: 'margin-bottom:6px' }, x.q.stem),
      x.ok ? null : h('div', { class: 'me' }, '你的答案：' + x.T.fmt(x.q, x.v)),
      h('div', { class: 'ans' }, '正確答案：' + x.T.fmtAnswer(x.q)),
      x.q.explain ? h('div', { class: 'sub' }, x.q.explain) : null))
      : [h('div', { class: 'sub' }, '全部答對，太強了！')]));
  };
  drawList();
  const toggle = h('button', { class: 'btn small', type: 'button' }, '顯示全部題目');
  toggle.addEventListener('click', () => { showAll = !showAll; toggle.textContent = showAll ? '只看答錯的' : '顯示全部題目'; drawList(); });

  return h('div', {},
    h('h1', {}, r.mode === 'exam' ? '測驗結果' : '練習結果'),
    h('div', { class: 'card' },
      h('div', { class: 'score' }, `${Math.round(right / total * 100)}%`),
      h('div', { class: 'sub' }, `答對 ${right} / ${total} 題`)),
    h('div', { class: 'row' },
      h('button', { class: 'btn pri grow', type: 'button', disabled: bad.length === 0, onclick: () => startSession(shuffle(bad.map(x => x.q.id)), r.mode, 'wrong') }, `重做答錯的（${bad.length}）`),
      h('button', { class: 'btn grow', type: 'button', onclick: () => go('home') }, '回首頁')),
    h('div', { class: 'card' },
      h('div', { class: 'row between', style: 'margin-bottom:6px' }, h('h2', { style: 'margin:0' }, '題目檢討'), toggle),
      list));
}

/* ============================================================
 * 啟動
 * ============================================================ */
(function init() {
  const bank = loadBank();
  if (!bank) {
    $app.append(h('h1', {}, '題庫練習'), h('div', { class: 'card' }, h('p', {}, '還沒有題庫，請先匯入 Excel。'),
      h('button', { class: 'btn pri block', type: 'button', onclick: pickExcel }, '匯入 Excel 題庫')));
    return;
  }
  setBank(bank);
  const saved = store.get('exam.session', null);
  if (saved && saved.ids && saved.ids.every(id => Q[id])) S.session = saved;
  go('home');
})();
</script>
